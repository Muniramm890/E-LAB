    .canvas-container { width: 100%; max-width: 900px; height: 100%; max-height: 620px; background: rgba(4, 18, 32, 0.6); border: 1px solid var(--grid-line-strong); border-radius: 12px; box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.3); position: relative; overflow: hidden; display:flex; }

    table.ref-table th { background: var(--blueprint-md); color: var(--brass-lt); padding: 8px 6px; position: sticky; top:0; text-align:center; }
    table.ref-table td { padding: 7px 6px; text-align:center; border-bottom: 1px solid rgba(255,255,255,0.08); }

    .icon-chip { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; background: rgba(255,255,255,0.05); border: 1px solid var(--grid-line-strong); border-radius: 10px; padding: 8px 10px; color: var(--brass-lt); }

    .quiz-wrap { max-width: 560px; margin: 0 auto; text-align: center; }
    .quiz-progress { font-family:'IBM Plex Mono',monospace; color: var(--text-mid); margin-bottom: 14px; font-size:0.82rem; }
    .quiz-prompt { font-family:'Fraunces',serif; font-size: 1.45rem; margin-bottom: 22px; line-height:1.4; }
    .quiz-input-row { display:flex; gap:10px; justify-content:center; margin-bottom: 16px; flex-wrap: wrap; }
    .quiz-input-row input { width: 200px; padding: 12px; font-size:1.05rem; border-radius:8px; border:none; font-family:'IBM Plex Mono',monospace; text-align:center; }
    .quiz-btn { padding: 12px 22px; border-radius: 8px; border:none; background: var(--brass); color: white; font-weight:700; cursor:pointer; font-family:'IBM Plex Mono',monospace; }
    .quiz-btn:hover { background: var(--brass-lt); }
    .quiz-tf-row { display:flex; gap:14px; justify-content:center; margin-bottom:16px; }
    .quiz-tf-row button { flex:1; max-width:150px; padding:14px; border-radius:8px; border:none; font-weight:700; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:0.95rem; }
    .quiz-tf-row button.true-btn { background: var(--success); color:white; }
    .quiz-tf-row button.false-btn { background: var(--danger); color:white; }
    .quiz-feedback { padding: 14px; border-radius: 10px; margin-bottom: 16px; font-size: 0.9rem; }
    .quiz-feedback.correct { background: rgba(47,138,91,0.2); border:1px solid var(--success); }
    .quiz-feedback.wrong { background: rgba(193,69,47,0.2); border:1px solid var(--danger); }
    .timeline-step { background: rgba(255,255,255,0.05); border: 1px solid var(--grid-line-strong); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
    .timeline-step b { color: var(--brass-lt); }
    .expr-row { display:flex; align-items:center; justify-content:space-between; gap:10px; background: rgba(255,255,255,0.05); border:1px solid var(--grid-line-strong); border-radius:8px; padding:9px 14px; margin-bottom:8px; font-family:'IBM Plex Mono',monospace; font-size:0.86rem; flex-wrap: wrap; }
    .parity-chip { padding:4px 10px; border-radius: 14px; font-weight:700; font-size:0.72rem; flex:none; }
    .parity-chip.even { background: rgba(47,138,91,0.25); color:#7bdcaa; border:1px solid var(--success); }
    .parity-chip.odd { background: rgba(193,69,47,0.25); color:#f0a08c; border:1px solid var(--danger); }
    .dotgrid { display:grid; gap:4px; justify-content:center; }
    .dotcell { width:14px; height:14px; border-radius:50%; }
    .letter-input { width: 46px; padding:8px 0; text-align:center; border-radius:6px; border:none; font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:700; margin: 0 4px; }
    .crypt-line { font-family:'IBM Plex Mono',monospace; font-size:1.5rem; letter-spacing:3px; text-align:right; margin: 4px auto; max-width: 320px; }
    .crypt-op { text-align:left; color: var(--text-mid); }
    @media (max-width: 860px) {
        .sidebar { width: 86vw; } .module-title h1 { font-size: 1rem; }
        .toggle-btn { top: auto; bottom: 18px; right: -46px; width: 46px; height: 46px; border-radius: 50%; }
    }
    .sidebar-content::-webkit-scrollbar, .html-stage::-webkit-scrollbar { width: 8px; }
    .sidebar-content::-webkit-scrollbar-thumb, .html-stage::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 6px; }
    .html-stage::-webkit-scrollbar-thumb { background: var(--blueprint-lt); }
</style>

<body>

<header>
    <div class="brand-area">
        <a href="../index.html" class="back-btn">← E-Lab</a>
        <div class="module-title">
            <h1>Number Play</h1>
            <p>CLASS 8 · CHAPTER 05 · GANITA PRAKASH · INTERACTIVE ENGINE</p>
        </div>
    </div>
</header>

<div class="tabs-bar" id="tabsBar"></div>

<div class="workspace">
    <aside class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()" title="Show/hide panel">☰</button>
        <div class="sidebar-content" id="sidebarContent"></div>
    </aside>
    <main class="stage">
        <div class="canvas-container">
            <div id="stageContainer"></div>
        </div>
    </main>
</div>

<script>
// =========================================================================
// 1. MATH UTILITIES
// =========================================================================
const MathUtils = {
    randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; },
    digitsOf(num) { return String(Math.abs(Math.round(num))).split('').map(Number); },
    digitSum(num) { return this.digitsOf(num).reduce((s, d) => s + d, 0); },
    digitalRootSteps(num) {
        let n = Math.abs(Math.round(num));
        const steps = [n];
        while (n >= 10) { n = this.digitSum(n); steps.push(n); }
        return { steps, root: n };
    },
    isEven(n) { return n % 2 === 0; },
    parityLabel(n) { return this.isEven(n) ? 'Even' : 'Odd'; },
    classifyMod4(n) { return n % 4 === 0 ? { type: '4p', k: n / 4 } : { type: '4p+2', k: (n - 2) / 4 }; },
    gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; },
    lcm(a, b) { return Math.abs(a * b) / this.gcd(a, b); },
    factorsOf(n) { const f = []; for (let i = 1; i <= n; i++) if (n % i === 0) f.push(i); return f; },
    signCombos(count) {
        const n = count - 1;
        const total = Math.pow(2, n);
        const combos = [];
        for (let i = 0; i < total; i++) {
            const signs = [1];
            for (let pos = n - 1; pos >= 0; pos--) { signs.push(((i >> pos) & 1) === 0 ? 1 : -1); }
            combos.push(signs);
        }
        return combos;
    },
    evalSigned(nums, signs) { return nums.reduce((s, n, i) => s + signs[i] * n, 0); },
    altSum11(num) {
        const digits = this.digitsOf(num); // left to right, most significant first
        const rev = digits.slice().reverse(); // units digit first
        const parts = rev.map((d, i) => ({ d, sign: i % 2 === 0 ? 1 : -1 }));
        const total = parts.reduce((s, p) => s + p.sign * p.d, 0);
        return { parts: parts.slice().reverse(), total }; // back to left-to-right for display
    }
};

function checkDot(ok) {
    return `<span class="check-item"><span class="dot" style="background:${ok ? 'var(--success)' : '#c7bda0'}">${ok ? '✓' : '✕'}</span></span>`;
}
function dotGrid(count, cols, color) {
    color = color || '#2f75ac';
    let html = `<div class="dotgrid" style="grid-template-columns:repeat(${cols},14px);">`;
    for (let i = 0; i < count; i++) html += `<div class="dotcell" style="background:${color};"></div>`;
    html += `</div>`;
    return html;
}

// =========================================================================
// 2. MODULE 1 — CONSECUTIVE SUMS & SIGN PARITY (§5.1)
// =========================================================================
class ConsecutiveModule {
    constructor() { this.start = 3; this.count = 4; }
    setStart(v) { this.start = Math.max(1, Math.min(80, parseInt(v) || 1)); app.render(); }
    setCount(v) { this.count = v; app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        const nums = Array.from({ length: this.count }, (_, i) => this.start + i);
        return `
            <h2>Consecutive Sums &amp; Parity</h2>
            <p><b>§5.1</b> · Take some consecutive numbers, place '+' and '−' signs between them in every possible way, and evaluate. Something surprising happens to the parity (even/odd-ness) of the results!</p>
            <div class="data-panel">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Starting number — ${this.start}</label>
                <input type="range" min="1" max="80" value="${this.start}" oninput="app.activeModule.setStart(this.value)">
                <div style="font-weight:700;margin:10px 0 6px;">How many consecutive numbers?</div>
                <div class="pill-row">
                    ${[3, 4, 5, 6].map(c => `<div class="pill-btn ${this.count === c ? 'active' : ''}" onclick="app.activeModule.setCount(${c})">${c}</div>`).join('')}
                </div>
            </div>
            <div class="badge info">Numbers: ${nums.join(', ')}</div>
            <div class="proof-box">The first number always keeps its '+' sign. The rest get every combination of '+' and '−' — that's 2<sup>${this.count - 1}</sup> = ${Math.pow(2, this.count - 1)} expressions in all.<br><br>
            <b>Explanation:</b> Switching a sign from + to − on any number <i>b</i> changes the total by exactly 2<i>b</i> — an even amount. So every expression you can make keeps the <b>same parity</b> as the first one!</div>
        `;
    }
    renderStage() {
        const nums = Array.from({ length: this.count }, (_, i) => this.start + i);
        const combos = MathUtils.signCombos(this.count);
        const results = combos.map(signs => {
            const val = MathUtils.evalSigned(nums, signs);
            const exprParts = nums.map((n, i) => (i === 0 ? (signs[i] < 0 ? `−${n}` : `${n}`) : (signs[i] < 0 ? ` − ${n}` : ` + ${n}`)));
            return { expr: exprParts.join(''), val, parity: MathUtils.parityLabel(val) };
        });
        const allSame = results.every(r => r.parity === results[0].parity);
        let html = `<h3>${nums.join(' , ')} — all ${results.length} sign combinations</h3>`;
        html += `<div style="max-width:520px;margin:0 auto 18px;">`;
        results.forEach(r => {
            html += `<div class="expr-row"><span>${r.expr} = <b style="color:var(--brass-lt);">${r.val}</b></span><span class="parity-chip ${r.parity.toLowerCase()}">${r.parity}</span></div>`;
        });
        html += `</div>`;
        html += `<div style="max-width:520px;margin:0 auto;text-align:center;">
            <div class="badge ${allSame ? 'success' : 'danger'}" style="max-width:480px;margin:0 auto;">
                ${allSame ? `✓ Every expression is ${results[0].parity}! Same parity, no matter the signs.` : 'Mixed parities found (unexpected!)'}
            </div>
        </div>`;
        return { type: 'html', html };
    }
}

// =========================================================================
// 3. MODULE 2 — PAIRS TO MAKE FOURS (§5.1)
// =========================================================================
class FoursModule {
    constructor() { this.a = 12; this.b = 18; }
    setA(v) { let n = Math.max(2, Math.min(100, parseInt(v) || 2)); if (n % 2 !== 0) n -= 1; this.a = n; app.render(); }
    setB(v) { let n = Math.max(2, Math.min(100, parseInt(v) || 2)); if (n % 2 !== 0) n -= 1; this.b = n; app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        const ca = MathUtils.classifyMod4(this.a), cb = MathUtils.classifyMod4(this.b);
        const sum = this.a + this.b;
        const sumMult4 = sum % 4 === 0;
        return `
            <h2>Pairs to Make Fours</h2>
            <p>Even numbers come in two flavours: multiples of 4 (type <b>4p</b>), or 2 more than a multiple of 4 (type <b>4p+2</b>). What happens when you add two even numbers?</p>
            <div class="data-panel">
                <div class="range-row"><label>First even number — ${this.a}</label>
                <input type="range" min="2" max="100" step="2" value="${this.a}" oninput="app.activeModule.setA(this.value)"></div>
                <div class="range-row" style="margin-bottom:0;"><label>Second even number — ${this.b}</label>
                <input type="range" min="2" max="100" step="2" value="${this.b}" oninput="app.activeModule.setB(this.value)"></div>
            </div>
            <div class="data-panel">
                <div class="data-row"><span>${this.a} is type</span><span>${ca.type} (k=${ca.k})</span></div>
                <div class="data-row"><span>${this.b} is type</span><span>${cb.type} (k=${cb.k})</span></div>
            </div>
            <div class="badge ${sumMult4 ? 'success' : 'danger'}">${this.a} + ${this.b} = ${sum} — ${sumMult4 ? 'a multiple of 4 ✓' : 'NOT a multiple of 4'}</div>
            <div class="proof-box">
            • 4p + 4p = 4(p+q) → always multiple of 4.<br>
            • (4p+2) + (4q+2) = 4(p+q+1) → always multiple of 4 (remainders 2+2=4).<br>
            • 4p + (4q+2) = 4(p+q)+2 → never a multiple of 4.
            </div>
        `;
    }
    renderStage() {
        const ca = MathUtils.classifyMod4(this.a), cb = MathUtils.classifyMod4(this.b);
        const sum = this.a + this.b;
        const rowsA = Math.ceil(this.a / 4), rowsB = Math.ceil(this.b / 4);
        let html = `<h3>${this.a} (${ca.type}) + ${this.b} (${cb.type}) = ${sum}</h3>
        <div style="display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-bottom:22px;">
            <div class="icon-chip">${dotGrid(this.a, 4, '#2f75ac')}<span>${this.a} in rows of 4 (${rowsA} full row${rowsA===1?'':'s'}${this.a % 4 ? ' + ' + (this.a % 4) + ' left over' : ''})</span></div>
            <div class="icon-chip">${dotGrid(this.b, 4, '#c98a3e')}<span>${this.b} in rows of 4 (${rowsB} full row${rowsB===1?'':'s'}${this.b % 4 ? ' + ' + (this.b % 4) + ' left over' : ''})</span></div>
        </div>
        <div style="text-align:center;max-width:500px;margin:0 auto;">

            <h3>${p.display}</h3>
            <div style="margin: 20px 0;">
                ${p.letters.map(l => `<span style="display:inline-block;margin:6px;"><label style="display:block;font-size:0.75rem;color:var(--text-mid);margin-bottom:4px;">${l}</label><input class="letter-input" type="number" min="0" max="9" value="${this.values[l]}" oninput="app.activeModule.setLetter('${l}', this.value)"></span>`).join('')}
            </div>
            <button class="quiz-btn" onclick="app.activeModule.check()">Check My Answer</button>
            ${this.feedback ? `<div class="quiz-feedback ${this.feedback.ok ? 'correct' : 'wrong'}" style="margin-top:16px;">${this.feedback.ok ? '✓' : '✕'} ${this.feedback.msg}</div>` : ''}
            ${this.revealed ? `<div class="badge success" style="margin-top:16px;">Solution: ${p.letters.map(l => `${l} = ${p.solution[l]}`).join(', ')}</div>` : ''}
        </div>`;
        return { type: 'html', html };
    }
}

// =========================================================================
// 9. MODULE 8 — QUIZ ARENA
// =========================================================================
class QuizModule {
    constructor() {
        this.total = 10;
        this.started = false;
        this.questions = [];
        this.index = 0;
        this.score = 0;
        this.answered = false;
        this.lastCorrect = null;
        this.userVal = '';
        this.tfBank = [
            { stmt: "If a number is divisible by 9, the sum of its digits is divisible by 9.", a: true },
            { stmt: "The sum of two even numbers is always a multiple of 4.", a: false },
            { stmt: "The sum of three consecutive even numbers is always divisible by 6.", a: true },
            { stmt: "If two numbers are each not divisible by 6, their sum can never be divisible by 6.", a: false },
            { stmt: "Adding an odd number to an even number can give a multiple of 6.", a: false },
            { stmt: "If a number is divisible by 12, it is divisible by all the factors of 12.", a: true },
            { stmt: "If a number is divisible by both 6 and 4, it must be divisible by 24.", a: false },
            { stmt: "The digital root of any multiple of 9 is always 9.", a: true },
            { stmt: "The product of a multiple of 6 and a multiple of 3 is always a multiple of 9.", a: true },
            { stmt: "Switching one sign in a ± expression always changes the total by an odd number.", a: false }
        ];
    }
    setTotal(n) { this.total = n; app.render(); }
    start() { this.questions = this.generateQuestions(this.total); this.index = 0; this.score = 0; this.answered = false; this.lastCorrect = null; this.userVal = ''; this.started = true; app.render(); }
    restart() { this.started = false; app.render(); }
    generateQuestions(count) {
        const arr = [];
        for (let i = 0; i < count; i++) {
            const roll = Math.random();
            if (roll < 0.2) {
                const n = MathUtils.randInt(100, 99999);
                arr.push({ type: 'numeric', prompt: `What is the remainder when ${n} is divided by 9? (Hint: add the digits)`, answer: n % 9 });
            } else if (roll < 0.4) {
                const n = MathUtils.randInt(1000, 999999);
                const rem = ((n % 11) + 11) % 11;
                arr.push({ type: 'numeric', prompt: `What is the remainder when ${n} is divided by 11? (Use the alternating-sum trick)`, answer: rem });
            } else if (roll < 0.55) {
                const n = MathUtils.randInt(100, 999999999);
                arr.push({ type: 'numeric', prompt: `What is the digital root of ${n}?`, answer: MathUtils.digitalRootSteps(n).root });
            } else if (roll < 0.7) {
                const a = 2 * MathUtils.randInt(1, 30), b = 2 * MathUtils.randInt(1, 30);
                arr.push({ type: 'text', prompt: `Is ${a} + ${b} a multiple of 4? Answer "yes" or "no".`, answer: (a + b) % 4 === 0 ? 'yes' : 'no' });
            } else if (roll < 0.85) {
                const start = MathUtils.randInt(1, 40);
                arr.push({ type: 'numeric', prompt: `Four consecutive numbers starting at ${start}: what do ${start} + ${start+1} - ${start+2} - ${start+3} equal?`, answer: start + (start + 1) - (start + 2) - (start + 3) });
            } else {
                const bank = this.tfBank[MathUtils.randInt(0, this.tfBank.length - 1)];
                arr.push({ type: 'tf', prompt: bank.stmt, answer: bank.a });
            }
        }
        return arr;
    }
    setUserVal(v) { this.userVal = v; }
    submitNumeric() {
        if (this.answered) return;
        const q = this.questions[this.index];
        this.answered = true;
        this.lastCorrect = (parseFloat(this.userVal) === q.answer);
        if (this.lastCorrect) this.score++;
        app.render();
    }
    submitText() {
        if (this.answered) return;
        const q = this.questions[this.index];
        this.answered = true;
        this.lastCorrect = (this.userVal || '').trim().toLowerCase() === String(q.answer).toLowerCase();
        if (this.lastCorrect) this.score++;
        app.render();
    }
    submitTF(bool) {
        if (this.answered) return;
        const q = this.questions[this.index];
        this.answered = true;
        this.lastCorrect = (bool === q.answer);
        if (this.lastCorrect) this.score++;
        app.render();
    }
    next() { this.index++; this.answered = false; this.lastCorrect = null; this.userVal = ''; app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        if (!this.started) {
            return `
                <h2>Quiz Arena</h2>
                <p>Test yourself on parity, divisibility by 9/11, digital roots, and multiples of 4.</p>
                <div class="data-panel">
                    <div style="font-weight:700;margin-bottom:8px;">Number of questions</div>
                    <div class="pill-row">
                        <div class="pill-btn ${this.total===5?'active':''}" onclick="app.activeModule.setTotal(5)">5</div>
                        <div class="pill-btn ${this.total===10?'active':''}" onclick="app.activeModule.setTotal(10)">10</div>
                        <div class="pill-btn ${this.total===15?'active':''}" onclick="app.activeModule.setTotal(15)">15</div>
                    </div>
                </div>
                <button class="action-btn primary wide" onclick="app.activeModule.start()">▶ Start Quiz</button>
                <div class="proof-box">Mix of remainder puzzles, digital roots, multiples of 4, and true/false reasoning.</div>
            `;
        }
        if (this.index >= this.questions.length) {
            return `
                <h2>Quiz Arena</h2>
                <div class="badge success">Final score: ${this.score} / ${this.questions.length}</div>
                <p>Nice work! Try again for a fresh set of questions.</p>
                <button class="action-btn primary wide" onclick="app.activeModule.restart()">↻ New Quiz</button>
            `;
        }
        return `
            <h2>Quiz Arena</h2>
            <div class="badge info">Question ${this.index + 1} / ${this.questions.length} · Score ${this.score}</div>
            <p>Answer on the right.</p>
            <button class="action-btn wide" onclick="app.activeModule.restart()">← Back to setup</button>
        `;
    }
    renderStage() {
        if (!this.started) {
            return { type: 'html', html: `<div class="quiz-wrap"><h3>Ready when you are</h3><p style="color:var(--text-mid);">Choose a question count on the left, then hit Start Quiz.</p></div>` };
        }
        if (this.index >= this.questions.length) {
            const pct = Math.round(100 * this.score / this.questions.length);
            return { type: 'html', html: `<div class="quiz-wrap">
                <h3>Quiz complete!</h3>
                <div style="font-size:3rem;font-family:'IBM Plex Mono',monospace;color:var(--brass-lt);margin:20px 0;">${this.score}/${this.questions.length}</div>
                <p style="color:var(--text-mid);">${pct >= 80 ? 'Excellent work! 🌟' : pct >= 50 ? 'Good effort — keep practising!' : 'Review the chapter and try again!'}</p>
            </div>` };
        }
        const q = this.questions[this.index];
        let body = `<div class="quiz-wrap">
            <div class="quiz-progress">QUESTION ${this.index + 1} OF ${this.questions.length}</div>
            <div class="quiz-prompt">${q.prompt}</div>`;
        if (!this.answered) {
            if (q.type === 'numeric') {
                body += `<div class="quiz-input-row">
                    <input type="number" value="${this.userVal}" oninput="app.activeModule.setUserVal(this.value)" onkeypress="if(event.key==='Enter'){app.activeModule.submitNumeric();}">
                    <button class="quiz-btn" onclick="app.activeModule.submitNumeric()">Submit</button>
                </div>`;
            } else if (q.type === 'text') {
                body += `<div class="quiz-input-row">
                    <input type="text" value="${this.userVal}" oninput="app.activeModule.setUserVal(this.value)" onkeypress="if(event.key==='Enter'){app.activeModule.submitText();}">
                    <button class="quiz-btn" onclick="app.activeModule.submitText()">Submit</button>
                </div>`;
            } else {
                body += `<div class="quiz-tf-row">
                    <button class="true-btn" onclick="app.activeModule.submitTF(true)">TRUE</button>
                    <button class="false-btn" onclick="app.activeModule.submitTF(false)">FALSE</button>
                </div>`;
            }
        } else {
            body += `<div class="quiz-feedback ${this.lastCorrect ? 'correct' : 'wrong'}">
                ${this.lastCorrect ? '✓ Correct!' : `✕ Not quite — the answer is ${q.type === 'tf' ? (q.answer ? 'TRUE' : 'FALSE') : q.answer}`}
            </div>
            <button class="quiz-btn" onclick="app.activeModule.next()">${this.index + 1 < this.questions.length ? 'Next question →' : 'See results →'}</button>`;
        }
        body += `</div>`;
        return { type: 'html', html: body };
    }
}

// =========================================================================
// 10. MAIN APP CONTROLLER
// =========================================================================
const app = {
    modules: {
        'consecutive': new ConsecutiveModule(),
        'fours': new FoursModule(),
        'asn': new ASNModule(),
        'div9': new DivNineModule(),
        'div11': new DivElevenModule(),
        'digitalroot': new DigitalRootModule(),
        'crypt': new CryptModule(),
        'quiz': new QuizModule(),
    },
    tabDefs: [
        { id: 'consecutive', name: '1 · Consecutive Sums' },
        { id: 'fours', name: '2 · Pairs to Fours' },
        { id: 'asn', name: '3 · Always/Sometimes/Never' },
        { id: 'div9', name: '4 · Divisible by 3 & 9' },
        { id: 'div11', name: '5 · Divisible by 11' },
        { id: 'digitalroot', name: '6 · Digital Roots' },
        { id: 'crypt', name: '7 · Cryptarithms' },
        { id: 'quiz', name: '8 · Quiz Arena' },
    ],
    activeTab: 'consecutive',
    activeModule: null,

    init() {
        this.activeModule = this.modules[this.activeTab];
        this.renderTabs();
        this.render();
    },
    renderTabs() {
        document.getElementById('tabsBar').innerHTML = this.tabDefs.map(t =>
            `<button class="tab-btn ${t.id === this.activeTab ? 'active' : ''}" onclick="app.switchTab('${t.id}')">${t.name}</button>`
        ).join('');
    },
    switchTab(id) {
        if (!this.modules[id]) return;
        this.activeTab = id;
        this.activeModule = this.modules[id];
        this.renderTabs();
        this.render();
    },
    render() {
        document.getElementById('sidebarContent').innerHTML = this.activeModule.getSidebarHTML();
        const stageObj = this.activeModule.renderStage();
        const container = document.getElementById('stageContainer');
        if (stageObj.type === 'svg') {
            container.innerHTML = `<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">${stageObj.html}</svg>`;
        } else {
            container.innerHTML = `<div class="html-stage">${stageObj.html}</div>`;
        }
    }
};

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

window.onload = () => app.init();
</script>
