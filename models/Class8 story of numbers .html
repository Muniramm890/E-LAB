<div class="tabs-bar" id="tabsBar"></div>

<div class="workspace">

<script>
// =========================================================================
// 1. MATH / CONVERSION UTILITIES
// =========================================================================
const MathUtils = {
    randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; },

    // ---- Roman numerals ----
    toRomanCompact(num) {
        if (num <= 0) return '';
        const vals = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1];
        const syms = ['M', 'CM', 'D', 'CD', 'C', 'XC', 'L', 'XL', 'X', 'IX', 'V', 'IV', 'I'];
        let n = num, res = '';
        for (let i = 0; i < vals.length; i++) { while (n >= vals[i]) { res += syms[i]; n -= vals[i]; } }
        return res;
    },
    toRomanAdditive(num) {
        const vals = [1000, 500, 100, 50, 10, 5, 1];
        const syms = ['M', 'D', 'C', 'L', 'X', 'V', 'I'];
        let n = num, parts = [];
        for (let i = 0; i < vals.length; i++) { while (n >= vals[i]) { parts.push({ v: vals[i], s: syms[i] }); n -= vals[i]; } }
        return parts;
    },
    fromRoman(str) {
        const map = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
        const s = (str || '').toUpperCase().replace(/[^IVXLCDM]/g, '');
        let total = 0;
        for (let i = 0; i < s.length; i++) {
            const cur = map[s[i]], next = map[s[i + 1]];
            if (next && cur < next) total -= cur; else total += cur;
        }
        return total;
    },
    romanAddDemo(a, b) {
        const order = [1, 5,10, 50, 100, 500, 1000];
        const symOf = { 1: 'I', 5: 'V', 10: 'X', 50: 'L', 100: 'C', 500: 'D', 1000: 'M' };
        let counts = {}; order.forEach(v => counts[v] = 0);
        [a, b].forEach(n => this.toRomanAdditive(n).forEach(p => counts[p.v]++));
        for (let pass = 0; pass < 4; pass++) {
            order.forEach(v => {
                if (v === 1 || v === 10 || v === 100) {
                    const next = v * 5;
                    if (counts[v] >= 5) { counts[next] = (counts[next] || 0) + Math.floor(counts[v] / 5); counts[v] %= 5; }
                } else if (v === 5 || v === 50 || v === 500) {
                    const next = v * 2;
                    if (counts[v] >= 2) { counts[next] = (counts[next] || 0) + Math.floor(counts[v] / 2); counts[v] %= 2; }
                }
            });
        }
        let additive = '';
        [1000, 500, 100, 50, 10, 5, 1].forEach(v => { additive += symOf[v].repeat(counts[v] || 0); });
        return { sum: a + b, additive, compact: this.toRomanCompact(a + b) };
    },

    // ---- Egyptian numerals (decimal digit-per-power) ----
    egyptianPowers: [0, 1, 2, 3, 4, 5, 6, 7],
    egyptianNames: ['Stroke (1)', 'Heel bone (10)', 'Coil (100)', 'Lotus (1,000)', 'Finger (10,000)', 'Tadpole (1,00,000)', 'Amazed man (10,00,000)', 'Sun (1,00,00,000)'],
    toEgyptianBreakdown(num) {
        const parts = [];
        for (let p = 7; p >= 0; p--) {
            const count = Math.floor(num / Math.pow(10, p)) % 10;
            if (count > 0) parts.push({ power: p, count });
        }
        return parts;
    },
    egyptianAddDemo(a, b) {
        let counts = {}; for (let p = 0; p <= 8; p++) counts[p] = 0;
        [a, b].forEach(n => { for (let p = 7; p >= 0; p--) { counts[p] += Math.floor(n / Math.pow(10, p)) % 10; } });
        for (let p = 0; p < 8; p++) { if (counts[p] >= 10) { counts[p + 1] += Math.floor(counts[p] / 10); counts[p] %= 10; } }
        return counts;
    },

    // ---- Base-n place value ----
    toBaseDigits(num, base) {
        if (num === 0) return [0];
        let n = num, digits = [];
        while (n > 0) { digits.unshift(n % base); n = Math.floor(n / base); }
        return digits;
    },
    digitChar(d) { return d < 10 ? String(d) : String.fromCharCode(55 + d); },
    fromBaseDigits(digits, base) { return digits.reduce((acc, d) => acc * base + d, 0); },

    // ---- Mayan mixed-radix (landmark numbers 1, 20, 360, 7200, ...) ----
    mayanMultipliers: [20, 18, 20, 20, 20, 20, 20, 20],
    toMayanDigits(num) {
        let n = num; if (n === 0) return [0];
        const digits = []; let i = 0;
        while (n > 0) { const m = this.mayanMultipliers[i] || 20; digits.push(n % m); n = Math.floor(n / m); i++; }
        return digits; // least significant first
    },
    mayanLandmarks(count) {
        const arr = [1];
        for (let i = 0; i < count - 1; i++) arr.push(arr[arr.length - 1] * (this.mayanMultipliers[i] || 20));
        return arr;
    }
};

function toggleSwitch(checked) {
    return `<div style="width:40px;height:20px;background:${checked ? 'var(--brass)' : '#ccc'};border-radius:10px;position:relative;flex:none;">
        <div style="width:16px;height:16px;background:white;border-radius:50%;position:absolute;top:2px;left:${checked ? '22px' : '2px'};transition:.2s;"></div>
    </div>`;
}
function checkDot(ok) {
    return `<span class="check-item"><span class="dot" style="background:${ok ? 'var(--success)' : '#c7bda0'}">${ok ? '✓' : '✕'}</span></span>`;
}

// Egyptian hieroglyph-style icon (simplified, stylised — not literal hieroglyphs)
function egyptianIcon(power, colored) {
    const c = colored || '#e3ac6a';
    const box = 34;
    const svgs = {
        0: `<svg width="14" height="${box}" viewBox="0 0 14 34"><line x1="7" y1="2" x2="7" y2="32" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/></svg>`,
        1: `<svg width="${box}" height="24" viewBox="0 0 34 24"><path d="M4 22 Q4 4 17 4 Q30 4 30 22" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/></svg>`,
        2: `<svg width="${box}" height="${box}" viewBox="0 0 34 34"><path d="M28 8 Q10 3 7 16 Q5 28 18 28 Q28 28 26 19" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`,
        3: `<svg width="${box}" height="${box}" viewBox="0 0 34 34"><circle cx="17" cy="13" r="7" fill="none" stroke="${c}" stroke-width="2.5"/><line x1="17" y1="20" x2="17" y2="31" stroke="${c}" stroke-width="2.5"/></svg>`,
        4: `<svg width="${box}" height="${box}" viewBox="0 0 34 34"><path d="M9 30 L9 12 Q9 4 17 4 L27 4" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`,
        5: `<svg width="${box}" height="${box}" viewBox="0 0 34 34"><circle cx="13" cy="13" r="8" fill="none" stroke="${c}" stroke-width="2.5"/><path d="M19 19 L30 30" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/></svg>`,
        6: `<svg width="${box}" height="${box}" viewBox="0 0 34 34"><circle cx="17" cy="7" r="4.5" fill="none" stroke="${c}" stroke-width="2.5"/><line x1="17" y1="12" x2="17" y2="27" stroke="${c}" stroke-width="2.5"/><line x1="17" y1="15" x2="6" y2="5" stroke="${c}" stroke-width="2.5"/><line x1="17" y1="15" x2="28" y2="5" stroke="${c}" stroke-width="2.5"/></svg>`,
        7: `<svg width="${box}" height="${box}" viewBox="0 0 34 34"><circle cx="17" cy="17" r="6.5" fill="none" stroke="${c}" stroke-width="2.5"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => { const r1 = 9, r2 = 15; const rad = a * Math.PI / 180; return `<line x1="${17 + r1 * Math.cos(rad)}" y1="${17 + r1 * Math.sin(rad)}" x2="${17 + r2 * Math.cos(rad)}" y2="${17 + r2 * Math.sin(rad)}" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`; }).join('')}</svg>`
    };
    return svgs[power] || '';
}
// Mesopotamian cuneiform-style icon: wedge (1) and chevron (10)
function cuneiformOne(c) { return `<svg width="10" height="26" viewBox="0 0 10 26"><path d="M5 2 L8 20 L2 20 Z" fill="${c || '#e3ac6a'}"/></svg>`; }
function cuneiformTen(c) { return `<svg width="22" height="14" viewBox="0 0 22 14"><path d="M2 2 L18 7 L2 12" fill="none" stroke="${c || '#e3ac6a'}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
// Mayan dot/bar/shell icon
function mayanDot(c) { return `<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="${c || '#e3ac6a'}"/></svg>`; }
function mayanBar(c) { return `<svg width="46" height="10" viewBox="0 0 46 10"><rect x="1" y="2" width="44" height="6" rx="3" fill="${c || '#e3ac6a'}"/></svg>`; }
function mayanShell(c) { return `<svg width="30" height="16" viewBox="0 0 30 16"><ellipse cx="15" cy="8" rx="13" ry="6" fill="none" stroke="${c || '#e3ac6a'}" stroke-width="2.5"/></svg>`; }

// =========================================================================
// 2. MODULE 1 — COUNTING & TALLY  (§3.1)
// =========================================================================
class CountingModule {
    constructor() { this.myHerd = 7; this.neighbourHerd = 11; }
    setMy(v) { this.myHerd = Math.max(0, Math.min(60, parseInt(v))); app.render(); }
    setNeighbour(v) { this.neighbourHerd = Math.max(0, Math.min(60, parseInt(v))); app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        const diff = this.neighbourHerd - this.myHerd;
        return `
            <h2>Counting Without Numbers</h2>
            <p><b>§3.1</b> · Before number names existed, people used <b>one-to-one mapping</b> — matching each object to a stick, mark, or letter — to count and compare collections.</p>
            <div class="data-panel">
                <div class="range-row"><label>My herd — ${this.myHerd} cows</label>
                <input type="range" min="0" max="30" value="${this.myHerd}" oninput="app.activeModule.setMy(this.value)"></div>
                <div class="range-row" style="margin-bottom:0;"><label>Neighbour's herd — ${this.neighbourHerd} cows</label>
                <input type="range" min="0" max="30" value="${this.neighbourHerd}" oninput="app.activeModule.setNeighbour(this.value)"></div>
            </div>
            <div class="badge ${diff === 0 ? 'info' : diff > 0 ? 'danger' : 'success'}">${diff === 0 ? 'Equal herds!' : diff > 0 ? `You need ${diff} more cows to match` : `You have ${-diff} more cows than your neighbour`}</div>
            <div class="proof-box">Q1: line up a stick per cow before grazing, and again after — if a stick has no matching cow, one is missing.<br><br>Q2 &amp; Q3: lay both stick-collections side by side and match them one-to-one; the leftover sticks show exactly how many more are needed.</div>
        `;
    }
    renderStage() {
        const maxShow = 30;
        const mine = Array.from({ length: Math.min(this.myHerd, maxShow) });
        const theirs = Array.from({ length: Math.min(this.neighbourHerd, maxShow) });
        const row = (arr, label) => `<div style="margin-bottom:22px;">
            <div style="font-family:'IBM Plex Mono',monospace;color:var(--text-mid);margin-bottom:8px;text-align:center;">${label} (${arr.length === maxShow ? maxShow + '+' : arr.length})</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px;margin:0 auto;">
                ${arr.map(() => `<div class="stick-figure"></div>`).join('')}
            </div>
        </div>`;
        const html = `<div style="max-width:700px;margin:0 auto;">${row(mine, 'My sticks')}${row(theirs, "Neighbour's sticks")}</div>`;
        return { type: 'html', html };
    }
}

        return `
            <h2>Base-<i>n</i> Playground</h2>

            </div>
            <div class="proof-box">Because every landmark number is a power of ${this.base}, multiplying by ${this.base} just shifts every digit one place — this is exactly why a base makes arithmetic dramatically easier than systems like Roman numerals.</div>
        `;
    }
    renderStage() {
        const digits = MathUtils.toBaseDigits(this.num, this.base);

    }
}

class MesopotamianModule {
    constructor() { this.num = 7530; }
    setNum(v) { this.num = Math.max(0, Math.min(999999, parseInt(v) || 0)); app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        const digits = MathUtils.toBaseDigits(this.num, 60);
        return `
            <h2>Mesopotamian System</h2>
            <p><b>§3.4</b> · A base-60 (<b>sexagesimal</b>) place-value system from ancient Mesopotamia — still alive today in 1 hour = 60 minutes, 1 minute = 60 seconds!</p>
            <div class="data-panel">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Number to convert</label>
                <input class="num-input" type="number" min="0" max="999999" value="${this.num}" onchange="app.activeModule.setNum(this.value)">
            </div>
            <div class="badge success">${digits.map(d => d).join(' , ')} (base-60 digits)</div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Expansion</div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:0.8rem;">${digits.map((d,i)=>`${d}×60${digits.length-1-i>0?`<sup>${digits.length-1-i}</sup>`:''}`).join(' + ')} = ${this.num}</div>
            </div>
            <div class="proof-box">Each digit (0–59) is itself built from just two cuneiform symbols: a wedge <b>𐤙</b> for 1 and a chevron <b>&lt;</b> for 10 — a base-10 "sub-system" nested inside a base-60 system!</div>
        `;
    }
    renderStage() {
        const digits = MathUtils.toBaseDigits(this.num, 60);
        const renderDigit = (d) => {
            const tens = Math.floor(d / 10), ones = d % 10;
            if (d === 0) return `<div style="color:var(--text-mid);font-family:'IBM Plex Mono',monospace;">(blank space)</div>`;
            return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
                <div style="display:flex;gap:3px;">${Array.from({length:tens}).map(()=>cuneiformTen()).join('')}</div>
                <div style="display:flex;gap:2px;">${Array.from({length:ones}).map(()=>cuneiformOne()).join('')}</div>
            </div>`;
        };
        const html = `<h3>${this.num.toLocaleString()} in Mesopotamian sexagesimal</h3>
        <div style="display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-bottom:26px;">
            ${digits.map((d, i) => `<div class="icon-chip" style="min-width:70px;">
                ${renderDigit(d)}
                <span>${d} (60<sup>${digits.length - 1 - i}</sup>)</span>
            </div>`).join('')}
        </div>
        <div style="max-width:560px;margin:0 auto;text-align:center;color:var(--text-mid);font-size:0.9rem;">
            ⚠️ Historically, a blank space meant "no value here" — but with no consistent spacing, a number like this could be misread. Later scribes added a placeholder symbol (an early ancestor of our <b>zero</b>) to fix the ambiguity.
        </div>`;
        return { type: 'html', html };
    }
}

class MayanModule {
    constructor() { this.num = 1660; }
    setNum(v) { this.num = Math.max(0, Math.min(500000, parseInt(v) || 0)); app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        const digits = MathUtils.toMayanDigits(this.num);
        const landmarks = MathUtils.mayanLandmarks(digits.length);
        return `
            <h2>Mayan Numbers</h2>
            <p><b>§3.4</b> · A place-value system from Central America, developed independently of Asia. It uses dot = 1, bar = 5, and a shell = 0 — the zero used purely as a placeholder.</p>
            <div class="data-panel">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Number to convert</label>
                <input class="num-input" type="number" min="0" max="500000" value="${this.num}" onchange="app.activeModule.setNum(this.value)">
            </div>
            <div class="badge success">${digits.slice().reverse().join(' , ')} (top → bottom)</div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Landmark numbers</div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:0.8rem;">${landmarks.join(' · ')}</div>
            </div>
            <div class="proof-box">Puzzlingly, the <b>third</b> landmark number is 360 (not 400 as pure base-20 would give) — 18×20 instead of 20×20. Scholars think this connects to their 360-day calendar count. Because of this quirk, the Mayan system isn't a "true" base system.</div>
        `;
    }
    renderStage() {
        const digits = MathUtils.toMayanDigits(this.num).slice().reverse(); // most significant first
        const landmarks = MathUtils.mayanLandmarks(digits.length).slice().reverse();
        const renderDigit = (d) => {
            if (d === 0) return mayanShell();
            const bars = Math.floor(d / 5), dots = d % 5;
            return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
                <div style="display:flex;gap:3px;">${Array.from({length:dots}).map(()=>mayanDot()).join('')}</div>
                ${Array.from({length:bars}).map(()=>mayanBar()).join('')}
            </div>`;
        };
        const html = `<h3>${this.num.toLocaleString()} in Mayan numerals (read top → bottom)</h3>
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
            ${digits.map((d, i) => `<div class="icon-chip" style="flex-direction:row;gap:14px;min-width:220px;justify-content:space-between;">
                <span>${landmarks[i]}s place</span>${renderDigit(d)}<span>= ${d}</span>
            </div>`).join('')}
        </div>`;
        return { type: 'html', html };
    }
}

class ChineseHinduModule {
    constructor() { this.num = 2634; this.sub = 'chinese'; }
    setNum(v) { this.num = Math.max(0, Math.min(999999, parseInt(v) || 0)); app.render(); }
    setSub(s) { this.sub = s; app.render(); }
    updatePoint() {}
    tabsHTML() {
        return `<div class="pill-row">
            <div class="pill-btn ${this.sub === 'chinese' ? 'active' : ''}" onclick="app.activeModule.setSub('chinese')">Chinese Rods</div>
            <div class="pill-btn ${this.sub === 'hindu' ? 'active' : ''}" onclick="app.activeModule.setSub('hindu')">Hindu Place Value</div>
        </div>`;
    }
    getSidebarHTML() {
        const digits = String(this.num).split('').map(Number);
        const common = `
            <h2>Chinese Rods &amp; Hindu Numbers</h2>
            ${this.tabsHTML()}
            <div class="data-panel">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Number to convert</label>
                <input class="num-input" type="number" min="0" max="999999" value="${this.num}" onchange="app.activeModule.setNum(this.value)">
            </div>`;
        if (this.sub === 'chinese') {
            return common + `
            <p style="margin-top:0;"><b>Rod numerals</b> alternate between two forms — <i>zong</i> (vertical) for units, hundreds, ten-thousands, ...; <i>heng</i> (horizontal) for tens, thousands, ...</p>
            <div class="proof-box">This alternation lets a blank gap between rod-groups be spotted more easily than in the Mesopotamian system — an early step toward a fully unambiguous place-value system.</div>`;
        }
        return common + `
        <p style="margin-top:0;">The <b>Hindu number system</b> is base-10, uses exactly ten symbols (0–9), and treats <b>0</b> as a genuine number — not just a placeholder. This is why it's used worldwide today.</p>
        <div class="data-panel">
            <div style="font-weight:700;margin-bottom:6px;">Digit × place value</div>
            ${digits.map((d, i) => `<div class="data-row"><span>${d} × 10<sup>${digits.length - 1 - i}</sup></span><span>= ${d * Math.pow(10, digits.length - 1 - i)}</span></div>`).join('')}
        </div>
        <div class="proof-box">Zero as a full number — with 0+n=n and 0×n=0 — was codified by Brahmagupta (628 CE), turning the Hindu numbers into what mathematicians now call a <b>ring</b>.</div>`;
    }
    renderStage() {
        if (this.sub === 'chinese') {
            const digits = String(this.num).split('').map(Number);
            const zong = (d) => {
                if (d === 0) return `<div style="width:30px;height:30px;"></div>`;
                if (d <= 4) return `<div style="display:flex;gap:3px;">${Array.from({length:d}).map(()=>`<div style="width:4px;height:30px;background:var(--brass-lt);"></div>`).join('')}</div>`;
                if (d === 5) return `<div style="width:30px;height:4px;background:var(--brass-lt);"></div>`;
                return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:30px;height:4px;background:var(--brass-lt);"></div><div style="display:flex;gap:3px;">${Array.from({length:d-5}).map(()=>`<div style="width:4px;height:20px;background:var(--brass-lt);"></div>`).join('')}</div></div>`;
            };
            const heng = (d) => {
                if (d === 0) return `<div style="width:30px;height:30px;"></div>`;
                if (d <= 4) return `<div style="display:flex;flex-direction:column;gap:3px;">${Array.from({length:d}).map(()=>`<div style="width:30px;height:4px;background:var(--brass-lt);"></div>`).join('')}</div>`;
                if (d === 5) return `<div style="width:4px;height:30px;background:var(--brass-lt);"></div>`;
                return `<div style="display:flex;align-items:center;gap:3px;"><div style="width:4px;height:30px;background:var(--brass-lt);"></div><div style="display:flex;flex-direction:column;gap:3px;">${Array.from({length:d-5}).map(()=>`<div style="width:20px;height:4px;background:var(--brass-lt);"></div>`).join('')}</div></div>`;
            };
            let html = `<h3>${this.num.toLocaleString()} in Chinese rod numerals</h3>
            <div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;">
                ${digits.map((d, i) => {
                    const pos = digits.length - 1 - i;
                    const isZong = pos % 2 === 0;
                    return `<div class="icon-chip" style="min-width:60px;min-height:80px;justify-content:center;">
                        ${isZong ? zong(d) : heng(d)}
                        <span>${d} (10<sup>${pos}</sup>, ${isZong ? 'zong' : 'heng'})</span>
                    </div>`;
                }).join('')}
            </div>`;
            return { type: 'html', html };
        }
        const digits = String(this.num).split('').map(Number);
        let html = `<h3>${this.num.toLocaleString()} in the Hindu place-value system</h3>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:26px;">
            ${digits.map((d, i) => `<div style="text-align:center;">
                <div style="width:56px;height:56px;border:2px solid var(--brass);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-family:'IBM Plex Mono',monospace;color:var(--brass-lt);">${d}</div>
                <div style="font-size:0.7rem;color:var(--text-mid);margin-top:6px;">10<sup>${digits.length - 1 - i}</sup></div>
            </div>`).join('')}
        </div>
        <div class="timeline-step"><b>1.</b> Count in groups of a single number (e.g. Gumulgal's "ukasar-ukasar-urapon")</div>
        <div class="timeline-step"><b>2.</b> Group using landmark numbers (Roman I V X L C D M)</div>
        <div class="timeline-step"><b>3.</b> Choose powers of a number as landmarks — the idea of a <b>base</b> (Egyptian 1, 10, 100, ...)</div>
        <div class="timeline-step"><b>4.</b> Use position to show which landmark a digit belongs to — <b>place value</b> (Mesopotamian, Mayan, Chinese)</div>
        <div class="timeline-step"><b>5.</b> Zero as a positional digit <i>and</i> as a full number — the Hindu system</div>`;
        return { type: 'html', html };
    }
}

    constructor() {
        this.total = 10;
        this.started = false;
        this.questions = [];
        this.index = 0;
        this.score = 0;
        this.answered = false;
        this.lastCorrect = null;
        this.userVal = '';
        this.tfBank = [
            { stmt: 'The Bakhshali manuscript contains one of the earliest known uses of a zero symbol, written as a dot.', a: true },
            { stmt: 'Aryabhata was the first mathematician to fully explain computations using the Indian base-10 system.', a: true },
            { stmt: 'Roman numerals make multiplication just as simple as the Hindu-Arabic system.', a: false },
            { stmt: 'A number system "with a base" is one whose landmark numbers are all powers of a fixed number.', a: true },
            { stmt: 'The Mayan number system is a pure base-20 system throughout.', a: false },
            { stmt: 'Brahmagupta was the first to give zero the full status of a number with defined arithmetic rules.', a: true },
            { stmt: "The word 'algorithm' comes from the name of the mathematician Al-Khwarizmi.", a: true },
            { stmt: "The term 'Arabic numerals' arose because Arab mathematicians invented the ten-digit system.", a: false },
            { stmt: 'In the Mesopotamian system, a blank space could sometimes cause a number to be misread.', a: true },
            { stmt: 'The Hindu number system reached Europe before the Roman system was in wide use there.', a: false }
        ];
    }
    setTotal(n) { this.total = n; app.render(); }
    start() {
        this.questions = this.generateQuestions(this.total);
        this.index = 0; this.score = 0; this.answered = false; this.lastCorrect = null; this.userVal = '';
        this.started = true;
        app.render();
    }
    restart() { this.started = false; app.render(); }
    generateQuestions(count) {
        const arr = [];
        for (let i = 0; i < count; i++) {
            const roll = Math.random();
            if (roll < 0.22) {
                const n = MathUtils.randInt(5, 999);
                arr.push({ type: 'text', prompt: `Convert ${n} to Roman numerals.`, answer: MathUtils.toRomanCompact(n) });
            } else if (roll < 0.4) {
                const n = MathUtils.randInt(5, 999);
                const roman = MathUtils.toRomanCompact(n);
                arr.push({ type: 'numeric', prompt: `What decimal number is the Roman numeral ${roman}?`, answer: n });
            } else if (roll < 0.58) {
                const n = MathUtils.randInt(10, 500);
                const base = [2, 3, 5, 7, 8][MathUtils.randInt(0, 4)];
                const digits = MathUtils.toBaseDigits(n, base).join('');
                arr.push({ type: 'text', prompt: `Convert ${n} to base-${base}. (Answer as digits, e.g. "101")`, answer: digits });
            } else if (roll < 0.7) {
                arr.push({ type: 'numeric', prompt: 'What is the base of the Mesopotamian (Babylonian) number system?', answer: 60 });
            } else if (roll < 0.8) {
                arr.push({ type: 'numeric', prompt: 'How many digit symbols does the Hindu number system use?', answer: 10 });
            } else if (roll < 0.9) {
                arr.push({ type: 'numeric', prompt: "In the Mayan system, what is the third landmark number (instead of 400)?", answer: 360 });
            } else {
                const bank = this.tfBank[MathUtils.randInt(0, this.tfBank.length - 1)];
                arr.push({ type: 'tf', prompt: bank.stmt, answer: bank.a });
            }
        }
        return arr;
    }
    setUserVal(v) { this.userVal = v; }
    submitNumeric() {
        if (this.answered) return;
        const q = this.questions[this.index];
        this.answered = true;
        this.lastCorrect = (parseFloat(this.userVal) === q.answer);
        if (this.lastCorrect) this.score++;
        app.render();
    }
    submitText() {
        if (this.answered) return;
        const q = this.questions[this.index];
        this.answered = true;
        this.lastCorrect = (this.userVal || '').trim().toUpperCase() === String(q.answer).toUpperCase();
        if (this.lastCorrect) this.score++;
        app.render();
    }
    submitTF(bool) {
        if (this.answered) return;
        const q = this.questions[this.index];
        this.answered = true;
        this.lastCorrect = (bool === q.answer);
        if (this.lastCorrect) this.score++;
        app.render();
    }
    next() { this.index++; this.answered = false; this.lastCorrect = null; this.userVal = ''; app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        if (!this.started) {
            return `
                <h2>Quiz Arena</h2>
                <p>Test yourself on Roman, Egyptian, base-n, and the history of the Hindu-Arabic number system.</p>
                <div class="data-panel">
                    <div style="font-weight:700;margin-bottom:8px;">Number of questions</div>
                    <div class="pill-row">
                        <div class="pill-btn ${this.total===5?'active':''}" onclick="app.activeModule.setTotal(5)">5</div>
                        <div class="pill-btn ${this.total===10?'active':''}" onclick="app.activeModule.setTotal(10)">10</div>
                        <div class="pill-btn ${this.total===15?'active':''}" onclick="app.activeModule.setTotal(15)">15</div>
                    </div>
                </div>
                <button class="action-btn primary wide" onclick="app.activeModule.start()">▶ Start Quiz</button>
                <div class="proof-box">Mix of Roman numeral conversion, base conversion, and true/false history questions.</div>
            `;
        }
        if (this.index >= this.questions.length) {
            return `
                <h2>Quiz Arena</h2>
                <div class="badge success">Final score: ${this.score} / ${this.questions.length}</div>
                <p>Nice work! Try again for a fresh set of questions.</p>
                <button class="action-btn primary wide" onclick="app.activeModule.restart()">↻ New Quiz</button>
            `;
        }
        return `
            <h2>Quiz Arena</h2>
            <div class="badge info">Question ${this.index + 1} / ${this.questions.length} · Score ${this.score}</div>
            <p>Answer on the right.</p>
            <button class="action-btn wide" onclick="app.activeModule.restart()">← Back to setup</button>
        `;
    }
    renderStage() {
        if (!this.started) {
            return { type: 'html', html: `<div class="quiz-wrap"><h3>Ready when you are</h3><p style="color:var(--text-mid);">Choose a question count on the left, then hit Start Quiz.</p></div>` };
        }
        if (this.index >= this.questions.length) {
            const pct = Math.round(100 * this.score / this.questions.length);
            return { type: 'html', html: `<div class="quiz-wrap">
                <h3>Quiz complete!</h3>
                <div style="font-size:3rem;font-family:'IBM Plex Mono',monospace;color:var(--brass-lt);margin:20px 0;">${this.score}/${this.questions.length}</div>
                <p style="color:var(--text-mid);">${pct >= 80 ? 'Excellent work! 🌟' : pct >= 50 ? 'Good effort — keep practising!' : 'Review the chapter and try again!'}</p>
            </div>` };
        }
        const q = this.questions[this.index];
        let body = `<div class="quiz-wrap">
            <div class="quiz-progress">QUESTION ${this.index + 1} OF ${this.questions.length}</div>
            <div class="quiz-prompt">${q.prompt}</div>`;
        if (!this.answered) {
            if (q.type === 'numeric') {
                body += `<div class="quiz-input-row">
                    <input type="number" value="${this.userVal}" oninput="app.activeModule.setUserVal(this.value)" onkeypress="if(event.key==='Enter'){app.activeModule.submitNumeric();}">
                    <button class="quiz-btn" onclick="app.activeModule.submitNumeric()">Submit</button>
                </div>`;
            } else if (q.type === 'text') {
                body += `<div class="quiz-input-row">
                    <input type="text" value="${this.userVal}" oninput="app.activeModule.setUserVal(this.value)" onkeypress="if(event.key==='Enter'){app.activeModule.submitText();}">
                    <button class="quiz-btn" onclick="app.activeModule.submitText()">Submit</button>
                </div>`;
            } else {
                body += `<div class="quiz-tf-row">
                    <button class="true-btn" onclick="app.activeModule.submitTF(true)">TRUE</button>
                    <button class="false-btn" onclick="app.activeModule.submitTF(false)">FALSE</button>
                </div>`;
            }
        } else {
            body += `<div class="quiz-feedback ${this.lastCorrect ? 'correct' : 'wrong'}">
                ${this.lastCorrect ? '✓ Correct!' : `✕ Not quite — the answer is ${q.type === 'tf' ? (q.answer ? 'TRUE' : 'FALSE') : q.answer}`}
            </div>
            <button class="quiz-btn" onclick="app.activeModule.next()">${this.index + 1 < this.questions.length ? 'Next question →' : 'See results →'}</button>`;
        }
        body += `</div>`;
        return { type: 'html', html: body };
    }
}

// =========================================================================
// 10. MAIN APP CONTROLLER
// =========================================================================
const app = {
    modules: {
        'counting': new CountingModule(),
        'roman': new RomanModule(),
        'egyptian': new EgyptianModule(),
        'basen': new BaseNModule(),
        'mesopotamian': new MesopotamianModule(),
        'mayan': new MayanModule(),
        'chinese-hindu': new ChineseHinduModule(),
        'quiz': new QuizModule(),
    },
    tabDefs: [
        { id: 'counting', name: '1 · Counting & Tally' },
        { id: 'roman', name: '2 · Roman Numerals' },
        { id: 'egyptian', name: '3 · Egyptian Numerals' },
        { id: 'basen', name: '4 · Base-N Playground' },
        { id: 'mesopotamian', name: '5 · Mesopotamian' },
        { id: 'mayan', name: '6 · Mayan Numbers' },
        { id: 'chinese-hindu', name: '7 · Chinese & Hindu' },
        { id: 'quiz', name: '8 · Quiz Arena' },
    ],
    activeTab: 'counting',
    activeModule: null,

    init() {
        this.activeModule = this.modules[this.activeTab];
        this.renderTabs();
        this.render();
    },
    renderTabs() {
        document.getElementById('tabsBar').innerHTML = this.tabDefs.map(t =>
            `<button class="tab-btn ${t.id === this.activeTab ? 'active' : ''}" onclick="app.switchTab('${t.id}')">${t.name}</button>`
        ).join('');
    },
    switchTab(id) {
        if (!this.modules[id]) return;
        this.activeTab = id;
        this.activeModule = this.modules[id];
        this.renderTabs();
        this.render();
    },
    render() {
        document.getElementById('sidebarContent').innerHTML = this.activeModule.getSidebarHTML();
        const stageObj = this.activeModule.renderStage();
        const container = document.getElementById('stageContainer');
        if (stageObj.type === 'svg') {
            container.innerHTML = `<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">${stageObj.html}</svg>`;
        } else {
            container.innerHTML = `<div class="html-stage">${stageObj.html}</div>`;
        }
    }
};

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

window.onload = () => app.init();
</script>
