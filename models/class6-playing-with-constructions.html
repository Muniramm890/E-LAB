<body>

<header>
    <div class="brand-area">
        <a href="../index.html" class="back-btn">← E-Lab</a>
        <div class="module-title">
            <h1>Playing with Constructions</h1>
            <p>CLASS 6 · CHAPTER 08 · GANITA PRAKASH · VIRTUAL RULER &amp; COMPASS LAB</p>
        </div>
    </div>
</header>

<div class="tabs-bar" id="tabsBar"></div>

<div class="workspace">
    <aside class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()" title="Show/hide panel">☰</button>
        <div class="sidebar-content" id="sidebarContent"></div>
    </aside>
    <main class="stage">
        <div class="canvas-container">
            <div id="stageContainer"></div>
        </div>
    </main>
</div>

<script>
// =========================================================================
// UTILITIES
// =========================================================================
const S = 38; // px per cm
const cm = v => v * S;
const U = {
    dist(x1,y1,x2,y2){ return Math.sqrt((x2-x1)**2 + (y2-y1)**2); },
    r1(n){ return Math.round(n*10)/10; },
    r2(n){ return Math.round(n*100)/100; },
    randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; },
    circleIntersect(c1, r1, c2, r2){
        const d = U.dist(c1.x,c1.y,c2.x,c2.y);
        if (d > r1+r2 || d < Math.abs(r1-r2) || d === 0) return null;
        const a = (r1*r1 - r2*r2 + d*d) / (2*d);
        const hsq = r1*r1 - a*a;
        if (hsq < 0) return null;
        const h = Math.sqrt(hsq);
        const xm = c1.x + a*(c2.x-c1.x)/d;
        const ym = c1.y + a*(c2.y-c1.y)/d;
        return [
            { x: xm + h*(c2.y-c1.y)/d, y: ym - h*(c2.x-c1.x)/d },
            { x: xm - h*(c2.y-c1.y)/d, y: ym + h*(c2.x-c1.x)/d }
        ];
    }
};
function toggleSwitch(checked) {
    return `<div style="width:40px;height:20px;background:${checked ? 'var(--brass)' : '#ccc'};border-radius:10px;position:relative;flex:none;">
        <div style="width:16px;height:16px;background:white;border-radius:50%;position:absolute;top:2px;left:${checked ? '22px' : '2px'};transition:.2s;"></div>
    </div>`;
}
function checkDot(ok) {
    return `<span class="check-item"><span class="dot" style="background:${ok ? 'var(--success)' : '#c7bda0'}">${ok ? '✓' : '✕'}</span></span>`;
}
// Decorative virtual-instrument icons
function compassIcon(x, y, rot=0, s=1, active=true) {
    return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})" opacity="${active?1:0.35}">
        <circle cx="0" cy="-22" r="5" fill="#c98a3e" stroke="#e3ac6a" stroke-width="1.5"/>
        <line x1="0" y1="-22" x2="-13" y2="14" stroke="#dfe7ee" stroke-width="4" stroke-linecap="round"/>
        <line x1="0" y1="-22" x2="13" y2="14" stroke="#c98a3e" stroke-width="4" stroke-linecap="round"/>
        <line x1="9" y1="10" x2="16" y2="4" stroke="#c98a3e" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-13" cy="14" r="2" fill="#dfe7ee"/>
        <circle cx="16" cy="4" r="2" fill="#c98a3e"/>
    </g>`;
}
function protractorIcon(x, y, active=true) {
    return `<g transform="translate(${x},${y})" opacity="${active?0.9:0.3}">
        <path d="M -30 0 A 30 30 0 0 1 30 0 Z" fill="rgba(232,242,255,0.18)" stroke="#a8c4df" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="0" y2="-30" stroke="#e35a8f" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="2.5" fill="#e35a8f"/>
    </g>`;
}
function rulerIcon(x1,y1,x2,y2,active=true) {
    const len = U.dist(x1,y1,x2,y2);
    const ang = Math.atan2(y2-y1, x2-x1) * 180/Math.PI;
    return `<g transform="translate(${x1},${y1}) rotate(${ang})" opacity="${active?0.85:0.25}">
        <rect x="0" y="-7" width="${len}" height="14" fill="rgba(232,220,180,0.85)" stroke="#8a6f3a" stroke-width="1"/>
        ${Array.from({length: Math.floor(len/S)+1}).map((_,i)=>`<line x1="${i*S}" y1="-7" x2="${i*S}" y2="0" stroke="#5c4a26" stroke-width="1"/>`).join('')}
    </g>`;
}
function rightAngleMark(x,y,dx1,dy1,dx2,dy2,size=12){
    const p1 = {x:x+dx1*size,y:y+dy1*size};
    const p2 = {x:x+dx1*size+dx2*size,y:y+dy1*size+dy2*size};
    const p3 = {x:x+dx2*size,y:y+dy2*size};
    return `<path d="M ${p1.x} ${p1.y} L ${p2.x} ${p2.y} L ${p3.x} ${p3.y}" fill="none" stroke="#e3ac6a" stroke-width="1.5"/>`;
}
function tickMark(x,y,ang,n=1){
    let out = '';
    for (let i=0;i<n;i++){
        const off = (i-(n-1)/2)*4;
        const cx = x + off*Math.cos(ang+Math.PI/2), cy = y + off*Math.sin(ang+Math.PI/2);
        out += `<line x1="${cx-6*Math.cos(ang-0.5)}" y1="${cy-6*Math.sin(ang-0.5)}" x2="${cx+6*Math.cos(ang-0.5)}" y2="${cy+6*Math.sin(ang-0.5)}" stroke="#fff" stroke-width="2"/>`;
    }
    return out;
}

// =========================================================================
// MODULE 1 — COMPASS & CIRCLES  (§8.1 intro)
// =========================================================================
class CompassBasicsModule {
    constructor(){ this.r = 4; this.points = []; this.circleShown = false; this.compare = false;
        this.jitter = Array.from({length:48},()=> 0.82 + Math.random()*0.36); }
    setR(v){ this.r = parseFloat(v); app.render(); }
    markPoint(){
        let ang;
        do { ang = Math.random()*360; } while (this.points.some(p => Math.abs(p-ang) < 18));
        this.points.push(ang); app.render();
    }
    markRing(){ this.points = []; for(let i=0;i<8;i++) this.points.push(i*45); app.render(); }
    toggleCircle(){ this.circleShown = !this.circleShown; app.render(); }
    toggleCompare(){ this.compare = !this.compare; app.render(); }
    reset(){ this.points = []; this.circleShown=false; app.render(); }
    updatePoint(){}
    getSidebarHTML(){
        return `
            <h2>Points at a Fixed Distance</h2>
            <p><b>§8.1</b> · Mark a point P. Now try marking points that are all exactly ${this.r} cm away from P, in as many directions as possible. What shape do they trace out?</p>
            <div class="badge info">Radius set on compass: ${this.r} cm</div>
            <div class="data-panel">
                <div class="range-row" style="margin-bottom:0;">
                    <label>Compass radius — ${this.r} cm</label>
                    <input type="range" min="1" max="8" step="0.5" value="${this.r}" oninput="app.activeModule.setR(this.value)">
                </div>
            </div>
            <div class="btn-grid">
                <button class="action-btn primary" onclick="app.activeModule.markPoint()">✎ Mark one point</button>
                <button class="action-btn" onclick="app.activeModule.markRing()">Mark 8 points</button>
            </div>
            <button class="action-btn wide" onclick="app.activeModule.toggleCircle()">${this.circleShown ? '◐ Hide full circle' : '◑ Draw full circle (keep tip fixed!)'}</button>
            <button class="action-btn wide" onclick="app.activeModule.reset()">↻ Reset</button>
            <div class="data-panel" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="app.activeModule.toggleCompare()">
                <strong>Compare with a shaky freehand try</strong>${toggleSwitch(this.compare)}
            </div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Definitions</div>
                <div class="data-row"><span>Centre</span><span>the fixed point P</span></div>
                <div class="data-row"><span>Radius</span><span>distance from centre to any point on the circle</span></div>
            </div>
            <div class="proof-box">Keep the metal tip of the compass fixed at P and swing only the pencil leg — every point the pencil touches is automatically ${this.r} cm from P. That is exactly why a compass draws a perfect circle, while a freehand attempt wobbles.</div>
        `;
    }
    renderStage(){
        const P = {x:300, y:320};
        const rp = cm(this.r);
        let html = '';
        html += `<line x1="${P.x-14}" y1="${P.y}" x2="${P.x+14}" y2="${P.y}" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>`;
        html += `<line x1="${P.x}" y1="${P.y-14}" x2="${P.x}" y2="${P.y+14}" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>`;
        html += `<circle cx="${P.x}" cy="${P.y}" r="4" fill="#e35a8f"/>`;
        html += `<text x="${P.x-16}" y="${P.y+20}" class="svg-label">P</text>`;

        if (this.compare) {
            let path = 'M ';
            this.jitter.forEach((j,i)=>{
                const a = i/this.jitter.length*2*Math.PI;
                const rr = rp * j;
                const x = P.x + rr*Math.cos(a), y = P.y + rr*Math.sin(a);
                path += `${i===0?'':'L '}${x.toFixed(1)} ${y.toFixed(1)} `;
            });
            path += 'Z';
            html += `<path d="${path}" fill="none" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>`;
            html += `<text x="620" y="120" text-anchor="middle" class="svg-label-sm" fill="var(--danger)">freehand attempt (wobbly)</text>`;
        }
        if (this.circleShown) {
            html += `<circle cx="${P.x}" cy="${P.y}" r="${rp}" fill="none" stroke="#fff" stroke-width="2.5"/>`;
        }
        this.points.forEach(ang=>{
            const a = ang*Math.PI/180;
            const x = P.x + rp*Math.cos(a), y = P.y + rp*Math.sin(a);
            html += `<line x1="${P.x}" y1="${P.y}" x2="${x}" y2="${y}" stroke="rgba(227,172,106,0.35)" stroke-width="1" stroke-dasharray="2,3"/>`;
            html += `<circle cx="${x}" cy="${y}" r="4" fill="var(--brass-lt)"/>`;
        });
        if (this.points.length){
            const last = this.points[this.points.length-1]*Math.PI/180;
            const lx = P.x + rp*Math.cos(last), ly = P.y + rp*Math.sin(last);
            html += compassIcon(P.x, P.y, Math.atan2(ly-P.y,lx-P.x)*180/Math.PI + 90, Math.min(1.4, this.r/4));
        }
        html += `<text x="${P.x}" y="560" text-anchor="middle" class="svg-label">${this.points.length} point(s) marked, each ${this.r} cm from P</text>`;
        return { type:'svg', html };
    }
}

// =========================================================================
// MODULE 2 — ARTWORK STUDIO  (§8.1 Construct)
// =========================================================================
class ArtworkStudioModule {
    constructor(){ this.subMode = 'person'; this.headR = 2; this.bodyW = 4; this.bodyH = 4;
        this.waveAB = 8; this.waveSmall = false; this.waveFactor = 1;
        this.eyeW = 4.5; this.eyeBulge = 3.2; }
    setSubMode(m){ this.subMode = m; app.render(); }
    setP(k,v){ this[k] = parseFloat(v); app.render(); }
    toggleSmall(){ this.waveSmall = !this.waveSmall; app.render(); }
    updatePoint(){}
    tabsHTML(){
        return `<div class="pill-row">
            <div class="pill-btn ${this.subMode==='person'?'active':''}" onclick="app.activeModule.setSubMode('person')">A Person</div>
            <div class="pill-btn ${this.subMode==='wave'?'active':''}" onclick="app.activeModule.setSubMode('wave')">Wavy Wave</div>
            <div class="pill-btn ${this.subMode==='eyes'?'active':''}" onclick="app.activeModule.setSubMode('eyes')">Eyes</div>
        </div>`;
    }
    getSidebarHTML(){
        if (this.subMode==='person') return this.personSidebar();
        if (this.subMode==='wave') return this.waveSidebar();
        return this.eyesSidebar();
    }
    personSidebar(){
        const minR = this.bodyW/2;
        const valid = this.headR >= minR - 0.01;
        return `
            <h2>Artwork Studio</h2>
            ${this.tabsHTML()}
            <p><b>Construct — A Person.</b> The head is a compass circle. The shoulders are a curve that bulges through both top corners of the body — the challenge is finding where to plant the compass tip.</p>
            <div class="data-panel">
                <div class="range-row"><label>Head radius — ${this.headR} cm</label>
                <input type="range" min="1" max="3" step="0.1" value="${this.headR}" oninput="app.activeModule.setP('headR', this.value)"></div>
                <div class="range-row"><label>Body width — ${this.bodyW} cm</label>
                <input type="range" min="2" max="6" step="0.5" value="${this.bodyW}" oninput="app.activeModule.setP('bodyW', this.value)"></div>
                <div class="range-row" style="margin-bottom:0;"><label>Shoulder-arc radius — ${this.headR} cm (compass tip below the body)</label>
                <input type="range" min="${minR.toFixed(1)}" max="6" step="0.1" value="${this.headR}" oninput="app.activeModule.setP('headR', this.value)"></div>
            </div>
            <div class="badge ${valid?'success':'danger'}">${valid ? 'Arc reaches both shoulders ✓' : 'Radius too small — arc cannot reach both corners'}</div>
            <div class="proof-box">The shoulder curve is one arc of a circle. Its tip must be placed directly below the middle of the body, at a distance such that both top corners lie exactly on the circle — try shrinking the radius until it fails!</div>
        `;
    }
    waveSidebar(){
        return `
            <h2>Artwork Studio</h2>
            ${this.tabsHTML()}
            <p><b>Construct — Wavy Wave.</b> Central line AB, first wave a half circle above, second a half circle below. As AB isn't fixed, pick any length.</p>
            <div class="data-panel">
                <div class="range-row" style="margin-bottom:0;"><label>Length of AB — ${this.waveAB} cm</label>
                <input type="range" min="4" max="14" step="1" value="${this.waveAB}" oninput="app.activeModule.setP('waveAB', this.value)"></div>
            </div>
            <div class="data-panel" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="app.activeModule.toggleSmall()">
                <strong>Waves smaller than a half circle</strong>${toggleSwitch(this.waveSmall)}
            </div>
            ${this.waveSmall ? `<div class="data-panel">
                <div class="range-row" style="margin-bottom:0;"><label>Wave size — ${Math.round(this.waveFactor*100)}% of the half-circle radius</label>
                <input type="range" min="0.4" max="1" step="0.05" value="${this.waveFactor}" oninput="app.activeModule.setP('waveFactor', this.value)"></div>
            </div>` : ''}
            <div class="data-panel">
                <div class="data-row"><span>Radius of each half circle</span><span>AB ÷ 4 = ${U.r1(this.waveAB/4)} cm</span></div>
                <div class="data-row"><span>Length AX</span><span>${U.r1(this.waveAB/2)} cm</span></div>
            </div>
            <div class="proof-box">Making the two waves identical is the tricky part — both need the exact same radius and their centres must sit at matching distances from A and B.</div>
        `;
    }
    eyesSidebar(){
        return `
            <h2>Artwork Studio</h2>
            ${this.tabsHTML()}
            <p><b>Construct — Eyes.</b> Two arcs (upper bulges up, lower bulges down) meeting at sharp tips. Each arc's compass tip sits on the vertical centre-line, above or below the eye.</p>
            <div class="data-panel">
                <div class="range-row"><label>Eye width (tip to tip) — ${this.eyeW} cm</label>
                <input type="range" min="3" max="7" step="0.1" value="${this.eyeW}" oninput="app.activeModule.setP('eyeW', this.value)"></div>
                <div class="range-row" style="margin-bottom:0;"><label>Arc radius (roundness) — ${this.eyeBulge} cm</label>
                <input type="range" min="${(this.eyeW/2+0.1).toFixed(1)}" max="8" step="0.1" value="${this.eyeBulge}" oninput="app.activeModule.setP('eyeBulge', this.value)"></div>
            </div>
            <div class="proof-box">A smaller radius (closer to half the eye-width) gives a rounder eye; a larger radius gives a flatter, more almond-shaped eye. Both arcs use the same radius, mirrored top and bottom, so the eye stays symmetric.</div>
        `;
    }
    renderStage(){
        if (this.subMode==='person') return this.renderPerson();
        if (this.subMode==='wave') return this.renderWave();
        return this.renderEyes();
    }
    renderPerson(){
        const cx = 400, headCy = 180;
        const headR = cm(Math.min(this.headR,3)*0 + this.headR*0.6+ 0.6); // visual scale clamp
        const rHead = cm(this.headR) * 0.9;
        const bw = cm(this.bodyW), bh = cm(4.2);
        const bx1 = cx - bw/2, bx2 = cx + bw/2;
        const bTop = headCy + rHead + cm(0.6);
        const bBot = bTop + bh;
        let html = `<circle cx="${cx}" cy="${headCy}" r="${rHead}" fill="none" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${cx}" y1="${headCy+rHead}" x2="${cx}" y2="${bTop}" stroke="#fff" stroke-width="2.5"/>`;
        const minRcm = this.bodyW/2 + 0.02;
        const rArm = cm(Math.max(this.headR, minRcm));
        const half = bw/2;
        const validArm = rArm >= half;
        let dip = 0;
        if (validArm) dip = Math.sqrt(rArm*rArm - half*half);
        const armCx = cx, armCy = bTop + dip;
        if (validArm) {
            const startAng = Math.atan2(bTop-armCy, bx1-armCx);
            const endAng = Math.atan2(bTop-armCy, bx2-armCx);
            html += `<path d="M ${bx1} ${bTop} A ${rArm} ${rArm} 0 0 1 ${bx2} ${bTop}" fill="none" stroke="#fff" stroke-width="2.5"/>`;
            html += `<circle cx="${armCx}" cy="${armCy}" r="3" fill="var(--brass-lt)"/>`;
            html += compassIcon(armCx, armCy, 0, 0.9);
        }
        html += `<line x1="${bx1}" y1="${bTop}" x2="${bx1}" y2="${bBot}" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${bx2}" y1="${bTop}" x2="${bx2}" y2="${bBot}" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${bx1}" y1="${bBot}" x2="${bx2}" y2="${bBot}" stroke="#fff" stroke-width="2.5"/>`;
        html += `<text x="${cx}" y="570" text-anchor="middle" class="svg-label-sm">compass tip at the brass dot, radius = ${this.headR} cm</text>`;
        return { type:'svg', html };
    }
    renderWave(){
        const ab = cm(this.waveAB);
        const Ax = 400 - ab/2, Ay = 320, Bx = 400 + ab/2;
        const Xx = 400;
        let html = `<line x1="${Ax-20}" y1="${Ay}" x2="${Bx+20}" y2="${Ay}" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>`;
        html += `<line x1="${Ax}" y1="${Ay}" x2="${Bx}" y2="${Ay}" stroke="#fff" stroke-width="2"/>`;
        if (!this.waveSmall) {
            const r = ab/4;
            html += `<path d="M ${Ax} ${Ay} A ${r} ${r} 0 0 1 ${Xx} ${Ay}" fill="none" stroke="var(--brass-lt)" stroke-width="2.5"/>`;
            html += `<path d="M ${Xx} ${Ay} A ${r} ${r} 0 0 0 ${Bx} ${Ay}" fill="none" stroke="var(--blueprint-lt)" stroke-width="2.5"/>`;
            html += `<circle cx="${Ax+r}" cy="${Ay}" r="3" fill="var(--brass-lt)"/>`;
            html += `<circle cx="${Xx+r}" cy="${Ay}" r="3" fill="var(--blueprint-lt)"/>`;
        } else {
            const r = (ab/4) * this.waveFactor;
            const c1x = Ax + r, c2x = Xx + r;
            html += `<path d="M ${Ax} ${Ay} A ${r} ${r} 0 0 1 ${Ax+2*r} ${Ay}" fill="none" stroke="var(--brass-lt)" stroke-width="2.5"/>`;
            html += `<line x1="${Ax+2*r}" y1="${Ay}" x2="${Xx}" y2="${Ay}" stroke="#fff" stroke-width="2"/>`;
            html += `<path d="M ${Xx} ${Ay} A ${r} ${r} 0 0 0 ${Xx+2*r} ${Ay}" fill="none" stroke="var(--blueprint-lt)" stroke-width="2.5"/>`;
            html += `<line x1="${Xx+2*r}" y1="${Ay}" x2="${Bx}" y2="${Ay}" stroke="#fff" stroke-width="2"/>`;
        }
        html += `<circle cx="${Ax}" cy="${Ay}" r="4" fill="#e35a8f"/><text x="${Ax-6}" y="${Ay+22}" class="svg-label">A</text>`;
        html += `<circle cx="${Bx}" cy="${Ay}" r="4" fill="#e35a8f"/><text x="${Bx-4}" y="${Ay+22}" class="svg-label">B</text>`;
        html += `<circle cx="${Xx}" cy="${Ay}" r="3" fill="#fff"/><text x="${Xx-4}" y="${Ay-14}" class="svg-label">X</text>`;
        return { type:'svg', html };
    }
    renderEyes(){
        const w = cm(this.eyeW), r = cm(this.eyeBulge);
        const half = w/2;
        const dip = Math.sqrt(Math.max(r*r-half*half,0));
        const cy = 300;
        const cx = 400;
        const upperCenterY = cy + dip;
        const lowerCenterY = cy - dip;
        const x1 = cx-half, x2 = cx+half;
        let one = (ox)=>{
            let html = `<path d="M ${ox-half} ${cy} A ${r} ${r} 0 0 1 ${ox+half} ${cy}" fill="none" stroke="#fff" stroke-width="2.5"/>`;
            html += `<path d="M ${ox-half} ${cy} A ${r} ${r} 0 0 0 ${ox+half} ${cy}" fill="none" stroke="#fff" stroke-width="2.5"/>`;
            html += `<circle cx="${ox}" cy="${cy - (cy-lowerCenterY)*0.35}" r="${w*0.16}" fill="#061c30" stroke="#fff" stroke-width="1"/>`;
            return html;
        };
        let html = one(cx-half-30) + one(cx+half+30);
        html += `<text x="400" y="560" text-anchor="middle" class="svg-label-sm">radius ${this.eyeBulge} cm, tips ${this.eyeW} cm apart</text>`;
        return { type:'svg', html };
    }
}

// =========================================================================
// MODULE 3 — SQUARES & RECTANGLES LAB (§8.2)
// =========================================================================
class SquareRectLabModule {
    constructor(){ this.subMode='rotate'; this.angle=0; this.quizPick=null;
        this.dotSel=null; }
    setSubMode(m){ this.subMode=m; app.render(); }
    setAngle(v){ this.angle=parseFloat(v); app.render(); }
    pickName(v){ this.quizPick=v; app.render(); }
    selectDot(k){ this.dotSel=k; app.render(); }
    updatePoint(){}
    tabsHTML(){
        return `<div class="pill-row">
            <div class="pill-btn ${this.subMode==='rotate'?'active':''}" onclick="app.activeModule.setSubMode('rotate')">Rotated Square</div>
            <div class="pill-btn ${this.subMode==='naming'?'active':''}" onclick="app.activeModule.setSubMode('naming')">Naming Rule</div>
            <div class="pill-btn ${this.subMode==='dotgrid'?'active':''}" onclick="app.activeModule.setSubMode('dotgrid')">Dot-grid Check</div>
        </div>`;
    }
    getSidebarHTML(){
        if (this.subMode==='rotate') return this.rotateSidebar();
        if (this.subMode==='naming') return this.namingSidebar();
        return this.dotgridSidebar();
    }
    rotateSidebar(){
        return `
            <h2>Squares &amp; Rectangles</h2>
            ${this.tabsHTML()}
            <p><b>§8.2</b> · A square keeps its side-length and 90° angles no matter how you rotate it. Drag the slider and watch the properties stay true.</p>
            <div class="data-panel">
                <div class="range-row" style="margin-bottom:0;"><label>Rotation — ${this.angle}°</label>
                <input type="range" min="0" max="90" step="1" value="${this.angle}" oninput="app.activeModule.setAngle(this.value)"></div>
            </div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Square properties</div>
                <div class="data-row"><span>S1 — all sides equal</span>${checkDot(true)}</div>
                <div class="data-row"><span>S2 — all angles 90°</span>${checkDot(true)}</div>
            </div>
            <div class="proof-box">Rotating a shape is a <i>rigid</i> motion — it only spins the figure, it never stretches a side or bends an angle. So a rotated square is still a square, and a rotated rectangle is still a rectangle.</div>
        `;
    }
    namingSidebar(){
        const opts = ['PQSR','SPQR','RSPQ','QRSP'];
        const correct = 'PQSR';
        return `
            <h2>Squares &amp; Rectangles</h2>
            ${this.tabsHTML()}
            <p><b>Naming rule.</b> A valid name lists the corners in order of travel around the shape (clockwise or anticlockwise), starting from any corner. Which one below is <b>NOT</b> a valid name for this square?</p>
            <div class="pill-row">
                ${opts.map(o=>`<div class="pill-btn ${this.quizPick===o?'active':''}" onclick="app.activeModule.pickName('${o}')">${o}</div>`).join('')}
            </div>
            ${this.quizPick ? `<div class="badge ${this.quizPick===correct?'success':'danger'}">${this.quizPick===correct ? '✓ Correct — PQSR skips around out of order.' : '✕ Try again — check the order of travel around the corners.'}</div>` : ''}
            <div class="proof-box">Going around the square you meet the corners in the order S → P → Q → R (or the reverse). SPQR, RSPQ and QRSP are just that same cycle started at a different corner. PQSR breaks the cycle.</div>
        `;
    }
    dotgridSidebar(){
        const shapes = this.getDotShapes();
        const sel = this.dotSel;
        return `
            <h2>Squares &amp; Rectangles</h2>
            ${this.tabsHTML()}
            <p><b>Figure it Out.</b> Tap a shape on the dot grid, then use the measurements to decide: is it a square?</p>
            <div class="pill-row">
                ${Object.keys(shapes).map(k=>`<div class="pill-btn ${sel===k?'active':''}" onclick="app.activeModule.selectDot('${k}')">${k}</div>`).join('')}
            </div>
            ${sel ? (()=>{
                const pts = shapes[sel];
                const sides = [0,1,2,3].map(i=>U.r2(U.dist(pts[i][0],pts[i][1],pts[(i+1)%4][0],pts[(i+1)%4][1])));
                const allEqual = sides.every(s=>Math.abs(s-sides[0])<0.01);
                return `<div class="data-panel">
                    ${sides.map((s,i)=>`<div class="data-row"><span>Side ${i+1}</span><span>${s} grid-units</span></div>`).join('')}
                </div>
                <div class="badge ${allEqual?'success':'danger'}">${allEqual ? `Shape ${sel} is a square ✓` : `Shape ${sel} is NOT a square`}</div>`;
            })() : '<div class="proof-box">Select a shape above to measure it.</div>'}
        `;
    }
    getDotShapes(){
        return {
            A: [[2,4],[4,2],[6,4],[4,6]],
            B: [[9,4],[11,2],[13,4],[11,6]],
            C: [[16,4],[18,2],[20,4],[18,6]],
            D: [[23,3],[24,2],[25,4],[24,5]]
        };
    }
    renderStage(){
        if (this.subMode==='rotate') return this.renderRotate();
        if (this.subMode==='naming') return this.renderNaming();
        return this.renderDotgrid();
    }
    renderRotate(){
        const side = cm(3.6);
        const cx=400, cy=300, a = this.angle*Math.PI/180;
        const half = side/2;
        const corners = [[-half,-half],[half,-half],[half,half],[-half,half]].map(([x,y])=>({
            x: cx + x*Math.cos(a) - y*Math.sin(a),
            y: cy + x*Math.sin(a) + y*Math.cos(a)
        }));
        const pts = corners.map(p=>`${p.x},${p.y}`).join(' ');
        let html = `<polygon points="${pts}" fill="rgba(47,117,172,0.25)" stroke="#fff" stroke-width="2.5"/>`;
        const labels=['P','Q','R','S'];
        corners.forEach((c,i)=>{
            html += `<circle cx="${c.x}" cy="${c.y}" r="3" fill="var(--brass-lt)"/>`;
            html += `<text x="${c.x + 14*Math.cos(a+i*Math.PI/2+Math.PI/4)}" y="${c.y + 14*Math.sin(a+i*Math.PI/2+Math.PI/4)}" text-anchor="middle" class="svg-label">${labels[i]}</text>`;
        });
        html += `<text x="400" y="560" text-anchor="middle" class="svg-label-sm">side = 3.6 cm at every angle</text>`;
        return { type:'svg', html };
    }
    renderNaming(){
        const s = cm(3);
        const cx=400,cy=300;
        const P={x:cx+s/2,y:cy-s/2}, Q={x:cx+s/2,y:cy+s/2}, R={x:cx-s/2,y:cy+s/2}, Sp={x:cx-s/2,y:cy-s/2};
        let html = `<polygon points="${[P,Q,R,Sp].map(p=>`${p.x},${p.y}`).join(' ')}" fill="rgba(47,117,172,0.2)" stroke="#fff" stroke-width="2.5"/>`;
        html += `<text x="${P.x+12}" y="${P.y}" class="svg-label">P</text>`;
        html += `<text x="${Q.x+12}" y="${Q.y}" class="svg-label">Q</text>`;
        html += `<text x="${R.x-20}" y="${R.y}" class="svg-label">R</text>`;
        html += `<text x="${Sp.x-20}" y="${Sp.y}" class="svg-label">S</text>`;
        return { type:'svg', html };
    }
    renderDotgrid(){
        const shapes = this.getDotShapes();
        const step = 26, ox=60, oy=60;
        let html = '';
        for(let r=0;r<9;r++) for(let c=0;c<28;c++) html += `<circle cx="${ox+c*step}" cy="${oy+r*step}" r="2" fill="rgba(255,255,255,0.25)"/>`;
        Object.keys(shapes).forEach(k=>{
            const pts = shapes[k].map(([gx,gy])=>({x:ox+gx*step,y:oy+gy*step}));
            const isSel = this.dotSel===k;
            html += `<polygon points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="${isSel?'rgba(201,138,62,0.3)':'rgba(47,117,172,0.15)'}" stroke="${isSel?'var(--brass-lt)':'#fff'}" stroke-width="2"/>`;
            const cx = pts.reduce((a,p)=>a+p.x,0)/4;
            html += `<text x="${cx}" y="${oy+8*step}" text-anchor="middle" class="svg-label">${k}</text>`;
        });
        return { type:'svg', html };
    }
}

// =========================================================================
// MODULE 4 — CONSTRUCT BUILDER (§8.3, §8.5 diagonal methods)
// =========================================================================
class ConstructBuilderModule {
    constructor(){ this.subMode='square'; this.side=6; this.len=7; this.brd=4;
        this.baseSide=5; this.diag=8; this.step=0; this.angle1=60; }
    setSubMode(m){ this.subMode=m; this.step=0; app.render(); }
    setP(k,v){ this[k]=parseFloat(v); this.step=0; app.render(); }
    next(){ this.step = Math.min(this.step+1, 6); app.render(); }
    prev(){ this.step = Math.max(this.step-1, 0); app.render(); }
    reset(){ this.step=0; app.render(); }
    updatePoint(){}
    tabsHTML(){
        return `<div class="pill-row">
            <div class="pill-btn ${this.subMode==='square'?'active':''}" onclick="app.activeModule.setSubMode('square')">Square (side)</div>
            <div class="pill-btn ${this.subMode==='rectangle'?'active':''}" onclick="app.activeModule.setSubMode('rectangle')">Rectangle (sides)</div>
        </div>
        <div class="pill-row">
            <div class="pill-btn ${this.subMode==='diagonal'?'active':''}" onclick="app.activeModule.setSubMode('diagonal')">Rectangle (side + diagonal)</div>
            <div class="pill-btn ${this.subMode==='angle'?'active':''}" onclick="app.activeModule.setSubMode('angle')">Rectangle (diagonal angle)</div>
        </div>`;
    }
    getSidebarHTML(){
        if (this.subMode==='square') return this.stepSidebar('square');
        if (this.subMode==='rectangle') return this.stepSidebar('rectangle');
        if (this.subMode==='diagonal') return this.stepSidebar('diagonal');
        return this.angleSidebar();
    }
    stepSidebar(kind){
        const maxStep = kind==='diagonal' ? 4 : 6;
        const labels = kind==='diagonal'
            ? ['Start','Draw base CD','Perpendicular at C','Compass arc from D, radius = diagonal → point B','Perpendiculars from D and B → point A. Rectangle complete!']
            : ['Start','Draw base PQ','Protractor: perpendicular at P','Compass: mark S on it (= side)','Protractor: perpendicular at Q','Compass: mark R on it (= side)','Join R–S. Rectangle complete!'];
        let inputs = '';
        if (kind==='square') inputs = `<div class="range-row" style="margin-bottom:0;"><label>Side length — ${this.side} cm</label>
            <input type="range" min="3" max="9" step="0.5" value="${this.side}" oninput="app.activeModule.setP('side', this.value)"></div>`;
        else if (kind==='rectangle') inputs = `
            <div class="range-row"><label>Length PQ — ${this.len} cm</label>
            <input type="range" min="3" max="10" step="0.5" value="${this.len}" oninput="app.activeModule.setP('len', this.value)"></div>
            <div class="range-row" style="margin-bottom:0;"><label>Breadth QR — ${this.brd} cm</label>
            <input type="range" min="2" max="8" step="0.5" value="${this.brd}" oninput="app.activeModule.setP('brd', this.value)"></div>`;
        else inputs = `
            <div class="range-row"><label>Side CD — ${this.len} cm</label>
            <input type="range" min="3" max="8" step="0.5" value="${this.len}" oninput="app.activeModule.setP('len', this.value)"></div>
            <div class="range-row" style="margin-bottom:0;"><label>Diagonal — ${this.diag} cm</label>
            <input type="range" min="${(this.len+0.5).toFixed(1)}" max="12" step="0.5" value="${this.diag}" oninput="app.activeModule.setP('diag', this.value)"></div>`;
        const invalid = kind==='diagonal' && this.diag <= this.len;
        return `
            <h2>Construct Builder</h2>
            ${this.tabsHTML()}
            <p><b>§8.3</b> · Follow each step exactly as you would with a real ruler, protractor and compass.</p>
            <div class="data-panel">${inputs}</div>
            ${invalid ? '<div class="badge danger">Diagonal must be longer than the given side!</div>' : `
            <div class="badge info">Step ${this.step} of ${maxStep}: ${labels[this.step]}</div>
            <div class="btn-grid">
                <button class="action-btn" onclick="app.activeModule.prev()" ${this.step===0?'disabled':''}>« Back</button>
                <button class="action-btn primary" onclick="app.activeModule.next()" ${this.step>=maxStep?'disabled':''}>Next »</button>
            </div>
            <button class="action-btn wide" onclick="app.activeModule.reset()">↻ Restart</button>
            `}
            <div class="proof-box">${kind==='diagonal'
                ? 'Instead of hunting for the one point that is the right distance away, we draw the whole circle of possible points (the compass arc) and pick where it crosses the perpendicular line — no trial and error needed.'
                : 'Right angles come from the protractor (or two arcs with a compass); equal lengths come from the compass, transferred straight off the ruler.'}</div>
        `;
    }
    angleSidebar(){
        const a1 = this.angle1, a2 = 90-a1;
        return `
            <h2>Construct Builder</h2>
            ${this.tabsHTML()}
            <p><b>§8.5</b> · Construct a rectangle whose diagonal splits one corner angle into two given parts (they must add up to 90°, since every corner of a rectangle is a right angle).</p>
            <div class="data-panel">
                <div class="range-row" style="margin-bottom:0;"><label>First part of the angle — ${a1}°</label>
                <input type="range" min="10" max="80" step="1" value="${a1}" oninput="app.activeModule.setP('angle1', this.value)"></div>
            </div>
            <div class="badge violet">∠A = ${a1}° + ${a2}° = 90°</div>
            <div class="data-panel">
                <div class="data-row"><span>Base AB (chosen freely)</span><span>5 cm</span></div>
                <div class="data-row"><span>Height AD = 5 × tan(${a1}°)</span><span>${U.r1(5*Math.tan(a1*Math.PI/180))} cm</span></div>
            </div>
            <div class="proof-box">Draw AB, erect a perpendicular at B, then use a protractor to draw a ray from A at ${a1}° to meet it at C. A perpendicular through A gives the line for D; transfer length BC onto it with a compass to fix D.</div>
        `;
    }
    renderStage(){
        if (this.subMode==='angle') return this.renderAngle();
        return this.renderSteps();
    }
    renderSteps(){
        const kind = this.subMode;
        const step = this.step;
        let html = '';
        if (kind==='square' || kind==='rectangle'){
            const w = cm(kind==='square'?this.side:this.len);
            const h = cm(kind==='square'?this.side:this.brd);
            const P={x:250,y:430}, Q={x:250+w,y:430};
            const Sp={x:250,y:430-h}, R={x:250+w,y:430-h};
            if (step>=1){ html += `<line x1="${P.x}" y1="${P.y}" x2="${Q.x}" y2="${Q.y}" stroke="#fff" stroke-width="2.5"/>`;
                html += `<circle cx="${P.x}" cy="${P.y}" r="3.5" fill="#e35a8f"/><text x="${P.x-8}" y="${P.y+22}" class="svg-label">P</text>`;
                html += `<circle cx="${Q.x}" cy="${Q.y}" r="3.5" fill="#e35a8f"/><text x="${Q.x-4}" y="${Q.y+22}" class="svg-label">Q</text>`;
                html += rulerIcon(P.x,P.y,Q.x,Q.y); }
            if (step>=2){ html += `<line x1="${P.x}" y1="${P.y}" x2="${P.x}" y2="${P.y-h-30}" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>`;
                html += protractorIcon(P.x,P.y); html += rightAngleMark(P.x,P.y,1,0,0,-1); }
            if (step>=3){ html += `<line x1="${P.x}" y1="${P.y}" x2="${Sp.x}" y2="${Sp.y}" stroke="#fff" stroke-width="2.5"/>`;
                html += `<circle cx="${Sp.x}" cy="${Sp.y}" r="3.5" fill="#e35a8f"/><text x="${Sp.x-10}" y="${Sp.y-8}" class="svg-label">S</text>`;
                html += compassIcon(P.x,P.y-h,0,0.9); }
            if (step>=4){ html += `<line x1="${Q.x}" y1="${Q.y}" x2="${Q.x}" y2="${Q.y-h-30}" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>`;
                html += protractorIcon(Q.x,Q.y); html += rightAngleMark(Q.x,Q.y,-1,0,0,-1); }
            if (step>=5){ html += `<line x1="${Q.x}" y1="${Q.y}" x2="${R.x}" y2="${R.y}" stroke="#fff" stroke-width="2.5"/>`;
                html += `<circle cx="${R.x}" cy="${R.y}" r="3.5" fill="#e35a8f"/><text x="${R.x+8}" y="${R.y-8}" class="svg-label">R</text>`;
                html += compassIcon(Q.x,Q.y-h,0,0.9); }
            if (step>=6){ html += `<line x1="${R.x}" y1="${R.y}" x2="${Sp.x}" y2="${Sp.y}" stroke="var(--brass-lt)" stroke-width="2.5"/>`;
                html += rightAngleMark(Sp.x,Sp.y,1,0,0,1); html += rightAngleMark(R.x,R.y,-1,0,0,1);
                html += `<text x="${(P.x+Q.x)/2}" y="565" text-anchor="middle" class="svg-label">Construction complete</text>`; }
        } else if (kind==='diagonal'){
            const side = cm(this.len), diag = cm(this.diag);
            const D={x:250,y:450}, C={x:250+side,y:450};
            const height = Math.sqrt(Math.max(diag*diag-side*side,0));
            const B={x:C.x,y:C.y-height}, A={x:D.x,y:D.y-height};
            if (step>=1){ html += `<line x1="${D.x}" y1="${D.y}" x2="${C.x}" y2="${C.y}" stroke="#fff" stroke-width="2.5"/>`;
                html += `<circle cx="${D.x}" cy="${D.y}" r="3.5" fill="#e35a8f"/><text x="${D.x-10}" y="${D.y+22}" class="svg-label">D</text>`;
                html += `<circle cx="${C.x}" cy="${C.y}" r="3.5" fill="#e35a8f"/><text x="${C.x-4}" y="${C.y+22}" class="svg-label">C</text>`;
                html += rulerIcon(D.x,D.y,C.x,C.y); }
            if (step>=2){ html += `<line x1="${C.x}" y1="${C.y}" x2="${C.x}" y2="${C.y-height-40}" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>`;
                html += protractorIcon(C.x,C.y); html += rightAngleMark(C.x,C.y,-1,0,0,-1); }
            if (step>=3){ html += `<circle cx="${D.x}" cy="${D.y}" r="${diag}" fill="none" stroke="rgba(227,172,106,0.5)" stroke-width="1.5" stroke-dasharray="3,3"/>`;
                html += `<circle cx="${B.x}" cy="${B.y}" r="3.5" fill="#e35a8f"/><text x="${B.x+8}" y="${B.y-6}" class="svg-label">B</text>`;
                html += `<line x1="${D.x}" y1="${D.y}" x2="${B.x}" y2="${B.y}" stroke="var(--brass-lt)" stroke-width="2" stroke-dasharray="4,3"/>`;
                html += compassIcon(D.x,D.y,0,1.2); }
            if (step>=4){ html += `<line x1="${D.x}" y1="${D.y}" x2="${A.x}" y2="${A.y}" stroke="#fff" stroke-width="2.5"/>`;
                html += `<line x1="${B.x}" y1="${B.y}" x2="${A.x}" y2="${A.y}" stroke="#fff" stroke-width="2.5"/>`;
                html += `<circle cx="${A.x}" cy="${A.y}" r="3.5" fill="#e35a8f"/><text x="${A.x-10}" y="${A.y-8}" class="svg-label">A</text>`;
                html += rightAngleMark(D.x,D.y,1,0,0,-1); html += rightAngleMark(A.x,A.y,1,0,0,1); html += rightAngleMark(B.x,B.y,-1,0,0,1);
                html += `<text x="${(D.x+C.x)/2}" y="565" text-anchor="middle" class="svg-label">Rectangle ABCD complete — diagonal DB = ${this.diag} cm</text>`; }
        }
        return { type:'svg', html };
    }
    renderAngle(){
        const a1r = this.angle1*Math.PI/180;
        const ab = cm(5);
        const A={x:250,y:450}, B={x:250+ab,y:450};
        const bc = ab*Math.tan(a1r);
        const C={x:B.x,y:B.y-bc};
        const D={x:A.x,y:A.y-bc};
        let html = `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${B.x}" y1="${B.y}" x2="${C.x}" y2="${C.y}" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${C.x}" y1="${C.y}" x2="${D.x}" y2="${D.y}" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${D.x}" y1="${D.y}" x2="${A.x}" y2="${A.y}" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}" stroke="var(--brass-lt)" stroke-width="2" stroke-dasharray="5,4"/>`;
        html += rightAngleMark(B.x,B.y,-1,0,0,-1); html += rightAngleMark(A.x,A.y,1,0,0,-1);
        const arcR = 34;
        html += `<path d="M ${A.x+arcR} ${A.y} A ${arcR} ${arcR} 0 0 0 ${A.x + arcR*Math.cos(Math.atan2(C.y-A.y,C.x-A.x))} ${A.y + arcR*Math.sin(Math.atan2(C.y-A.y,C.x-A.x))}" fill="none" stroke="var(--success)" stroke-width="2"/>`;
        html += `<text x="${A.x+44}" y="${A.y-14}" class="svg-label-sm" fill="var(--success)">${this.angle1}°</text>`;
        [A,B,C,D].forEach((p,i)=>{
            const lb=['A','B','C','D'][i];
            html += `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#e35a8f"/>`;
            html += `<text x="${p.x + (i===0||i===3?-14:8)}" y="${p.y + (i<2?22:-8)}" class="svg-label">${lb}</text>`;
        });
        return { type:'svg', html };
    }
}

// =========================================================================
// MODULE 5 — RECTANGLE EXPLORER (§8.4)
// =========================================================================
class RectExplorationModule {
    constructor(){ this.subMode='xy'; this.AB=7; this.BC=4; this.xd=1; this.yd=3; this.log=[];
        this.breakN = 2; this.afSide = 3; }
    setSubMode(m){ this.subMode=m; app.render(); }
    setP(k,v){ this[k]=parseFloat(v); app.render(); }
    logIt(){ const xy = this.xyLen(); this.log.push({x:this.xd,y:this.yd,xy}); if(this.log.length>8) this.log.shift(); app.render(); }
    clearLog(){ this.log=[]; app.render(); }
    setBreak(n){ this.breakN=n; app.render(); }
    updatePoint(){}
    xyLen(){ return U.r2(Math.sqrt(this.AB*this.AB + (this.xd-this.yd)*(this.xd-this.yd))); }
    tabsHTML(){
        return `<div class="pill-row">
            <div class="pill-btn ${this.subMode==='xy'?'active':''}" onclick="app.activeModule.setSubMode('xy')">XY Distance Lab</div>
            <div class="pill-btn ${this.subMode==='break'?'active':''}" onclick="app.activeModule.setSubMode('break')">Breaking Rectangles</div>
        </div>`;
    }
    getSidebarHTML(){
        if (this.subMode==='xy') return this.xySidebar();
        return this.breakSidebar();
    }
    xySidebar(){
        const xy = this.xyLen();
        const diag = U.r2(Math.sqrt(this.AB*this.AB+this.BC*this.BC));
        return `
            <h2>Rectangle Explorer</h2>
            ${this.tabsHTML()}
            <p><b>§8.4</b> · X slides along AD, Y slides along BC. Where are X and Y nearest? Farthest?</p>
            <div class="data-panel">
                <div class="range-row"><label>AB — ${this.AB} cm</label>
                <input type="range" min="4" max="10" step="0.5" value="${this.AB}" oninput="app.activeModule.setP('AB', this.value)"></div>
                <div class="range-row"><label>BC — ${this.BC} cm</label>
                <input type="range" min="2" max="7" step="0.5" value="${this.BC}" oninput="app.activeModule.setP('BC', this.value)"></div>
                <div class="range-row"><label>X from A — ${this.xd} cm</label>
                <input type="range" min="0" max="${this.BC}" step="0.5" value="${Math.min(this.xd,this.BC)}" oninput="app.activeModule.setP('xd', this.value)"></div>
                <div class="range-row" style="margin-bottom:0;"><label>Y from B — ${this.yd} cm</label>
                <input type="range" min="0" max="${this.BC}" step="0.5" value="${Math.min(this.yd,this.BC)}" oninput="app.activeModule.setP('yd', this.value)"></div>
            </div>
            <div class="badge info">XY = ${xy} cm</div>
            <div class="btn-grid">
                <button class="action-btn primary" onclick="app.activeModule.logIt()">📌 Log this position</button>
                <button class="action-btn" onclick="app.activeModule.clearLog()">Clear log</button>
            </div>
            <div class="data-panel" style="max-height:160px;overflow-y:auto;">
                <div style="font-weight:700;margin-bottom:6px;">Logged positions</div>
                ${this.log.length===0 ? '<p style="margin:0;">No positions logged yet.</p>' :
                    `<div class="data-row" style="font-weight:700;"><span>X from A</span><span>Y from B</span><span>XY</span></div>` +
                    this.log.map(l=>`<div class="data-row"><span>${l.x} cm</span><span>${l.y} cm</span><span>${l.xy} cm</span></div>`).join('')}
            </div>
            <div class="data-panel">
                <div class="data-row"><span>Nearest possible (X=Y)</span><span>= AB = ${this.AB} cm</span></div>
                <div class="data-row"><span>Farthest possible</span><span>= diagonal AC/BD = ${diag} cm</span></div>
            </div>
            <div class="proof-box">When X and Y are at equal distances from A and B, XY runs parallel to AB and equals it exactly — ABYX becomes a rectangle. Push X and Y to opposite ends and XY stretches to the full diagonal.</div>
        `;
    }
    breakSidebar(){
        return `
            <h2>Rectangle Explorer</h2>
            ${this.tabsHTML()}
            <p><b>Breaking Rectangles.</b> Construct a rectangle that splits perfectly into identical squares — plan first, then build.</p>
            <div class="pill-row">
                <div class="pill-btn ${this.breakN===2?'active':''}" onclick="app.activeModule.setBreak(2)">2 squares</div>
                <div class="pill-btn ${this.breakN===3?'active':''}" onclick="app.activeModule.setBreak(3)">3 squares</div>
            </div>
            <div class="data-panel">
                <div class="range-row" style="margin-bottom:0;"><label>Square side (AF) — ${this.afSide} cm</label>
                <input type="range" min="1.5" max="5" step="0.5" value="${this.afSide}" oninput="app.activeModule.setP('afSide', this.value)"></div>
            </div>
            <div class="badge success">Rectangle: ${this.afSide * this.breakN} cm × ${this.afSide} cm</div>
            <div class="proof-box">Plan with a rough sketch first: mark the equal sides with tick (|) conventions. Draw one side without measuring, then use the compass to transfer that exact length across, rather than guessing with a ruler.</div>
        `;
    }
    renderStage(){
        if (this.subMode==='xy') return this.renderXY();
        return this.renderBreak();
    }
    renderXY(){
        const w = cm(this.AB), h = cm(this.BC);
        const Ax=250, Ay=200, Bx=Ax+w, By=Ay;
        const Dx=Ax, Dy=Ay+h, Cx=Bx, Cy=By+h;
        let html = `<polygon points="${Ax},${Ay} ${Bx},${By} ${Cx},${Cy} ${Dx},${Dy}" fill="rgba(47,117,172,0.12)" stroke="#fff" stroke-width="2.5"/>`;
        const xd = cm(Math.min(this.xd,this.BC)), yd = cm(Math.min(this.yd,this.BC));
        const X={x:Ax,y:Ay+xd}, Y={x:Bx,y:By+yd};
        html += `<polygon points="${Ax},${Ay} ${Bx},${By} ${Y.x},${Y.y} ${X.x},${X.y}" fill="rgba(201,138,62,0.18)" stroke="none"/>`;
        html += `<line x1="${X.x}" y1="${X.y}" x2="${Y.x}" y2="${Y.y}" stroke="var(--brass-lt)" stroke-width="2.5"/>`;
        [['A',Ax,Ay,-14,-8],['B',Bx,By,8,-8],['C',Cx,Cy,8,18],['D',Dx,Dy,-14,18]].forEach(([lb,x,y,dx,dy])=>{
            html += `<circle cx="${x}" cy="${y}" r="3.5" fill="#e35a8f"/><text x="${x+dx}" y="${y+dy}" class="svg-label">${lb}</text>`;
        });
        html += `<circle cx="${X.x}" cy="${X.y}" r="4" fill="var(--brass-lt)"/><text x="${X.x-16}" y="${X.y+4}" class="svg-label">X</text>`;
        html += `<circle cx="${Y.x}" cy="${Y.y}" r="4" fill="var(--brass-lt)"/><text x="${Y.x+8}" y="${Y.y+4}" class="svg-label">Y</text>`;
        html += `<text x="${(Ax+Bx)/2}" y="565" text-anchor="middle" class="svg-label">XY = ${this.xyLen()} cm</text>`;
        return { type:'svg', html };
    }
    renderBreak(){
        const s = cm(this.afSide);
        const x0=250, y0=250;
        let html = '';
        for (let i=0;i<this.breakN;i++){
            html += `<rect x="${x0+i*s}" y="${y0}" width="${s}" height="${s}" fill="rgba(47,117,172,0.15)" stroke="#fff" stroke-width="2"/>`;
        }
        html += `<rect x="${x0}" y="${y0}" width="${s*this.breakN}" height="${s}" fill="none" stroke="var(--brass-lt)" stroke-width="2.5"/>`;
        html += `<text x="${x0+s*this.breakN/2}" y="${y0+s+30}" text-anchor="middle" class="svg-label">${this.afSide} cm × ${this.breakN} = ${this.afSide*this.breakN} cm</text>`;
        return { type:'svg', html };
    }
}

// =========================================================================
// MODULE 6 — DIAGONALS LAB (§8.5)
// =========================================================================
class DiagonalsLabModule {
    constructor(){ this.w=7; this.h=4; this.square=false; }
    setW(v){ this.w=parseFloat(v); if(this.square) this.h=this.w; app.render(); }
    setH(v){ this.h=parseFloat(v); app.render(); }
    toggleSquare(){ this.square=!this.square; if(this.square) this.h=this.w; app.render(); }
    updatePoint(){}
    angles(){
        const a = Math.atan2(this.h,this.w)*180/Math.PI;
        return { atP: [90-a, a], atQ:[a,90-a], atR:[90-a,a], atS:[a,90-a] };
    }
    getSidebarHTML(){
        const ang = this.angles();
        return `
            <h2>Diagonals Lab</h2>
            <p><b>§8.5</b> · Join the diagonals PR and QS of rectangle PQRS. Each one splits the corner angles into two parts. Are the parts across from each other equal?</p>
            <div class="data-panel">
                <div class="range-row"><label>Width PQ — ${this.w} cm</label>
                <input type="range" min="3" max="10" step="0.5" value="${this.w}" oninput="app.activeModule.setW(this.value)"></div>
                <div class="range-row" style="margin-bottom:0;"><label>Height QR — ${this.h} cm</label>
                <input type="range" min="3" max="10" step="0.5" value="${this.h}" oninput="app.activeModule.setH(this.value)" ${this.square?'disabled':''}></div>
            </div>
            <div class="data-panel" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="app.activeModule.toggleSquare()">
                <strong>Special case: make it a square</strong>${toggleSwitch(this.square)}
            </div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Angles split by the diagonals</div>
                <div class="data-row"><span>At P</span><span>${U.r1(ang.atP[0])}° + ${U.r1(ang.atP[1])}°</span></div>
                <div class="data-row"><span>At Q</span><span>${U.r1(ang.atQ[0])}° + ${U.r1(ang.atQ[1])}°</span></div>
                <div class="data-row"><span>At R</span><span>${U.r1(ang.atR[0])}° + ${U.r1(ang.atR[1])}°</span></div>
                <div class="data-row"><span>At S</span><span>${U.r1(ang.atS[0])}° + ${U.r1(ang.atS[1])}°</span></div>
            </div>
            <div class="badge ${this.square?'success':'info'}">${this.square ? "A square's diagonal splits every angle into two equal 45° halves ✓" : 'Diagonals of opposite corners split into matching pairs of parts'}</div>
            <div class="proof-box">The two diagonals of any rectangle are always equal in length and bisect each other — but they only bisect the <i>corner angles</i> equally when the rectangle is a square.</div>
        `;
    }
    renderStage(){
        const w = cm(this.w), h = cm(this.h);
        const cx=400, cy=300;
        const P={x:cx-w/2,y:cy-h/2}, Q={x:cx+w/2,y:cy-h/2}, R={x:cx+w/2,y:cy+h/2}, Sp={x:cx-w/2,y:cy+h/2};
        let html = `<polygon points="${[P,Q,R,Sp].map(p=>`${p.x},${p.y}`).join(' ')}" fill="rgba(47,117,172,0.12)" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${P.x}" y1="${P.y}" x2="${R.x}" y2="${R.y}" stroke="var(--brass-lt)" stroke-width="2"/>`;
        html += `<line x1="${Q.x}" y1="${Q.y}" x2="${Sp.x}" y2="${Sp.y}" stroke="var(--blueprint-lt)" stroke-width="2"/>`;
        [['P',P,-14,-8],['Q',Q,8,-8],['R',R,8,18],['S',Sp,-14,18]].forEach(([lb,p,dx,dy])=>{
            html += `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#e35a8f"/><text x="${p.x+dx}" y="${p.y+dy}" class="svg-label">${lb}</text>`;
        });
        return { type:'svg', html };
    }
}

// =========================================================================
// MODULE 7 — EQUIDISTANT POINTS / HOUSE BUILDER (§8.6)
// =========================================================================
class EquidistantModule {
    constructor(){ this.subMode='explore'; this.bcDist=5; this.r=5;
        this.houseSide=5; this.houseStep=0; this.playing=false; this.timer=null; }
    setSubMode(m){ this.subMode=m; app.render(); }
    setP(k,v){ this[k]=parseFloat(v); app.render(); }
    houseNext(){ this.houseStep = Math.min(this.houseStep+1,4); app.render(); }
    housePrev(){ this.houseStep = Math.max(this.houseStep-1,0); app.render(); }
    houseReset(){ this.houseStep=0; if(this.timer) clearInterval(this.timer); this.playing=false; app.render(); }
    housePlay(){
        if (this.playing){ clearInterval(this.timer); this.playing=false; app.render(); return; }
        if (this.houseStep>=4) return;
        this.playing=true;
        this.timer = setInterval(()=>{
            this.houseStep++;
            app.render();
            if (this.houseStep>=4){ clearInterval(this.timer); this.playing=false; app.render(); }
        }, 700);
        app.render();
    }
    updatePoint(){}
    tabsHTML(){
        return `<div class="pill-row">
            <div class="pill-btn ${this.subMode==='explore'?'active':''}" onclick="app.activeModule.setSubMode('explore')">Explore</div>
            <div class="pill-btn ${this.subMode==='house'?'active':''}" onclick="app.activeModule.setSubMode('house')">Build the House</div>
        </div>`;
    }
    getSidebarHTML(){
        if (this.subMode==='explore') return this.exploreSidebar();
        return this.houseSidebar();
    }
    exploreSidebar(){
        const minR = this.bcDist/2;
        const valid = this.r >= minR;
        let angText = '—';
        if (valid){
            const half = Math.asin(Math.min(1,(this.bcDist/2)/this.r));
            angText = U.r1(half*2*180/Math.PI) + '°';
        }
        return `
            <h2>Equidistant Points</h2>
            ${this.tabsHTML()}
            <p><b>§8.6</b> · Two fixed points B and C. A point that is the <i>same</i> distance from both is found where two equal-radius compass arcs — one centred at B, one at C — cross.</p>
            <div class="data-panel">
                <div class="range-row"><label>Distance BC — ${this.bcDist} cm</label>
                <input type="range" min="3" max="8" step="0.5" value="${this.bcDist}" oninput="app.activeModule.setP('bcDist', this.value)"></div>
                <div class="range-row" style="margin-bottom:0;"><label>Compass radius (same from B and C) — ${this.r} cm</label>
                <input type="range" min="${minR.toFixed(1)}" max="8" step="0.1" value="${Math.max(this.r,minR)}" oninput="app.activeModule.setP('r', this.value)"></div>
            </div>
            <div class="badge ${valid?'success':'danger'}">${valid ? `Apex angle at A = ${angText}` : 'Radius too small — arcs never meet'}</div>
            <div class="proof-box">As the radius grows, the point where the arcs cross moves farther from BC and the angle at the apex narrows. When the radius equals BC itself, the triangle formed is exactly equilateral.</div>
        `;
    }
    houseSidebar(){
        const labels = ['Base square + door drawn','Arc from B, radius = side','Arc from C, radius = side → roof apex A found','House complete!'];
        return `
            <h2>Equidistant Points</h2>
            ${this.tabsHTML()}
            <p><b>Construct — House (§8.6).</b> Every line of the house is the same length. The roof apex A is equidistant from B and C — found with two compass arcs, just like the "Person" and "Eyes" earlier.</p>
            <div class="data-panel">
                <div class="range-row" style="margin-bottom:0;"><label>Side length — ${this.houseSide} cm</label>
                <input type="range" min="3" max="8" step="0.5" value="${this.houseSide}" oninput="app.activeModule.setP('houseSide', this.value)"></div>
            </div>
            <div class="badge ${this.houseStep>=4?'success':'info'}">Step ${this.houseStep} of 4: ${labels[this.houseStep]}</div>
            <div class="btn-grid three">
                <button class="action-btn" onclick="app.activeModule.housePrev()" ${this.houseStep===0?'disabled':''}>« Back</button>
                <button class="action-btn ${this.playing?'':'primary'}" onclick="app.activeModule.housePlay()" ${this.houseStep>=4?'disabled':''}>${this.playing?'⏸ Pause':'▶ Auto'}</button>
                <button class="action-btn" onclick="app.activeModule.houseNext()" ${this.houseStep>=4?'disabled':''}>Next »</button>
            </div>
            <button class="action-btn wide" onclick="app.activeModule.houseReset()">↻ Restart</button>
            <div class="proof-box">Because AB = AC = BC = ${this.houseSide} cm, the roof is actually a perfect equilateral triangle sitting on the square base.</div>
        `;
    }
    renderStage(){
        if (this.subMode==='explore') return this.renderExplore();
        return this.renderHouse();
    }
    renderExplore(){
        const d = cm(this.bcDist);
        const B={x:400-d/2,y:340}, C={x:400+d/2,y:340};
        const r = cm(this.r);
        let html = '';
        html += `<circle cx="${B.x}" cy="${B.y}" r="${r}" fill="none" stroke="rgba(227,172,106,0.5)" stroke-width="1.5" stroke-dasharray="3,3"/>`;
        html += `<circle cx="${C.x}" cy="${C.y}" r="${r}" fill="none" stroke="rgba(47,117,172,0.6)" stroke-width="1.5" stroke-dasharray="3,3"/>`;
        const pts = U.circleIntersect(B,r,C,r);
        html += `<line x1="${B.x-30}" y1="${B.y}" x2="${C.x+30}" y2="${B.y}" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>`;
        html += `<circle cx="${B.x}" cy="${B.y}" r="4" fill="#e35a8f"/><text x="${B.x-10}" y="${B.y+22}" class="svg-label">B</text>`;
        html += `<circle cx="${C.x}" cy="${C.y}" r="4" fill="#e35a8f"/><text x="${C.x-4}" y="${C.y+22}" class="svg-label">C</text>`;
        if (pts){
            const A = pts[0].y < pts[1].y ? pts[0] : pts[1];
            html += `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#fff" stroke-width="2"/>`;
            html += `<line x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}" stroke="#fff" stroke-width="2"/>`;
            html += `<circle cx="${A.x}" cy="${A.y}" r="5" fill="var(--brass-lt)"/><text x="${A.x-6}" y="${A.y-14}" class="svg-label">A</text>`;
            html += compassIcon(B.x,B.y,-40,0.8);
        }
        return { type:'svg', html };
    }
    renderHouse(){
        const s = cm(this.houseSide);
        const D={x:300,y:480}, E={x:300+s,y:480};
        const B={x:300,y:480-s}, C={x:300+s,y:480-s};
        const step = this.houseStep;
        let html = `<line x1="${D.x}" y1="${D.y}" x2="${E.x}" y2="${E.y}" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${D.x}" y1="${D.y}" x2="${B.x}" y2="${B.y}" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${E.x}" y1="${E.y}" x2="${C.x}" y2="${C.y}" stroke="#fff" stroke-width="2.5"/>`;
        html += `<line x1="${B.x}" y1="${B.y}" x2="${C.x}" y2="${C.y}" stroke="#fff" stroke-width="2.5" stroke-dasharray="2,4" opacity="0.4"/>`;
        const doorW = s*0.3, doorH = s*0.45;
        html += `<rect x="${D.x+s/2-doorW/2}" y="${D.y-doorH}" width="${doorW}" height="${doorH}" fill="none" stroke="#fff" stroke-width="2"/>`;
        [['B',B,-16,-8],['C',C,8,-8],['D',D,-16,20],['E',E,8,20]].forEach(([lb,p,dx,dy])=>{
            html += `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#e35a8f"/><text x="${p.x+dx}" y="${p.y+dy}" class="svg-label">${lb}</text>`;
        });
        if (step>=1) html += `<circle cx="${B.x}" cy="${B.y}" r="${s}" fill="none" stroke="rgba(227,172,106,0.55)" stroke-width="1.5" stroke-dasharray="3,3"/>` + compassIcon(B.x,B.y,-35,0.85);
        if (step>=2) html += `<circle cx="${C.x}" cy="${C.y}" r="${s}" fill="none" stroke="rgba(47,117,172,0.7)" stroke-width="1.5" stroke-dasharray="3,3"/>` + compassIcon(C.x,C.y,35,0.85);
        if (step>=2){
            const pts = U.circleIntersect(B,s,C,s);
            if (pts){
                const A = pts[0].y < pts[1].y ? pts[0] : pts[1];
                html += `<circle cx="${A.x}" cy="${A.y}" r="4.5" fill="var(--brass-lt)"/><text x="${A.x-6}" y="${A.y-14}" class="svg-label">A</text>`;
                if (step>=3){
                    html += `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="var(--brass-lt)" stroke-width="2.5"/>`;
                    html += `<line x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}" stroke="var(--brass-lt)" stroke-width="2.5"/>`;
                }
            }
        }
        html += `<text x="${(D.x+E.x)/2}" y="560" text-anchor="middle" class="svg-label">${step>=3?'The house is ready!':'building step ' + step + ' of 4'}</text>`;
        return { type:'svg', html };
    }
}

// =========================================================================
// MODULE 8 — QUIZ ARENA
// =========================================================================
class QuizModule {
    constructor(){
        this.started=false; this.questions=[]; this.index=0; this.score=0;
        this.answered=false; this.lastCorrect=null; this.userVal=''; this.total=8;
        this.tfBank = [
            { stmt:'All points on a circle are the same distance from its centre.', a:true },
            { stmt:'The distance from the centre to any point on a circle is called its diameter.', a:false },
            { stmt:'Every angle of a rectangle measures 90°.', a:true },
            { stmt:'Rotating a square changes the length of its sides.', a:false },
            { stmt:'The two diagonals of a rectangle are always equal in length.', a:true },
            { stmt:'A diagonal always divides a rectangle into two identical (congruent) triangles.', a:true },
            { stmt:'A rectangle can be named by listing its four corner letters in any random order.', a:false },
            { stmt:'Two circles of equal radius, centred less than twice the radius apart, cross at two points.', a:true },
            { stmt:'A 4-sided figure with all angles 90° can have unequal opposite sides.', a:false },
            { stmt:'A diagonal of a square splits every corner angle into two equal 45° halves.', a:true }
        ];
    }
    setTotal(n){ this.total=n; app.render(); }
    start(){ this.questions=this.generate(this.total); this.index=0; this.score=0; this.answered=false; this.lastCorrect=null; this.userVal=''; this.started=true; app.render(); }
    restart(){ this.started=false; app.render(); }
    generate(n){
        const arr=[];
        for(let i=0;i<n;i++){
            const roll=Math.random();
            if (roll<0.35){
                const ab = U.randInt(3,10);
                arr.push({ type:'numeric', prompt:`In rectangle ABCD, if AB = ${ab} cm, what must CD be (in cm)?`, answer: ab });
            } else if (roll<0.55){
                const r = U.randInt(2,9);
                arr.push({ type:'numeric', prompt:`A compass is opened to mark points ${r} cm from centre P. What is the radius, in cm?`, answer:r });
            } else if (roll<0.7){
                const s = U.randInt(3,9);
                arr.push({ type:'numeric', prompt:`A square has all sides ${s} cm. What is the length of one side after rotating it 40°, in cm?`, answer:s });
            } else {
                const bank = this.tfBank[U.randInt(0,this.tfBank.length-1)];
                arr.push({ type:'tf', prompt: bank.stmt, answer: bank.a });
            }
        }
        return arr;
    }
    setUserVal(v){ this.userVal=v; }
    submitNumeric(){ if(this.answered) return; const q=this.questions[this.index]; const val=parseFloat(this.userVal);
        this.answered=true; this.lastCorrect=(val===q.answer); if(this.lastCorrect) this.score++; app.render(); }
    submitTF(b){ if(this.answered) return; const q=this.questions[this.index];
        this.answered=true; this.lastCorrect=(b===q.answer); if(this.lastCorrect) this.score++; app.render(); }
    next(){ this.index++; this.answered=false; this.lastCorrect=null; this.userVal=''; app.render(); }
    updatePoint(){}
    getSidebarHTML(){
        if (!this.started){
            return `
                <h2>Quiz Arena</h2>
                <p>Test what you know about circles, radii, squares, rectangles and constructions from this chapter.</p>
                <div class="data-panel">
                    <div style="font-weight:700;margin-bottom:8px;">Number of questions</div>
                    <div class="pill-row">
                        <div class="pill-btn ${this.total===5?'active':''}" onclick="app.activeModule.setTotal(5)">5</div>
                        <div class="pill-btn ${this.total===8?'active':''}" onclick="app.activeModule.setTotal(8)">8</div>
                        <div class="pill-btn ${this.total===12?'active':''}" onclick="app.activeModule.setTotal(12)">12</div>
                    </div>
                </div>
                <button class="action-btn primary wide" onclick="app.activeModule.start()">▶ Start Quiz</button>
            `;
        }
        if (this.index >= this.questions.length){
            return `
                <h2>Quiz Arena</h2>
                <div class="badge success">Final score: ${this.score} / ${this.questions.length}</div>
                <button class="action-btn primary wide" onclick="app.activeModule.restart()">↻ New Quiz</button>
            `;
        }
        return `
            <h2>Quiz Arena</h2>
            <div class="badge info">Question ${this.index+1} / ${this.questions.length} · Score ${this.score}</div>
            <button class="action-btn wide" onclick="app.activeModule.restart()">← Back to setup</button>
        `;
    }
    renderStage(){
        if (!this.started) return { type:'html', html:`<div class="quiz-wrap"><h3>Ready when you are</h3><p style="color:var(--text-mid);">Pick a question count on the left, then hit Start Quiz.</p></div>` };
        if (this.index>=this.questions.length){
            const pct = Math.round(100*this.score/this.questions.length);
            return { type:'html', html:`<div class="quiz-wrap"><h3>Quiz complete!</h3>
                <div style="font-size:3rem;font-family:'IBM Plex Mono',monospace;color:var(--brass-lt);margin:20px 0;">${this.score}/${this.questions.length}</div>
                <p style="color:var(--text-mid);">${pct>=80?'Excellent work! 🌟':pct>=50?'Good effort — keep practising!':'Review the chapter and try again!'}</p></div>` };
        }
        const q = this.questions[this.index];
        let body = `<div class="quiz-wrap"><div class="quiz-progress">QUESTION ${this.index+1} OF ${this.questions.length}</div><div class="quiz-prompt">${q.prompt}</div>`;
        if (!this.answered){
            if (q.type==='numeric'){
                body += `<div class="quiz-input-row">
                    <input type="number" value="${this.userVal}" oninput="app.activeModule.setUserVal(this.value)" onkeypress="if(event.key==='Enter'){app.activeModule.submitNumeric();}">
                    <button class="quiz-btn" onclick="app.activeModule.submitNumeric()">Submit</button>
                </div>`;
            } else {
                body += `<div class="quiz-tf-row">
                    <button class="true-btn" onclick="app.activeModule.submitTF(true)">TRUE</button>
                    <button class="false-btn" onclick="app.activeModule.submitTF(false)">FALSE</button>
                </div>`;
            }
        } else {
            body += `<div class="quiz-feedback ${this.lastCorrect?'correct':'wrong'}">${this.lastCorrect?'✓ Correct!':`✕ Not quite — the answer is ${q.type==='numeric'?q.answer:(q.answer?'TRUE':'FALSE')}`}</div>
            <button class="quiz-btn" onclick="app.activeModule.next()">${this.index+1<this.questions.length?'Next question →':'See results →'}</button>`;
        }
        body += `</div>`;
        return { type:'html', html: body };
    }
}

// =========================================================================
// MAIN APP CONTROLLER
// =========================================================================
const app = {
    modules: {
        'compass-basics': new CompassBasicsModule(),
        'artwork': new ArtworkStudioModule(),
        'square-rect-lab': new SquareRectLabModule(),
        'construct-builder': new ConstructBuilderModule(),
        'rect-exploration': new RectExplorationModule(),
        'diagonals-lab': new DiagonalsLabModule(),
        'equidistant': new EquidistantModule(),
        'quiz': new QuizModule(),
    },
    tabDefs: [
        { id:'compass-basics', name:'1 · Compass &amp; Circles' },
        { id:'artwork', name:'2 · Artwork Studio' },
        { id:'square-rect-lab', name:'3 · Squares &amp; Rectangles' },
        { id:'construct-builder', name:'4 · Construct Builder' },
        { id:'rect-exploration', name:'5 · Rectangle Explorer' },
        { id:'diagonals-lab', name:'6 · Diagonals Lab' },
        { id:'equidistant', name:'7 · Equidistant Points' },
        { id:'quiz', name:'8 · Quiz Arena' },
    ],
    activeTab: 'compass-basics',
    activeModule: null,

    init(){
        this.activeModule = this.modules[this.activeTab];
        this.renderTabs();
        this.render();
    },
    renderTabs(){
        document.getElementById('tabsBar').innerHTML = this.tabDefs.map(t =>
            `<button class="tab-btn ${t.id===this.activeTab?'active':''}" onclick="app.switchTab('${t.id}')">${t.name}</button>`
        ).join('');
    },
    switchTab(id){
        if (!this.modules[id]) return;
        this.activeTab = id;
        this.activeModule = this.modules[id];
        this.renderTabs();
        this.render();
    },
    render(){
        document.getElementById('sidebarContent').innerHTML = this.activeModule.getSidebarHTML();
        const stageObj = this.activeModule.renderStage();
        const container = document.getElementById('stageContainer');
        if (stageObj.type === 'svg') {
            container.innerHTML = `<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">${stageObj.html}</svg>`;
        } else {
            container.innerHTML = `<div class="html-stage">${stageObj.html}</div>`;
        }
    }
};

function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('collapsed'); }

window.onload = () => app.init();
</script>
