<header>
    <div class="brand-area">
        <a href="../../../index.html" class="back-btn">← E-Lab</a>
        <div class="module-title">
            <h1>The Baudhāyana-Pythagoras Theorem</h1>
            <p>CLASS 8 · PART II · CHAPTER 02 · GANITA PRAKASH · INTERACTIVE ENGINE</p>
        </div>
    </div>
</header>

<div class="tabs-bar" id="tabsBar"></div>

<div class="workspace">
    <aside class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()" title="Show/hide panel">☰</button>
        <div class="sidebar-content" id="sidebarContent"></div>
    </aside>
    <main class="stage">
        <div class="canvas-container">
            <div id="stageContainer"></div>
        </div>
    </main>
</div>

<script>
// =========================================================================
// 1. MATH & GEOMETRY UTILITIES
// =========================================================================
const MathUtils = {
    randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; },
    gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; },
    lcm(a, b) { return Math.abs(a * b) / this.gcd(a, b); },
    round(n, p) { const m = Math.pow(10, p || 0); return Math.round(n * m) / m; },
    isPerfectSquare(n) { const r = Math.round(Math.sqrt(n)); return r * r === n; },
    isPrimitiveTriple(a, b, c) { return this.gcd(this.gcd(a, b), c) === 1; },
    pythagTriplesUpTo(limit) {
        const out = [];
        for (let a = 1; a <= limit; a++) {
            for (let b = a; b <= limit; b++) {
                const c2 = a * a + b * b;
                const c = Math.round(Math.sqrt(c2));
                if (c * c === c2 && c <= limit) out.push([a, b, c]);
            }
        }
        return out;
    },
    // Narrow decimal bounds of sqrt(n) the "textbook way": grow a trial value digit by digit.
    sqrtNarrowSteps(n, places) {
        let lo = 0; while ((lo + 1) * (lo + 1) <= n) lo++;
        const steps = [{ lo, hi: lo + 1, place: 0 }];
        let base = lo;
        for (let p = 1; p <= places; p++) {
            const step = Math.pow(10, -p);
            let x = base;
            while (true) {
                const nxt = Math.round((x + step) * Math.pow(10, p)) / Math.pow(10, p);
                if (nxt * nxt <= n) { x = nxt; } else break;
            }
            base = x;
            const hi = Math.round((x + step) * Math.pow(10, p)) / Math.pow(10, p);
            steps.push({ lo: x, hi, place: p });
        }
        return steps;
    },
    // Map an array of {points:[[x,y],...], fill, stroke, label,...} math-space shapes into an SVG <g> string.
    shapesToSVG(shapes, W, H, pad) {
        W = W || 600; H = H || 480; pad = pad === undefined ? 44 : pad;
        let allPts = [];
        shapes.forEach(s => s.points.forEach(p => allPts.push(p)));
        if (!allPts.length) return '';
        const xs = allPts.map(p => p[0]), ys = allPts.map(p => p[1]);
        const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
        const w = (maxX - minX) || 1, h = (maxY - minY) || 1;
        const scale = Math.min((W - 2 * pad) / w, (H - 2 * pad) / h);
        const map = (p) => {
            const x = pad + (p[0] - minX) * scale;
            const y = H - (pad + (p[1] - minY) * scale);
            return [x, y];
        };
        let svg = '';
        shapes.forEach(s => {
            const pts = s.points.map(map);
            const ptStr = pts.map(p => p.join(',')).join(' ');
            if (s.kind === 'line') {
                svg += `<line x1="${pts[0][0]}" y1="${pts[0][1]}" x2="${pts[1][0]}" y2="${pts[1][1]}" stroke="${s.stroke || '#fff'}" stroke-width="${s.strokeWidth || 2}" stroke-dasharray="${s.dash || ''}"/>`;
            } else {
                svg += `<polygon points="${ptStr}" fill="${s.fill || 'none'}" stroke="${s.stroke || '#fff'}" stroke-width="${s.strokeWidth || 2}" opacity="${s.opacity !== undefined ? s.opacity : 0.85}"/>`;
            }
            if (s.label) {
                const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
                const cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
                svg += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" class="svg-label" font-size="${s.labelSize || 16}" fill="${s.labelColor || '#fff'}">${s.label}</text>`;
            }
        });
        return svg;
    },
    // Classic Pythagorean "squares on each side" diagram for legs a,b.
    pythagDiagram(a, b) {
        const c = Math.sqrt(a * a + b * b);
        const A = [0, 0], B = [a, 0], C = [0, b];
        const out = [-b / c, -a / c];
        const C2 = [C[0] + out[0] * c, C[1] + out[1] * c];
        const B2 = [B[0] + out[0] * c, B[1] + out[1] * c];
        return {
            c,
            triangle: { points: [A, B, C], fill: 'rgba(255,255,255,0.12)', stroke: '#fff', strokeWidth: 2 },
            legASq: { points: [A, B, [a, -a], [0, -a]], fill: 'rgba(47,117,172,0.55)', stroke: '#2f75ac', label: `a² = ${MathUtils.round(a*a,2)}` },
            legBSq: { points: [A, C, [-b, b], [-b, 0]], fill: 'rgba(139,111,201,0.55)', stroke: '#8b6fc9', label: `b² = ${MathUtils.round(b*b,2)}` },
            hypSq: { points: [B, C, C2, B2], fill: 'rgba(201,138,62,0.55)', stroke: '#c98a3e', label: `c² = ${MathUtils.round(c*c,2)}` }
        };
    }
};

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
function legendRow(color, text) { return `<div class="legend-row"><span class="legend-swatch" style="background:${color};"></span>${text}</div>`; }

// =========================================================================
// 2. MODULE 1 — DOUBLING A SQUARE (§2.1)
// =========================================================================
class DoublingModule {
    constructor() { this.s = 4; }
    setS(v) { this.s = Math.max(2, Math.min(10, parseInt(v) || 2)); app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        const s = this.s, area = s * s, area2 = 2 * s * s, diag = MathUtils.round(s * Math.SQRT2, 3);
        return `
            <h2>Doubling a Square</h2>
            <p><b>§2.1</b> · Baudhāyana's Śulba-Sūtra (c. 800 BCE) asks: how do you build a square with <b>double</b> the area of a given square? Simply doubling the side gives 4× the area — too much! The real trick: build the new square on the <b>diagonal</b>.</p>
            <div class="data-panel">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Original square side — ${s} units</label>
                <input type="range" min="2" max="10" value="${s}" oninput="app.activeModule.setS(this.value)">
            </div>
            <div class="data-panel">
                <div class="data-row"><span>Original area</span><span>${s} × ${s} = ${area}</span></div>
                <div class="data-row"><span>Diagonal length</span><span>${s}√2 ≈ ${diag}</span></div>
                <div class="data-row"><span>New square's side</span><span>= diagonal = ${s}√2</span></div>
                <div class="data-row"><span>New square's area</span><span>(${s}√2)² = ${area2}</span></div>
            </div>
            <div class="badge success">${area2} = 2 × ${area} ✓ exactly double!</div>
            <div class="proof-box">The original square (solid) is made of <b>2</b> small congruent triangles. The doubled square (dashed, built on the diagonal) is made of <b>4</b> of those same triangles — so its area must be exactly double.</div>
        `;
    }
    renderStage() {
        const s = this.s;
        const L = s * Math.SQRT2;
        const outer = { points: [[-L/2,-L/2],[L/2,-L/2],[L/2,L/2],[-L/2,L/2]], fill: 'rgba(201,138,62,0.18)', stroke: '#c98a3e', strokeWidth: 2.5 };
        const inner = { points: [[0,L/2],[L/2,0],[0,-L/2],[-L/2,0]], fill: 'rgba(47,117,172,0.55)', stroke: '#2f75ac', strokeWidth: 2.5 };
        // diagonal helper lines splitting inner square into 2 triangles, outer into 4
        const diag1 = { kind: 'line', points: [[0,L/2],[0,-L/2]], stroke: 'rgba(255,255,255,0.35)', strokeWidth: 1.5, dash: '4 4' };
        const diag2 = { kind: 'line', points: [[-L/2,0],[L/2,0]], stroke: 'rgba(255,255,255,0.35)', strokeWidth: 1.5, dash: '4 4' };
        const svgInner = MathUtils.shapesToSVG([outer, diag1, diag2, inner], 560, 480, 50);
        let html = `<h3>Original square (side ${s}) vs. doubled square (side ${s}√2 ≈ ${MathUtils.round(s*Math.SQRT2,2)})</h3>
        <div style="display:flex;justify-content:center;">
            <svg viewBox="0 0 560 480" style="width:100%;max-width:560px;height:auto;">${svgInner}</svg>
        </div>
        <div class="diagram-legend">
            ${legendRow('#2f75ac', `Original square — area ${s*s}`)}
            ${legendRow('#c98a3e', `Doubled square (on the diagonal) — area ${2*s*s}`)}
        </div>
        <div class="work-box">
            <span class="eq">Original square = 2 congruent triangles</span>
            <span class="eq">Doubled square = 4 of the same congruent triangles</span>
            <span class="eq">→ Doubled area = 2 × Original area = ${2*s*s}</span>
        </div>`;
        return { type: 'html', html };
    }
}

// =========================================================================
// 3. MODULE 2 — HALVING A SQUARE (§2.2)
// =========================================================================
class HalvingModule {
    constructor() { this.s = 6; }
    setS(v) { this.s = Math.max(2, Math.min(10, parseInt(v) || 2)); app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        const s = this.s, area = s * s, half = area / 2, side = MathUtils.round(s / Math.SQRT2, 3);
        return `
            <h2>Halving a Square</h2>
            <p><b>§2.2</b> · Reverse the previous trick: fold a square paper inward so the crease-lines pass through the midpoints of its sides. The tilted inner square PQRS has exactly <b>half</b> the area of the original!</p>
            <div class="data-panel">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Original square side — ${s} units</label>

class SqrtTwoModule {

    tabsHTML() {

            <div class="pill-btn ${this.sub === 'triangle' ? 'active' : ''}" onclick="app.activeModule.setSub('triangle')">Isosceles Triangle</div>
            <div class="pill-btn ${this.sub === 'irrational' ? 'active' : ''}" onclick="app.activeModule.setSub('irrational')">Why Irrational?</div>
        </div>`;
    }
    getSidebarHTML() {
        const common = `<h2>√2 &amp; Right Isosceles Triangles</h2>${this.tabsHTML()}`;
        if (this.sub === 'bounds') {

            <p><b>§2.3</b> · A unit square's diagonal has length √2. We can pin down its decimal value by squeezing it between ever-tighter bounds.</p>

                <input type="range" min="0" max="5" value="${this.places}" oninput="app.activeModule.setPlaces(this.value)">
            </div>
            <div class="proof-box">1² = 1 and 2² = 4, so 1 &lt; √2 &lt; 2. Keep testing tenths, hundredths, ... to squeeze the bounds tighter and tighter — √2 never lands on a terminating decimal.</div>`;
        }
        if (this.sub === 'triangle') {
            const c2 = 2 * this.leg * this.leg;
            const c = Math.sqrt(c2);
            const lo = Math.floor(c), hi = Math.ceil(c === lo ? c + 1 : c);
            return common + `
            <p>An isosceles right triangle with equal sides <i>a</i> has hypotenuse <i>c</i> where <b>c² = 2a²</b> (it's literally the diagonal-of-a-square relation).</p>

        }
        return common + `
        <p>Euclid (c. 300 BCE) proved √2 can never be written as a fraction m/n of counting numbers — a landmark result in the history of mathematics.</p>
        <div class="proof-box">
        <b>The proof (by contradiction):</b><br>
        Suppose √2 = m/n. Then 2 = m²/n², so <b>2n² = m²</b>.<br><br>
        In the prime factorisation of any square number, every prime appears an <b>even</b> number of times.<br><br>
        But in 2n² = m², the prime 2 appears an <b>odd</b> number of times on the left (one extra factor of 2) and an <b>even</b> number of times on the right. Contradiction!<br><br>
        So no such fraction m/n can exist — √2 is <b>irrational</b>.
        </div>`;
    }
    renderStage() {

            </div>`;
            return { type: 'html', html };
        }
        if (this.sub === 'triangle') {
            const a = this.leg, c = Math.sqrt(2 * a * a);

            const tri = { points: [A,B,C], fill: 'rgba(47,117,172,0.4)', stroke: '#2f75ac', strokeWidth: 2.5, label: '' };
            const legA = { kind:'line', points:[A,B], stroke:'#7bdcaa', strokeWidth:3 };

            const svg = MathUtils.shapesToSVG([tri, legA, legB, hyp], 520, 420, 60);
            let html = `<h3>Isosceles right triangle: a = ${a}, c = √${2*a*a} ≈ ${MathUtils.round(c,3)}</h3>
            <div style="display:flex;justify-content:center;"><svg viewBox="0 0 520 420" style="width:100%;max-width:480px;height:auto;">${svg}
                <text x="260" y="405" text-anchor="middle" class="svg-label" fill="#7bdcaa">leg a = ${a}</text>
            </svg></div>
            <div class="work-box">
                <span class="eq">c² = 2a² = 2 × ${a}² = ${2*a*a}</span>
                <span class="eq">c = √${2*a*a} ≈ ${MathUtils.round(c,4)}</span>
            </div>`;
            return { type: 'html', html };
        }
        let html = `<h3>Euclid's Proof that √2 is Irrational</h3>
        <div class="work-box" style="max-width:500px;">
            <span class="eq">Assume √2 = m/n  (m, n counting numbers, no common factor)</span>
            <span class="eq">⇒ 2 = m² / n²</span>
            <span class="eq">⇒ 2n² = m²  ... (∗)</span>
            <span class="eq" style="color:var(--brass-lt);">Every prime in a perfect square appears an EVEN number of times.</span>
            <span class="eq">LHS of (∗): prime 2 appears an ODD number of times (2 × n², plus n²'s own factors of 2).</span>
            <span class="eq">RHS of (∗): prime 2 in m² appears an EVEN number of times.</span>
            <span class="eq" style="color:#f0a08c;">Odd ≠ Even → Contradiction!</span>
            <span class="eq" style="color:#7bdcaa;">∴ √2 cannot be written as m/n. It is irrational.</span>
        </div>
        <div style="text-align:center;color:var(--text-mid);font-size:0.85rem;max-width:480px;margin:14px auto 0;">This proof appears in Euclid's <i>Elements</i> (c. 300 BCE) — one of the oldest known proofs by contradiction.</div>`;
        return { type: 'html', html };
    }
}

        this.find = find;

    }
    updatePoint() {}
    getSidebarHTML() {
        return `
            <h2>Right Triangle Solver</h2>

            </div>
            ` : `
            <div class="data-panel">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Hypotenuse c</label>
                <input class="num-input" type="number" min="0.1" step="0.1" value="${this.c}" onchange="app.activeModule.setC(this.value)">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Known leg a</label>
                <input class="num-input" style="margin-bottom:0;" type="number" min="0.1" step="0.1" value="${this.aKnown}" onchange="app.activeModule.setAKnown(this.value)">
            </div>
            <div class="btn-grid" style="margin-bottom:14px;">
                <button class="action-btn" onclick="app.activeModule.preset('leg',15,9)">c=15, a=9</button>
                <button class="action-btn" onclick="app.activeModule.preset('leg',17,8)">c=17, a=8</button>
                <button class="action-btn" onclick="app.activeModule.preset('leg',10,6)">c=10, a=6</button>
            </div>
            `}
            <div class="proof-box">This is exactly Baudhāyana's "general solution" (§2.4): for an isosceles right triangle c²=2a², and for any right triangle, a² + b² = c².</div>
        `;
    }
    renderStage() {
        let a, b, c, missing;
        if (this.find === 'c') {
            a = this.a; b = this.b; c = Math.sqrt(a * a + b * b); missing = 'c';
        } else {
            c = this.c; a = this.aKnown; const b2 = c * c - a * a;
            b = b2 > 0 ? Math.sqrt(b2) : NaN; missing = 'b';
        }
        const valid = !isNaN(b) && b > 0 && a > 0;
        let diagramHtml = '';
        if (valid) {
            const A = [0,0], B = [a,0], C = [0,b];
            const tri = { points: [A,B,C], fill: 'rgba(139,111,201,0.35)', stroke: '#8b6fc9', strokeWidth: 2.5 };
            const legAline = { kind:'line', points:[A,B], stroke: missing==='a' ? '#e3ac6a':'#7bdcaa', strokeWidth:3 };
            const legBline = { kind:'line', points:[A,C], stroke: missing==='b' ? '#e3ac6a':'#7bdcaa', strokeWidth:3 };
            const hypline = { kind:'line', points:[B,C], stroke: missing==='c' ? '#e3ac6a':'#c98a3e', strokeWidth:3 };
            diagramHtml = `<svg viewBox="0 0 520 420" style="width:100%;max-width:480px;height:auto;">${MathUtils.shapesToSVG([tri, legAline, legBline, hypline], 520, 420, 60)}</svg>`;
        }
        let work = '';
        if (this.find === 'c') {
            work = `<span class="eq">c² = a² + b² = ${MathUtils.round(a*a,3)} + ${MathUtils.round(b*b,3)} = ${MathUtils.round(a*a+b*b,3)}</span>
                    <span class="eq" style="color:#7bdcaa;">c = √${MathUtils.round(a*a+b*b,3)} ≈ ${MathUtils.round(c,4)}</span>`;
        } else {
            work = valid ? `<span class="eq">b² = c² − a² = ${MathUtils.round(c*c,3)} − ${MathUtils.round(a*a,3)} = ${MathUtils.round(c*c-a*a,3)}</span>
                    <span class="eq" style="color:#7bdcaa;">b = √${MathUtils.round(c*c-a*a,3)} ≈ ${MathUtils.round(b,4)}</span>`
                    : `<span class="eq" style="color:#f0a08c;">Not a valid right triangle — the hypotenuse must be longer than the leg!</span>`;
        }
        let html = `<h3>Solving for the missing side</h3>
        <div style="display:flex;justify-content:center;margin-bottom:16px;">${diagramHtml}</div>
        <div class="work-box">${work}</div>`;
        return { type: 'html', html };
    }
}

        const base = this.bases[this.baseIdx];
        return common + `
        <p>If (a,b,c) is a Baudhāyana triple, then so is (ka, kb, kc) for any positive integer k — because (ka)²+(kb)² = k²(a²+b²) = k²c² = (kc)².</p>
        <div class="data-panel">
            <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Base primitive triple</label>
            <select class="select-input" onchange="app.activeModule.setBase(this.value)">
                ${this.bases.map((b,i) => `<option value="${i}" ${i===this.baseIdx?'selected':''}>(${b.join(', ')})</option>`).join('')}
            </select>
            <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Scale factor k — ${this.k}</label>
            <input type="range" min="1" max="12" value="${this.k}" oninput="app.activeModule.setK(this.value)">
        </div>
        <div class="badge info">(${base.join(',')}) × ${this.k} = (${base.map(x=>x*this.k).join(', ')})</div>
        `;
    }
    renderStage() {
        if (this.sub === 'generate') {
            const triples = MathUtils.pythagTriplesUpTo(this.limit);
            let html = `<h3>Baudhāyana triples with every value ≤ ${this.limit}</h3>
            <div style="max-width:520px;margin:0 auto;">
            <table class="ref-table"><thead><tr><th>a</th><th>b</th><th>c</th><th>Type</th></tr></thead><tbody>
            ${triples.map(([a,b,c]) => {
                const prim = MathUtils.isPrimitiveTriple(a,b,c);
                return `<tr><td>${a}</td><td>${b}</td><td>${c}</td><td style="color:${prim?'#7bdcaa':'#e3ac6a'};">${prim?'Primitive':'Scaled'}</td></tr>`;
            }).join('')}
            </tbody></table>
            </div>
            <div style="text-align:center;color:var(--text-mid);font-size:0.85rem;margin-top:14px;">${triples.length} triples found.</div>`;
            return { type: 'html', html };
        }
        if (this.sub === 'oddsquare') {
            const m = this.oddM, m2 = m*m, idx = (m2+1)/2, leg1 = idx-1;
            const d = MathUtils.pythagDiagram(leg1, m);
            const svg = MathUtils.shapesToSVG([d.legASq, d.legBSq, d.hypSq, d.triangle], 560, 480, 55);
            let html = `<h3>Odd-square method: m = ${m}</h3>
            <div class="work-box" style="max-width:460px;">
                <span class="eq">${m}² = ${m2} is the ${idx}th odd number</span>
                <span class="eq">(${idx} − 1)² + ${m}² = ${idx}²</span>
                <span class="eq">${leg1}² + ${m}² = ${leg1*leg1} + ${m2} = ${leg1*leg1+m2}</span>
                <span class="eq" style="color:#7bdcaa;">${idx}² = ${idx*idx} ✓ Triple: (${leg1}, ${m}, ${idx})</span>
            </div>
            <div style="display:flex;justify-content:center;"><svg viewBox="0 0 560 480" style="width:100%;max-width:480px;height:auto;">${svg}</svg></div>`;
            return { type: 'html', html };
        }
        const base = this.bases[this.baseIdx];
        const scaled = base.map(x => x * this.k);
        const d = MathUtils.pythagDiagram(scaled[0], scaled[1]);
        const svg = MathUtils.shapesToSVG([d.legASq, d.legBSq, d.hypSq, d.triangle], 560, 480, 55);
        let html = `<h3>(${base.join(',')}) scaled by k=${this.k} → (${scaled.join(', ')})</h3>
        <div class="work-box" style="max-width:460px;">
            <span class="eq">(${this.k}×${base[0]})² + (${this.k}×${base[1]})² = ${scaled[0]}² + ${scaled[1]}² = ${scaled[0]*scaled[0]+scaled[1]*scaled[1]}</span>
            <span class="eq" style="color:#7bdcaa;">(${this.k}×${base[2]})² = ${scaled[2]}² = ${scaled[2]*scaled[2]} ✓</span>
        </div>
        <div style="display:flex;justify-content:center;"><svg viewBox="0 0 560 480" style="width:100%;max-width:480px;height:auto;">${svg}</svg></div>`;
        return { type: 'html', html };
    }
}

class ApplicationsModule {
    constructor() { this.sub = 'lotus'; this.h = 1; this.d = 3; this.side = 5; this.diag1 = 24; this.diag2 = 70; }
    setSub(s) { this.sub = s; app.render(); }
    setH(v) { this.h = Math.max(0.5, Math.min(10, parseFloat(v) || 0.5)); app.render(); }
    setD(v) { this.d = Math.max(0.5, Math.min(15, parseFloat(v) || 0.5)); app.render(); }
    setSide(v) { this.side = Math.max(1, Math.min(30, parseFloat(v) || 1)); app.render(); }
    setDiag1(v) { this.diag1 = Math.max(2, Math.min(100, parseFloat(v) || 2)); app.render(); }
    setDiag2(v) { this.diag2 = Math.max(2, Math.min(100, parseFloat(v) || 2)); app.render(); }
    updatePoint() {}
    tabsHTML() {
        return `<div class="pill-row">
            <div class="pill-btn ${this.sub === 'lotus' ? 'active' : ''}" onclick="app.activeModule.setSub('lotus')">Līlāvatī's Lotus</div>
            <div class="pill-btn ${this.sub === 'diagonal' ? 'active' : ''}" onclick="app.activeModule.setSub('diagonal')">Square Diagonal</div>
            <div class="pill-btn ${this.sub === 'rhombus' ? 'active' : ''}" onclick="app.activeModule.setSub('rhombus')">Rhombus Side</div>
        </div>`;
    }
    getSidebarHTML() {
        const common = `<h2>Real-World Applications</h2>${this.tabsHTML()}`;
        if (this.sub === 'lotus') {
            const h = this.h, d = this.d, x = (d*d - h*h) / (2*h);
            return common + `
            <p><b>§2.7</b> · Bhāskarāchārya's <i>Līlāvatī</i>: a lotus stem sticks ${h} unit(s) above a lake. A breeze sways it, and the tip touches the water ${d} units away. How deep is the lake?</p>
            <div class="data-panel">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Height above water (h) — ${h}</label>
                <input type="range" min="0.5" max="10" step="0.5" value="${h}" oninput="app.activeModule.setH(this.value)">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Horizontal sway (d) — ${d}</label>
                <input type="range" min="0.5" max="15" step="0.5" value="${d}" oninput="app.activeModule.setD(this.value)">
            </div>
            <div class="badge ${x>0?'success':'danger'}">Depth of lake x = ${x>0?MathUtils.round(x,3):'invalid (increase d)'}</div>
            <div class="proof-box">Let x = depth. Stem's total length = x+h (rigid, so it stays the same length). Right triangle: legs d and x, hypotenuse x+h.<br>d² + x² = (x+h)² → x = (d² − h²) / 2h</div>`;
        }
        if (this.sub === 'diagonal') {
            const diag = this.side * Math.SQRT2;
            return common + `
            <p>The diagonal of a square with side s is s√2 — a direct case of Baudhāyana's theorem with a=b=s.</p>
            <div class="data-panel">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Side length — ${this.side}</label>
                <input type="range" min="1" max="30" value="${this.side}" oninput="app.activeModule.setSide(this.value)">
            </div>
            <div class="badge success">Diagonal = ${this.side}√2 ≈ ${MathUtils.round(diag,3)}</div>
            <div class="proof-box">d² = s² + s² = 2s² → d = s√2</div>`;
        }
        const half1 = this.diag1/2, half2 = this.diag2/2, side = Math.sqrt(half1*half1+half2*half2);
        return common + `
        <p>A rhombus's diagonals bisect each other at right angles — so each side is the hypotenuse of a right triangle formed by the half-diagonals!</p>
        <div class="data-panel">
            <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Diagonal 1 — ${this.diag1}</label>
            <input type="range" min="2" max="100" step="2" value="${this.diag1}" oninput="app.activeModule.setDiag1(this.value)">
            <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Diagonal 2 — ${this.diag2}</label>
            <input type="range" min="2" max="100" step="2" value="${this.diag2}" oninput="app.activeModule.setDiag2(this.value)">
        </div>
        <div class="badge success">Side length = ${MathUtils.round(side,3)}</div>
        <div class="proof-box">side² = (d₁/2)² + (d₂/2)² = ${MathUtils.round(half1,1)}² + ${MathUtils.round(half2,1)}²</div>`;
    }
    renderStage() {
        if (this.sub === 'lotus') {
            const h = this.h, d = this.d, x = (d*d - h*h) / (2*h);
            if (x <= 0) return { type: 'html', html: `<div class="quiz-wrap"><h3>Invalid setup</h3><p style="color:var(--text-mid);">Increase the sway distance d so the lotus stem can reach the water.</p></div>` };
            const R = [0,-x], W = [0,0], T = [d,0], O = [0,h];
            const pond = { points: [[-d*0.6,-x*1.3],[d*1.3,-x*1.3],[d*1.3,0],[-d*0.6,0]], fill: 'rgba(47,117,172,0.28)', stroke: 'rgba(47,117,172,0.6)', strokeWidth: 1 };
            const stemUnder = { kind:'line', points:[R,W], stroke:'#7bdcaa', strokeWidth: 3 };
            const stemAbove = { kind:'line', points:[W,O], stroke:'#e3ac6a', strokeWidth: 3, dash:'5 4' };
            const bentStem = { kind:'line', points:[R,T], stroke:'#c98a3e', strokeWidth: 3 };
            const legD = { kind:'line', points:[W,T], stroke:'rgba(255,255,255,0.4)', strokeWidth: 1.5, dash:'3 3' };
            const svg = MathUtils.shapesToSVG([pond, stemUnder, stemAbove, bentStem, legD], 560, 460, 55);
            let html = `<h3>Līlāvatī's Lotus — depth = ${MathUtils.round(x,3)}</h3>
            <div style="display:flex;justify-content:center;"><svg viewBox="0 0 560 460" style="width:100%;max-width:520px;height:auto;">${svg}</svg></div>
            <div class="diagram-legend">
                ${legendRow('#7bdcaa', `Underwater stem — depth x = ${MathUtils.round(x,3)}`)}
                ${legendRow('#e3ac6a', `Stem above water — h = ${h}`)}
                ${legendRow('#c98a3e', `Stem after breeze (hypotenuse) — x+h = ${MathUtils.round(x+h,3)}`)}
            </div>
            <div class="work-box">
                <span class="eq">d² + x² = (x+h)²</span>
                <span class="eq">${d}² + x² = x² + 2x·${h} + ${h}²</span>
                <span class="eq">${d*d} = ${2*h}x + ${h*h}</span>
                <span class="eq" style="color:#7bdcaa;">x = (${d*d} − ${h*h}) / ${2*h} = ${MathUtils.round(x,3)}</span>
            </div>`;
            return { type: 'html', html };
        }
        if (this.sub === 'diagonal') {
            const s = this.side, diag = s * Math.SQRT2;
            const sq = { points: [[0,0],[s,0],[s,s],[0,s]], fill: 'rgba(47,117,172,0.3)', stroke:'#2f75ac', strokeWidth:2.5 };
            const dline = { kind:'line', points:[[0,0],[s,s]], stroke:'#c98a3e', strokeWidth:3 };
            const svg = MathUtils.shapesToSVG([sq, dline], 480, 480, 60);
            let html = `<h3>Diagonal of a ${s}×${s} square = ${MathUtils.round(diag,3)}</h3>
            <div style="display:flex;justify-content:center;"><svg viewBox="0 0 480 480" style="width:100%;max-width:420px;height:auto;">${svg}</svg></div>
            <div class="work-box"><span class="eq">d² = ${s}² + ${s}² = ${2*s*s}</span><span class="eq" style="color:#7bdcaa;">d = √${2*s*s} ≈ ${MathUtils.round(diag,4)}</span></div>`;
            return { type: 'html', html };
        }
        const d1 = this.diag1, d2 = this.diag2, h1 = d1/2, h2 = d2/2, side = Math.sqrt(h1*h1+h2*h2);
        const rhombus = { points: [[0,h2],[h1,0],[0,-h2],[-h1,0]], fill: 'rgba(139,111,201,0.35)', stroke:'#8b6fc9', strokeWidth:2.5 };
        const dl1 = { kind:'line', points:[[0,h2],[0,-h2]], stroke:'rgba(255,255,255,0.4)', strokeWidth:1.5, dash:'4 4' };
        const dl2 = { kind:'line', points:[[-h1,0],[h1,0]], stroke:'rgba(255,255,255,0.4)', strokeWidth:1.5, dash:'4 4' };
        const svg = MathUtils.shapesToSVG([rhombus, dl1, dl2], 520, 480, 55);
        let html = `<h3>Rhombus with diagonals ${d1}, ${d2} → side ${MathUtils.round(side,3)}</h3>
        <div style="display:flex;justify-content:center;"><svg viewBox="0 0 520 480" style="width:100%;max-width:460px;height:auto;">${svg}</svg></div>
        <div class="work-box"><span class="eq">side² = ${MathUtils.round(h1,1)}² + ${MathUtils.round(h2,1)}² = ${MathUtils.round(h1*h1+h2*h2,2)}</span><span class="eq" style="color:#7bdcaa;">side ≈ ${MathUtils.round(side,4)}</span></div>`;
        return { type: 'html', html };
    }
}

// 9. MODULE 8 — FERMAT'S LAST THEOREM (§2.6)
// =========================================================================
class FermatModule {
    constructor() { this.n = 3; this.x = 3; this.y = 4; }
    setN(v) { this.n = parseInt(v); app.render(); }
    setX(v) { this.x = Math.max(1, Math.min(15, parseInt(v) || 1)); app.render(); }
    setY(v) { this.y = Math.max(1, Math.min(15, parseInt(v) || 1)); app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        return `
            <h2>Fermat's Last Theorem</h2>
            <p><b>§2.6</b> · Baudhāyana triples satisfy x² + y² = z². Fermat (17th century) asked: does xⁿ + yⁿ = zⁿ have any solution for n &gt; 2?</p>
            <div class="data-panel">
                <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Power n</label>
                <div class="pill-row" style="margin-bottom:0;">
                    ${[2,3,4,5].map(p => `<div class="pill-btn ${this.n===p?'active':''}" onclick="app.activeModule.setN(${p})">n=${p}</div>`).join('')}
                </div>
            </div>
            <div class="data-panel">
                <div class="range-row"><label>x — ${this.x}</label><input type="range" min="1" max="15" value="${this.x}" oninput="app.activeModule.setX(this.value)"></div>
                <div class="range-row" style="margin-bottom:0;"><label>y — ${this.y}</label><input type="range" min="1" max="15" value="${this.y}" oninput="app.activeModule.setY(this.value)"></div>
            </div>
            <div class="timeline-step"><b>1637</b> — Fermat scribbles the conjecture in a book margin, claiming a proof "too large to fit".</div>
            <div class="timeline-step"><b>1963</b> — 10-year-old Andrew Wiles reads about the unsolved problem and resolves to crack it.</div>
            <div class="timeline-step"><b>1994</b> — Wiles finally publishes a complete proof, ending 357 years of mystery!</div>
        `;
    }
    renderStage() {
        const { n, x, y } = this;
        const sum = Math.pow(x, n) + Math.pow(y, n);
        const z = Math.pow(sum, 1 / n);
        const zRound = Math.round(z);
        const isSolution = Math.abs(Math.pow(zRound, n) - sum) < 1e-6;
        let html = `<h3>Testing x<sup>${n}</sup> + y<sup>${n}</sup> = z<sup>${n}</sup></h3>
        <div class="work-box" style="max-width:480px;">
            <span class="eq">${x}<sup>${n}</sup> + ${y}<sup>${n}</sup> = ${Math.pow(x,n)} + ${Math.pow(y,n)} = ${sum}</span>
            <span class="eq">z = ${sum}<sup>1/${n}</sup> ≈ ${MathUtils.round(z,5)}</span>
        </div>
        <div style="max-width:460px;margin:0 auto;text-align:center;">
            <div class="badge ${isSolution ? 'success' : (n===2?'info':'danger')}">
                ${isSolution ? `✓ z = ${zRound} is a whole number! (n=2 lets this happen — Baudhāyana triples)` : `z is NOT a whole number here — no integer solution found${n>2?' (exactly as Fermat predicted for n>2!)':''}`}
            </div>
        </div>
        <div style="max-width:480px;margin:16px auto 0;color:var(--text-mid);font-size:0.85rem;text-align:center;">
            Try every x,y you like for n=3,4,5 — you will <b>never</b> find whole-number solutions. Fermat's Last Theorem (proved by Andrew Wiles in 1994) guarantees it.
        </div>`;
        return { type: 'html', html };
    }
}

class QuizModule {
    constructor() {
        this.total = 10;
        this.started = false;
        this.questions = [];
        this.index = 0;
        this.score = 0;
        this.answered = false;
        this.lastCorrect = null;
        this.userVal = '';
        this.tfBank = [
            { stmt: "The Baudhāyana-Pythagoras theorem states a² + b² = c² for right triangles.", a: true },
            { stmt: "√2 can be written as a terminating decimal.", a: false },
            { stmt: "(6, 8, 10) is a primitive Baudhāyana triple.", a: false },
            { stmt: "(3, 4, 5) is a primitive Baudhāyana triple.", a: true },
            { stmt: "If (a,b,c) is a triple, then (2a,2b,2c) is also a triple.", a: true },
            { stmt: "The hypotenuse is always the longest side of a right triangle.", a: true },
            { stmt: "Fermat's Last Theorem was proved by Pythagoras.", a: false },
            { stmt: "Andrew Wiles proved Fermat's Last Theorem in 1994.", a: true },
            { stmt: "Doubling a square's side length doubles its area.", a: false },
            { stmt: "The diagonal of a square with side s has length s√2.", a: true }
        ];
    }
    setTotal(n) { this.total = n; app.render(); }
    start() { this.questions = this.generateQuestions(this.total); this.index = 0; this.score = 0; this.answered = false; this.lastCorrect = null; this.userVal = ''; this.started = true; app.render(); }
    restart() { this.started = false; app.render(); }
    generateQuestions(count) {
        const arr = [];
        for (let i = 0; i < count; i++) {
            const roll = Math.random();
            if (roll < 0.22) {
                const a = MathUtils.randInt(3, 12), b = MathUtils.randInt(3, 12);
                arr.push({ type: 'numeric', prompt: `A right triangle has legs ${a} and ${b}. What is c² (the square of the hypotenuse)?`, answer: a*a+b*b });
            } else if (roll < 0.4) {
                const options = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25]];
                const t = options[MathUtils.randInt(0, options.length-1)];
                arr.push({ type: 'tf', prompt: `Is (${t.join(', ')}) a PRIMITIVE Baudhāyana triple (no common factor)?`, answer: MathUtils.isPrimitiveTriple(t[0],t[1],t[2]) });
            } else if (roll < 0.58) {
                const s = MathUtils.randInt(2, 15);
                arr.push({ type: 'text', prompt: `A square has side ${s}. Is its diagonal length rational? Answer "yes" or "no".`, answer: 'no' });
            } else if (roll < 0.75) {
                const base = [[3,4,5],[5,12,13],[8,15,17],[7,24,25]][MathUtils.randInt(0,3)];
                const k = MathUtils.randInt(2, 6);
                arr.push({ type: 'numeric', prompt: `Scale the triple (${base.join(',')}) by k=${k}. What is the new hypotenuse?`, answer: base[2]*k });
            } else if (roll < 0.88) {
                const n = MathUtils.randInt(1, 20);
                arr.push({ type: 'numeric', prompt: `Between which two consecutive integers does √${n} lie? Give the SMALLER (lower bound) integer.`, answer: Math.floor(Math.sqrt(n)) });
            } else {
                const bank = this.tfBank[MathUtils.randInt(0, this.tfBank.length - 1)];
                arr.push({ type: 'tf', prompt: bank.stmt, answer: bank.a });
            }
        }
        return arr;
    }
    setUserVal(v) { this.userVal = v; }
    submitNumeric() {
        if (this.answered) return;
        const q = this.questions[this.index];
        this.answered = true;
        this.lastCorrect = (parseFloat(this.userVal) === q.answer);
        if (this.lastCorrect) this.score++;
        app.render();
    }
    submitText() {
        if (this.answered) return;
        const q = this.questions[this.index];
        this.answered = true;
        this.lastCorrect = (this.userVal || '').trim().toLowerCase() === String(q.answer).toLowerCase();
        if (this.lastCorrect) this.score++;
        app.render();
    }
    submitTF(bool) {
        if (this.answered) return;
        const q = this.questions[this.index];
        this.answered = true;
        this.lastCorrect = (bool === q.answer);
        if (this.lastCorrect) this.score++;
        app.render();
    }
    next() { this.index++; this.answered = false; this.lastCorrect = null; this.userVal = ''; app.render(); }
    updatePoint() {}
    getSidebarHTML() {
        if (!this.started) {
            return `
                <h2>Quiz Arena</h2>
                <p>Test yourself on Baudhāyana's theorem, triples, √2, and Fermat's Last Theorem.</p>
                <div class="data-panel">
                    <div style="font-weight:700;margin-bottom:8px;">Number of questions</div>
                    <div class="pill-row">
                        <div class="pill-btn ${this.total===5?'active':''}" onclick="app.activeModule.setTotal(5)">5</div>
                        <div class="pill-btn ${this.total===10?'active':''}" onclick="app.activeModule.setTotal(10)">10</div>
                        <div class="pill-btn ${this.total===15?'active':''}" onclick="app.activeModule.setTotal(15)">15</div>
                    </div>
                </div>
                <button class="action-btn primary wide" onclick="app.activeModule.start()">▶ Start Quiz</button>
                <div class="proof-box">Mix of hypotenuse calculations, primitive-triple checks, √n bounds, and true/false history questions.</div>
            `;
        }
        if (this.index >= this.questions.length) {
            return `
                <h2>Quiz Arena</h2>
                <div class="badge success">Final score: ${this.score} / ${this.questions.length}</div>
                <p>Nice work! Try again for a fresh set of questions.</p>
                <button class="action-btn primary wide" onclick="app.activeModule.restart()">↻ New Quiz</button>
            `;
        }
        return `
            <h2>Quiz Arena</h2>
            <div class="badge info">Question ${this.index + 1} / ${this.questions.length} · Score ${this.score}</div>
            <p>Answer on the right.</p>
            <button class="action-btn wide" onclick="app.activeModule.restart()">← Back to setup</button>
        `;
    }
    renderStage() {
        if (!this.started) {
            return { type: 'html', html: `<div class="quiz-wrap"><h3>Ready when you are</h3><p style="color:var(--text-mid);">Choose a question count on the left, then hit Start Quiz.</p></div>` };
        }
        if (this.index >= this.questions.length) {
            const pct = Math.round(100 * this.score / this.questions.length);
            return { type: 'html', html: `<div class="quiz-wrap">
                <h3>Quiz complete!</h3>
                <div style="font-size:3rem;font-family:'IBM Plex Mono',monospace;color:var(--brass-lt);margin:20px 0;">${this.score}/${this.questions.length}</div>
                <p style="color:var(--text-mid);">${pct >= 80 ? 'Excellent work! 🌟' : pct >= 50 ? 'Good effort — keep practising!' : 'Review the chapter and try again!'}</p>
            </div>` };
        }
        const q = this.questions[this.index];
        let body = `<div class="quiz-wrap">
            <div class="quiz-progress">QUESTION ${this.index + 1} OF ${this.questions.length}</div>
            <div class="quiz-prompt">${q.prompt}</div>`;
        if (!this.answered) {
            if (q.type === 'numeric') {
                body += `<div class="quiz-input-row">
                    <input type="number" value="${this.userVal}" oninput="app.activeModule.setUserVal(this.value)" onkeypress="if(event.key==='Enter'){app.activeModule.submitNumeric();}">
                    <button class="quiz-btn" onclick="app.activeModule.submitNumeric()">Submit</button>
                </div>`;
            } else if (q.type === 'text') {
                body += `<div class="quiz-input-row">
                    <input type="text" value="${this.userVal}" oninput="app.activeModule.setUserVal(this.value)" onkeypress="if(event.key==='Enter'){app.activeModule.submitText();}">
                    <button class="quiz-btn" onclick="app.activeModule.submitText()">Submit</button>
                </div>`;
            } else {
                body += `<div class="quiz-tf-row">
                    <button class="true-btn" onclick="app.activeModule.submitTF(true)">TRUE</button>
                    <button class="false-btn" onclick="app.activeModule.submitTF(false)">FALSE</button>
                </div>`;
            }
        } else {
            body += `<div class="quiz-feedback ${this.lastCorrect ? 'correct' : 'wrong'}">
                ${this.lastCorrect ? '✓ Correct!' : `✕ Not quite — the answer is ${q.type === 'tf' ? (q.answer ? 'TRUE' : 'FALSE') : q.answer}`}
            </div>
            <button class="quiz-btn" onclick="app.activeModule.next()">${this.index + 1 < this.questions.length ? 'Next question →' : 'See results →'}</button>`;
        }
        body += `</div>`;
        return { type: 'html', html: body };
    }
}

// =========================================================================
// 11. MAIN APP CONTROLLER
// =========================================================================
const app = {
    modules: {
        'doubling': new DoublingModule(),
        'halving': new HalvingModule(),
        'sqrt2': new SqrtTwoModule(),
        'theorem': new TheoremModule(),
        'solver': new SolverModule(),
        'triples': new TriplesModule(),
        'apps': new ApplicationsModule(),
        'fermat': new FermatModule(),
        'quiz': new QuizModule(),
    },
    tabDefs: [
        { id: 'doubling', name: '1 · Doubling a Square' },
        { id: 'halving', name: '2 · Halving a Square' },
        { id: 'sqrt2', name: '3 · √2 Explorer' },
        { id: 'theorem', name: '4 · Visual Proof' },
        { id: 'solver', name: '5 · Triangle Solver' },
        { id: 'triples', name: '6 · Triples Lab' },
        { id: 'apps', name: '7 · Applications' },
        { id: 'fermat', name: '8 · Fermat\u2019s Last Theorem' },
        { id: 'quiz', name: '9 · Quiz Arena' },
    ],
    activeTab: 'doubling',
    activeModule: null,

    init() {
        this.activeModule = this.modules[this.activeTab];
        this.renderTabs();
        this.render();
    },
    renderTabs() {
        document.getElementById('tabsBar').innerHTML = this.tabDefs.map(t =>
            `<button class="tab-btn ${t.id === this.activeTab ? 'active' : ''}" onclick="app.switchTab('${t.id}')">${t.name}</button>`
        ).join('');
    },
    switchTab(id) {
        if (!this.modules[id]) return;
        this.activeTab = id;
        this.activeModule = this.modules[id];
        this.renderTabs();
        this.render();
    },
    render() {
        document.getElementById('sidebarContent').innerHTML = this.activeModule.getSidebarHTML();
        const stageObj = this.activeModule.renderStage();
        const container = document.getElementById('stageContainer');
        if (stageObj.type === 'svg') {
            container.innerHTML = `<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">${stageObj.html}</svg>`;
        } else {
            container.innerHTML = `<div class="html-stage">${stageObj.html}</div>`;
        }
    }
};

window.onload = () => app.init();
</script>
</body>
</html>
