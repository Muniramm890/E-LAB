<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class 8: Quadrilaterals Drafting Lab | Digital E-Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           ENTERPRISE GRADE BLUEPRINT DESIGN SYSTEM
           ============================================================ */
        :root {
            --blueprint-dk: #061c30;
            --blueprint-md: #0c3559;
            --blueprint-lt: #2f75ac;
            --grid-line: rgba(210, 232, 255, 0.1);
            --grid-line-strong: rgba(210, 232, 255, 0.25);
            --brass: #c98a3e;
            --brass-lt: #e3ac6a;
            --brass-glow: rgba(201, 138, 62, 0.4);
            --paper-bg: #f5f0e1;
            --paper-text: #1a2a3a;
            --paper-line: #d1c7b1;
            --text-hi: #ffffff;
            --text-mid: #a8c4df;
            --success: #2f8a5b;
            --danger: #c1452f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: var(--blueprint-dk);
            color: var(--text-hi);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER & TABS */
        header {
            padding: 12px 20px;
            background: linear-gradient(180deg, #041220 0%, var(--blueprint-md) 100%);
            border-bottom: 1px solid var(--grid-line-strong);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand-area { display: flex; align-items: center; gap: 15px; }
        .back-btn {
            color: var(--brass-lt); text-decoration: none; font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem; border: 1px solid var(--brass); padding: 5px 12px;
            border-radius: 20px; transition: 0.2s; white-space: nowrap;
        }
        .back-btn:hover { background: var(--brass); color: var(--blueprint-dk); box-shadow: 0 0 10px var(--brass-glow); }
        .module-title h1 { font-family: 'Fraunces', serif; font-size: 1.2rem; margin-bottom: 2px; }
        .module-title p { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text-mid); letter-spacing: 1px; }

        .tabs-bar {
            display: flex; gap: 8px; padding: 10px 20px; background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--grid-line-strong); overflow-x: auto;
        }
        .tab-btn {
            background: transparent; border: 1px solid var(--blueprint-lt); color: var(--text-mid);
            padding: 8px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem;
            border-radius: 6px; cursor: pointer; transition: 0.3s; white-space: nowrap; flex: none;
        }
        .tab-btn:hover { border-color: var(--brass-lt); color: var(--text-hi); }
        .tab-btn.active { background: var(--brass); color: var(--blueprint-dk); border-color: var(--brass); font-weight: 700; box-shadow: 0 0 15px rgba(201,138,62,0.3); }

        /* WORKSPACE: Sidebar + Canvas */
        .workspace {
          display: flex; flex: 1; position: relative; overflow: hidden;
          min-height: 0;
          background-image:
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
           background-size: 25px 25px;
        }

        /* DYNAMIC SIDEBAR */
       .sidebar {
            width: 360px; background: var(--paper-bg); color: var(--paper-text);
            border-right: 4px solid var(--brass); display: flex; flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative; z-index: 5; box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            flex: none; min-height: 0;
        }
        .sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }

        .toggle-btn {
            position: absolute; top: 20px; right: -40px; width: 40px; height: 50px;
            background: var(--brass); border: none; border-radius: 0 8px 8px 0;
            color: var(--blueprint-dk); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 4px 0 10px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .toggle-btn:hover { background: var(--brass-lt); width: 45px; right: -45px;}

        .sidebar-content { padding: 20px; overflow-y: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
        .sidebar-content h2 { font-family: 'Fraunces', serif; font-size: 1.35rem; color: var(--blueprint-dk); margin-bottom: 5px; }
        .sidebar-content p { font-size: 0.88rem; line-height: 1.5; color: #4a5a6a; margin-bottom: 15px; }

        .data-panel { background: #ffffff; border: 1px solid var(--paper-line); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .data-row { display: flex; justify-content: space-between; align-items:center; font-family: 'IBM Plex Mono', monospace; font-size: 0.86rem; padding: 5px 0; border-bottom: 1px dashed #eee; gap:10px; }
        .data-row:last-child { border-bottom: none; }

        .badge { display: block; text-align: center; padding: 10px; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-weight: bold; font-size: 1rem; margin-bottom: 15px; }
        .badge.success { background: #e4f3ea; color: var(--success); border: 1px solid var(--success); }
        .badge.info { background: #e3f2fd; color: #0277bd; border: 1px solid #0277bd; }
        .badge.danger { background: #fbe9e5; color: var(--danger); border: 1px solid var(--danger); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .action-btn { padding: 9px; border: 1px solid var(--blueprint-md); background: white; border-radius: 6px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; transition: 0.2s; }
        .action-btn:hover { background: var(--blueprint-md); color: white; }

        .proof-box { background: rgba(47, 117, 172, 0.1); border-left: 4px solid var(--blueprint-lt); padding: 12px; border-radius: 0 8px 8px 0; font-size: 0.84rem; line-height:1.55; margin-bottom: 4px; }

        .pill-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .pill-btn { flex: 1; padding: 9px 6px; border: 1px solid var(--blueprint-md); background: white; border-radius: 20px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 0.76rem; text-align: center; transition: 0.2s; }
        .pill-btn.active { background: var(--blueprint-md); color: white; font-weight: 700; }

        .range-row { margin-bottom: 12px; }
        .range-row label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; }
        .range-row input[type=range] { width: 100%; accent-color: var(--brass); height: 22px; cursor: pointer; }

        .check-item { display: inline-flex; align-items: center; }
        .dot { width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 800; color: white; }

        /* STAGE */
        .stage { flex: 1; position: relative; touch-action: none; display: flex; align-items: center; justify-content: center; padding: 20px;}
        .canvas-container {
            width: 100%; max-width: 900px; height: 100%; max-height: 620px;
            background: rgba(4, 18, 32, 0.6); border: 1px solid var(--grid-line-strong);
            border-radius: 12px; box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
        }

        svg { width: 100%; height: 100%; touch-action: none; display:block; }
        .axis { stroke: rgba(255,255,255,0.15); stroke-width: 1; }
        .shape-edge { stroke: #f3f7fc; stroke-width: 3; fill: rgba(47, 117, 172, 0.3); stroke-linejoin: round; }
        .diag-line { stroke: var(--brass); stroke-width: 2; stroke-dasharray: 6 6; }
        .ang-arc { fill: var(--brass-glow); stroke: var(--brass-lt); stroke-width: 1.5; pointer-events:none; }
        .vtx-handle { cursor: grab; fill: var(--brass); stroke: #fff; stroke-width: 2; }
        .vtx-handle:hover { fill: var(--brass-lt); }
        .vtx-handle:active { cursor: grabbing; }

        .svg-label { font-family: 'IBM Plex Mono', monospace; font-weight: bold; font-size: 14px; fill: white; pointer-events: none; }
        .svg-text-bg { paint-order: stroke; stroke: var(--blueprint-dk); stroke-width: 4; }
        .venn-region { cursor: pointer; transition: filter 0.15s; }
        .venn-region:hover { filter: brightness(1.35); }

        /* Mobile */
        @media (max-width: 860px) {
            .sidebar { width: 86vw; }
            .module-title h1 { font-size: 1rem; }
            .toggle-btn { top: auto; bottom: 18px; right: -46px; width: 46px; height: 46px; border-radius: 50%; }
        }
        .sidebar-content::-webkit-scrollbar { width: 8px; }
        .sidebar-content::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <div class="brand-area">
            <a href="../index.html" class="back-btn">← E-Lab</a>
            <div class="module-title">
                <h1>Quadrilaterals Drafting Lab</h1>
                <p>CLASS 8 · CHAPTER 04 · GANITA PRAKASH · INTERACTIVE ENGINE</p>
            </div>
        </div>
    </header>

    <div class="tabs-bar" id="tabsBar"></div>

    <div class="workspace">
        <aside class="sidebar" id="sidebar">
            <button class="toggle-btn" onclick="toggleSidebar()" title="Show/hide calculation panel">☰</button>
            <div class="sidebar-content" id="sidebarContent"></div>
        </aside>

        <main class="stage">
            <div class="canvas-container">
                <svg id="draftingBoard" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
        </main>
    </div>

    <script>
        // =====================================================================
        // 1. CORE MATH ENGINE
        // =====================================================================
        const MathUtils = {
            distance: (p1, p2) => Math.hypot(p2.x - p1.x, p2.y - p1.y),

            // Robust interior-angle calc via signed turning angles — correct for
            // convex AND concave (reflex) simple polygons, any winding direction.
            interiorAngles: (pts) => {
                const n = pts.length;
                const turns = [];
                for (let i = 0; i < n; i++) {
                    const prev = pts[(i - 1 + n) % n], curr = pts[i], next = pts[(i + 1) % n];
                    const vin = { x: curr.x - prev.x, y: curr.y - prev.y };
                    const vout = { x: next.x - curr.x, y: next.y - curr.y };
                    const cross = vin.x * vout.y - vin.y * vout.x;
                    const dot = vin.x * vout.x + vin.y * vout.y;
                    turns.push(Math.atan2(cross, dot));
                }
                const total = turns.reduce((a, b) => a + b, 0);
                const sign = total >= 0 ? 1 : -1;
                return turns.map(t => (Math.PI - sign * t) * 180 / Math.PI);
            },

            describeArc: (x, y, radius, a1, a2, sweepFlag, largeArc) => {
                const p1 = { x: x + radius * Math.cos(a1), y: y + radius * Math.sin(a1) };
                const p2 = { x: x + radius * Math.cos(a2), y: y + radius * Math.sin(a2) };
                return `M ${x} ${y} L ${p1.x} ${p1.y} A ${radius} ${radius} 0 ${largeArc} ${sweepFlag} ${p2.x} ${p2.y} Z`;
            }
        };

        // Draws the interior angle arc + degree label at vertex i of polygon pts.
        function arcAndLabel(pts, i, angleDeg) {
            const n = pts.length;
            const prev = pts[(i - 1 + n) % n], curr = pts[i], next = pts[(i + 1) % n];
            const a1 = Math.atan2(prev.y - curr.y, prev.x - curr.x);
            const a2 = Math.atan2(next.y - curr.y, next.x - curr.x);
            let diff = a2 - a1;
            while (diff <= -Math.PI) diff += 2 * Math.PI;
            while (diff > Math.PI) diff -= 2 * Math.PI;
            const sweepFlag = diff > 0 ? 1 : 0;
            const radius = 36;
            let out = '';
            const reflex = angleDeg > 185;
            if (!reflex) {
                out += `<path d="${MathUtils.describeArc(curr.x, curr.y, radius, a1, a2, sweepFlag, 0)}" class="ang-arc"/>`;
            }
            let mid = a1 + diff / 2;
            if (reflex) mid += Math.PI;
            const labelR = reflex ? 30 : 56;
            const lx = curr.x + Math.cos(mid) * labelR;
            const ly = curr.y + Math.sin(mid) * labelR;
            out += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" class="svg-label svg-text-bg">${angleDeg.toFixed(0)}°</text>`;
            return out;
        }

        // =====================================================================
        // 2. SVG CANVAS CONTROLLER
        // =====================================================================
        const svg = document.getElementById('draftingBoard');
        const VB = { w: 800, h: 600 };

        function getMousePos(evt) {
            const pt = svg.createSVGPoint();
            pt.x = evt.clientX; pt.y = evt.clientY;
            return pt.matrixTransform(svg.getScreenCTM().inverse());
        }

        function drawGrid() {
            let g = '';
            for (let i = 0; i <= VB.w; i += 50) g += `<line x1="${i}" y1="0" x2="${i}" y2="${VB.h}" class="axis"/>`;
            for (let i = 0; i <= VB.h; i += 50) g += `<line x1="0" y1="${i}" x2="${VB.w}" y2="${i}" class="axis"/>`;
            return g;
        }

        function toggleSwitch(checked) {
            return `<div style="width:40px;height:20px;background:${checked ? 'var(--brass)' : '#ccc'};border-radius:10px;position:relative;flex:none;">
                <div style="width:16px;height:16px;background:white;border-radius:50%;position:absolute;top:2px;left:${checked ? '22px' : '2px'};transition:.2s;"></div>
            </div>`;
        }
        function checkDot(ok) {
            return `<span class="check-item"><span class="dot" style="background:${ok ? 'var(--success)' : '#c7bda0'}">${ok ? '✓' : '✕'}</span></span>`;
        }

        // =====================================================================
        // 3. MODULE 1 — ANGLE SUM  (§4.2)
        // =====================================================================
        class AngleSumModule {
            constructor() {
                this.pts = [{ x: 200, y: 450 }, { x: 250, y: 150 }, { x: 600, y: 100 }, { x: 650, y: 400 }];
                this.labels = ['A', 'B', 'C', 'D'];
                this.showProof = false;
            }
            updatePoint(i, p) { this.pts[i] = p; }
            setPreset(type) {
                const presets = {
                    square: [{ x: 250, y: 450 }, { x: 250, y: 150 }, { x: 550, y: 150 }, { x: 550, y: 450 }],
                    kite: [{ x: 400, y: 500 }, { x: 200, y: 250 }, { x: 400, y: 100 }, { x: 600, y: 250 }],
                    trapezium: [{ x: 150, y: 450 }, { x: 300, y: 150 }, { x: 500, y: 150 }, { x: 650, y: 450 }],
                    dart: [{ x: 200, y: 450 }, { x: 400, y: 260 }, { x: 600, y: 450 }, { x: 400, y: 100 }],
                };
                if (type === 'random') {
                    this.pts = [
                        { x: 150 + Math.random() * 100, y: 380 + Math.random() * 100 },
                        { x: 180 + Math.random() * 100, y: 110 + Math.random() * 100 },
                        { x: 500 + Math.random() * 120, y: 90 + Math.random() * 100 },
                        { x: 540 + Math.random() * 100, y: 380 + Math.random() * 100 },
                    ];
                } else {
                    this.pts = presets[type].map(p => ({ ...p }));
                }
                app.render();
            }
            toggleProof() { this.showProof = !this.showProof; app.render(); }
            getSidebarHTML() {
                const angles = MathUtils.interiorAngles(this.pts);
                const sum = angles.reduce((a, b) => a + b, 0);
                return `
                    <h2>Angle-Sum Property</h2>
                    <p><b>§4.2</b> · Drag any vertex — even into a concave “dart” — the four interior angles always total 360°.</p>
                    <div class="badge success">SUM = ${sum.toFixed(1)}°</div>
                    <div class="data-panel">
                        <div style="font-weight:700;margin-bottom:8px;">Interior angles</div>
                        ${angles.map((a, i) => `<div class="data-row"><span>∠${this.labels[i]}</span><span>${a.toFixed(1)}°</span></div>`).join('')}
                    </div>
                    <div class="btn-grid">
                        <button class="action-btn" onclick="app.activeModule.setPreset('square')">Square</button>
                        <button class="action-btn" onclick="app.activeModule.setPreset('kite')">Kite</button>
                        <button class="action-btn" onclick="app.activeModule.setPreset('trapezium')">Trapezium</button>
                        <button class="action-btn" onclick="app.activeModule.setPreset('dart')">Concave dart</button>
                    </div>
                    <button class="action-btn" style="width:100%;margin-bottom:15px;" onclick="app.activeModule.setPreset('random')">🎲 Randomise</button>
                    <div class="data-panel" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="app.activeModule.toggleProof()">
                        <strong>Show diagonal-split proof</strong>${toggleSwitch(this.showProof)}
                    </div>
                    <div class="proof-box">Split by diagonal AC into ∆ABC and ∆ACD. Each triangle's angles sum to 180°, and together every corner of the quadrilateral is counted once — so 180° + 180° = <b>360°</b>, always.</div>
                `;
            }
            renderSVG() {
                let html = drawGrid();
                const angles = MathUtils.interiorAngles(this.pts);
                html += `<polygon points="${this.pts.map(p => `${p.x},${p.y}`).join(' ')}" class="shape-edge"/>`;
                if (this.showProof) {
                    html += `<line x1="${this.pts[0].x}" y1="${this.pts[0].y}" x2="${this.pts[2].x}" y2="${this.pts[2].y}" class="diag-line"/>`;
                }
                this.pts.forEach((p, i) => { html += arcAndLabel(this.pts, i, angles[i]); });
                this.pts.forEach((p, i) => {
                    html += `<text x="${p.x}" y="${p.y - 24}" text-anchor="middle" class="svg-label">${this.labels[i]}</text>`;
                    html += `<circle cx="${p.x}" cy="${p.y}" r="9" class="vtx-handle" data-id="${i}"/>`;
                });
                return html;
            }
        }

        // =====================================================================
        // 4. MODULE 2 — RECTANGLE & SQUARE  (§4.1, Carpenter's Problem — diagonal lab)
        // =====================================================================
       class RectangleSquareModule {
    constructor() {
        this.pts = this.paramsToPoints({ OA: 130, OC: 130, OB: 130, OD: 130, theta: 55 });
    }
    paramsToPoints({ OA, OC, OB, OD, theta }) {
        const O = { x: 400, y: 300 };
        const rad = theta * Math.PI / 180;
        const d1 = { x: 1, y: 0 }, d2 = { x: Math.cos(rad), y: Math.sin(rad) };
        const A = { x: O.x - d1.x * OA, y: O.y - d1.y * OA };
        const C = { x: O.x + d1.x * OC, y: O.y + d1.y * OC };
        const B = { x: O.x + d2.x * OB, y: O.y + d2.y * OB };
        const D = { x: O.x - d2.x * OD, y: O.y - d2.y * OD };
        return [A, B, C, D];
    }
    setPreset(name) {
        const P = {
            rectangle: { OA: 130, OC: 130, OB: 130, OD: 130, theta: 55 },
            square: { OA: 115, OC: 115, OB: 115, OD: 115, theta: 90 },
            rhombus: { OA: 70, OC: 70, OB: 145, OD: 145, theta: 90 },
            parallelogram: { OA: 60, OC: 60, OB: 125, OD: 125, theta: 55 },
            kite: { OA: 95, OC: 95, OB: 60, OD: 155, theta: 90 },
            general: { OA: 60, OC: 130, OB: 80, OD: 150, theta: 70 },
        };
        this.pts = this.paramsToPoints(P[name]);
        app.render();
    }
    // Yehi function drag ko point move karne deta hai — Tab 1 jaisa
    updatePoint(i, p) { this.pts[i] = p; }
    classify() {
        const [A, B, C, D] = this.pts;
        const lenAC = MathUtils.distance(A, C), lenBD = MathUtils.distance(B, D);
        const midAC = { x: (A.x + C.x) / 2, y: (A.y + C.y) / 2 };
        const midBD = { x: (B.x + D.x) / 2, y: (B.y + D.y) / 2 };
        const bisect = MathUtils.distance(midAC, midBD) < 6;
        const eqDiag = Math.abs(lenAC - lenBD) < 6;
        const vAC = { x: C.x - A.x, y: C.y - A.y }, vBD = { x: D.x - B.x, y: D.y - B.y };
        const dot = vAC.x * vBD.x + vAC.y * vBD.y;
        const magProd = (Math.hypot(vAC.x, vAC.y) * Math.hypot(vBD.x, vBD.y)) || 1;
        const ang = Math.acos(Math.max(-1, Math.min(1, dot / magProd))) * 180 / Math.PI;
        const perp = Math.abs(ang - 90) < 3;
        let name = 'General quadrilateral', tone = 'info';
        if (bisect && eqDiag && perp) { name = 'Square ✓'; tone = 'success'; }
        else if (bisect && eqDiag) { name = 'Rectangle ✓'; tone = 'success'; }
        else if (bisect && perp) { name = 'Rhombus ✓'; tone = 'success'; }
        else if (bisect) { name = 'Parallelogram ✓'; tone = 'success'; }
        else if (perp) { name = 'Kite-like (⟂ diagonals) ✓'; tone = 'success'; }
        return { name, tone, bisect, eqDiag, perp };
    }
    getSidebarHTML() {
        const [A, B, C, D] = this.pts;
        const cls = this.classify();
        const sides = { AB: MathUtils.distance(A, B), BC: MathUtils.distance(B, C), CD: MathUtils.distance(C, D), DA: MathUtils.distance(D, A) };
        const angles = MathUtils.interiorAngles([A, B, C, D]);
        return `
            <h2>Rectangle &amp; Square</h2>
            <p><b>§4.1</b> · Board pe kisi bhi corner (A, B, C, D) ko seedha drag karo — Angle-Sum tab jaisa. Naam neeche diagonals se auto-update hota hai.</p>
            <div class="badge ${cls.tone}">${cls.name}</div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Diagonal test</div>
                <div class="data-row"><span>AC = BD (equal length)</span>${checkDot(cls.eqDiag)}</div>
                <div class="data-row"><span>Diagonals bisect each other</span>${checkDot(cls.bisect)}</div>
                <div class="data-row"><span>Diagonals ⟂ (90°)</span>${checkDot(cls.perp)}</div>
            </div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Sides &amp; angles</div>
                <div class="data-row"><span>AB · BC · CD · DA</span><span>${[sides.AB, sides.BC, sides.CD, sides.DA].map(s => s.toFixed(0)).join(' · ')}</span></div>
                <div class="data-row"><span>∠A · ∠B · ∠C · ∠D</span><span>${angles.map(a => a.toFixed(0)).join('° · ')}°</span></div>
            </div>
            <div class="btn-grid">

    class RhombusModule {
      constructor() {
        this.A = { x: 280, y: 430 };
        this.side = 130;
        this.angB = 0;     // direction (deg) of side AB from A
        this.angD = -70;   // direction (deg) of side AD from A
        this.recompute();
      }
    recompute() {
        const radB = this.angB * Math.PI / 180, radD = this.angD * Math.PI / 180;
        const dirB = { x: Math.cos(radB), y: Math.sin(radB) };
        const dirD = { x: Math.cos(radD), y: Math.sin(radD) };
        const B = { x: this.A.x + dirB.x * this.side, y: this.A.y + dirB.y * this.side };
        const D = { x: this.A.x + dirD.x * this.side, y: this.A.y + dirD.y * this.side };
        const C = { x: B.x + D.x - this.A.x, y: B.y + D.y - this.A.y };
        this.pts = [this.A, B, C, D];
    }
    setPreset(name) {
        const P = {
            thin:   { side: 150, angB: 0, angD: -35 },
            fat:    { side: 120, angB: 0, angD: -110 },
            square: { side: 120, angB: 0, angD: -90 },
        };
        const p = P[name];
        this.side = p.side; this.angB = p.angB; this.angD = p.angD;
        this.recompute();
        app.render();
    }
    // Free drag on any corner — shape auto-corrects to stay a valid rhombus
    updatePoint(i, p) {
        if (i === 0) {
            this.A = p; // moving A translates the whole rhombus
        } else if (i === 1) {
            const dx = p.x - this.A.x, dy = p.y - this.A.y;
            this.side = Math.max(30, Math.hypot(dx, dy));
            this.angB = Math.atan2(dy, dx) * 180 / Math.PI;
        } else if (i === 3) {
            const dx = p.x - this.A.x, dy = p.y - this.A.y;
            this.side = Math.max(30, Math.hypot(dx, dy));
            this.angD = Math.atan2(dy, dx) * 180 / Math.PI;
        } else if (i === 2) {
            // dragging the far corner C uniformly resizes (apex angle stays same)
            const radB = this.angB * Math.PI / 180, radD = this.angD * Math.PI / 180;
            const dirSum = { x: Math.cos(radB) + Math.cos(radD), y: Math.sin(radB) + Math.sin(radD) };
            const denom = dirSum.x * dirSum.x + dirSum.y * dirSum.y || 1;
            const v = { x: p.x - this.A.x, y: p.y - this.A.y };
            const newSide = (v.x * dirSum.x + v.y * dirSum.y) / denom;
            this.side = Math.max(30, newSide);
        }
        this.recompute();
    }
    getSidebarHTML() {
        const [A, B, C, D] = this.pts;
        const angles = MathUtils.interiorAngles([A, B, C, D]);
        let apex = Math.abs(this.angB - this.angD) % 360;
        if (apex > 180) apex = 360 - apex;
        const half = apex / 2;
        const v1 = { x: C.x - A.x, y: C.y - A.y }, v2 = { x: D.x - B.x, y: D.y - B.y };
        let diagAng = Math.acos((v1.x * v2.x + v1.y * v2.y) / (Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y))) * 180 / Math.PI;
        const acuteAngle = diagAng > 90 ? 180 - diagAng : diagAng;
        return `
            <h2>Rhombus</h2>
            <p><b>§4.4</b> · Drag any corner on the board — A moves the whole shape, B or D changes a side's length &amp; angle, C resizes it. All four sides stay equal automatically.</p>
            <div class="badge success">All sides = ${this.side.toFixed(0)}px</div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Angles</div>
                ${['A', 'B', 'C', 'D'].map((l, i) => `<div class="data-row"><span>∠${l}</span><span>${angles[i].toFixed(0)}°</span></div>`).join('')}
            </div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Diagonal check (Deductions 9–10)</div>
                <div class="data-row"><span>Intersection angle</span><span>${acuteAngle.toFixed(0)}° / ${(180 - acuteAngle).toFixed(0)}°</span></div>
                <div class="data-row"><span>∠A split by diagonal</span><span>${half.toFixed(0)}° + ${half.toFixed(0)}°</span></div>
            </div>
            <div class="btn-grid">
                <button class="action-btn" onclick="app.activeModule.setPreset('thin')">Thin</button>
                <button class="action-btn" onclick="app.activeModule.setPreset('fat')">Fat</button>
                <button class="action-btn" onclick="app.activeModule.setPreset('square')">90° (square)</button>
            </div>
            <div class="proof-box">Notice the intersection angle stays at <b>90°</b> no matter what apex angle you pick — the diagonals of a rhombus always meet at right angles and bisect its vertex angles.</div>
        `;
    }
    renderSVG() {
        const [A, B, C, D] = this.pts;
        let html = drawGrid();
        html += `<polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y} ${D.x},${D.y}" class="shape-edge" style="fill:rgba(191,77,46,0.18); stroke:#e08a6a;"/>`;
        html += `<line x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}" class="diag-line"/>`;
        html += `<line x1="${B.x}" y1="${B.y}" x2="${D.x}" y2="${D.y}" class="diag-line"/>`;
        const labels = ['A', 'B', 'C', 'D'];
        this.pts.forEach((p, i) => {
            html += `<text x="${p.x}" y="${p.y - 18}" text-anchor="middle" class="svg-label">${labels[i]}</text>`;
            html += `<circle cx="${p.x}" cy="${p.y}" r="9" class="vtx-handle" data-id="${i}"/>`;
        });
        return html;
    }
}

       class KiteTrapeziumModule {
    constructor() {
        this.subMode = 'kite';

        // Kite state: A, C are free points; tB, tD are signed distances of B, D
        // from the perpendicular bisector of AC — this is what forces AB=BC, CD=DA.
        this.kA = { x: 310, y: 260 };
        this.kC = { x: 490, y: 260 };
        this.tB = -70;
        this.tD = 170;

        // Trapezium state: P,Q share a y (top), R,S share a y (bottom) -> PQ ∥ SR always.
        this.trap = {
            P: { x: 290, y: 190 }, Q: { x: 510, y: 190 },
            R: { x: 590, y: 410 }, S: { x: 210, y: 410 },
        };
        this.trapAxisX = 400;
        this.isosceles = true;
    }

    setSubMode(m) { this.subMode = m; app.render(); }

    // ---------- KITE ----------
    computeKite() {
        const A = this.kA, C = this.kC;
        const v = { x: C.x - A.x, y: C.y - A.y };
        const L = Math.hypot(v.x, v.y) || 1;
        const u = { x: v.x / L, y: v.y / L };
        const d = { x: -u.y, y: u.x }; // unit perpendicular to AC
        const M = { x: (A.x + C.x) / 2, y: (A.y + C.y) / 2 };
        const B = { x: M.x + d.x * this.tB, y: M.y + d.y * this.tB };
        const D = { x: M.x + d.x * this.tD, y: M.y + d.y * this.tD };
        return { A, B, C, D, M, d };
    }
    setKitePreset(name) {
        const P = {
            standard: { A: { x: 310, y: 260 }, C: { x: 490, y: 260 }, tB: -70, tD: 170 },
            wide:     { A: { x: 260, y: 280 }, C: { x: 540, y: 280 }, tB: -50, tD: 90 },
            tall:     { A: { x: 350, y: 260 }, C: { x: 450, y: 260 }, tB: -140, tD: 200 },
        };
        const p = P[name];
        this.kA = { ...p.A }; this.kC = { ...p.C }; this.tB = p.tB; this.tD = p.tD;
        app.render();
    }

    // ---------- TRAPEZIUM ----------
    computeTrap() { return this.trap; }
    toggleIsosceles() {
        this.isosceles = !this.isosceles;
        if (this.isosceles) {
            const t = this.trap;
            const halfTop = Math.abs(t.P.x - t.Q.x) / 2;
            const halfBottom = Math.abs(t.S.x - t.R.x) / 2;
            t.P.x = this.trapAxisX - halfTop; t.Q.x = this.trapAxisX + halfTop;
            t.S.x = this.trapAxisX - halfBottom; t.R.x = this.trapAxisX + halfBottom;
        }
        app.render();
    }

    // ---------- SHARED DRAG ENTRY POINT ----------
    updatePoint(i, p) {
        if (this.subMode === 'kite') {
            if (i === 0) this.kA = p;
            else if (i === 2) this.kC = p;
            else if (i === 1 || i === 3) {
                const A = this.kA, C = this.kC;
                const v = { x: C.x - A.x, y: C.y - A.y };
                const L = Math.hypot(v.x, v.y) || 1;
                const u = { x: v.x / L, y: v.y / L };
                const d = { x: -u.y, y: u.x };
                const M = { x: (A.x + C.x) / 2, y: (A.y + C.y) / 2 };
                const w = { x: p.x - M.x, y: p.y - M.y };
                const t = w.x * d.x + w.y * d.y;
                if (i === 1) this.tB = t; else this.tD = t;
            }
        } else {
            const t = this.trap;
            const ax = this.trapAxisX;
            if (i === 0) { // P
                t.P = { x: p.x, y: p.y }; t.Q.y = p.y;
                if (this.isosceles) t.Q.x = 2 * ax - t.P.x;
            } else if (i === 1) { // Q
                t.Q = { x: p.x, y: p.y }; t.P.y = p.y;
                if (this.isosceles) t.P.x = 2 * ax - t.Q.x;
            } else if (i === 2) { // R
                t.R = { x: p.x, y: p.y }; t.S.y = p.y;
                if (this.isosceles) t.S.x = 2 * ax - t.R.x;
            } else if (i === 3) { // S
                t.S = { x: p.x, y: p.y }; t.R.y = p.y;
                if (this.isosceles) t.R.x = 2 * ax - t.S.x;
            }
        }
    }

    getSidebarHTML() { return this.subMode === 'kite' ? this.kiteSidebar() : this.trapSidebar(); }
    tabsHTML() {
        return `<div class="pill-row">
            <div class="pill-btn ${this.subMode === 'kite' ? 'active' : ''}" onclick="app.activeModule.setSubMode('kite')">Kite</div>
            <div class="pill-btn ${this.subMode === 'trapezium' ? 'active' : ''}" onclick="app.activeModule.setSubMode('trapezium')">Trapezium</div>
        </div>`;
    }
    kiteSidebar() {
        const { A, B, C, D } = this.computeKite();
        const AB = MathUtils.distance(A, B), DA = MathUtils.distance(D, A);
        const angles = MathUtils.interiorAngles([A, B, C, D]);
        return `
            <h2>Kite &amp; Trapezium Studio</h2>
            ${this.tabsHTML()}
            <p><b>§4.6</b> · Drag any corner on the board. Move A or C and B/D follow along the symmetry line automatically — AB=BC and CD=DA stay true no matter what.</p>
            <div class="badge success">AB=BC=${AB.toFixed(0)}px · CD=DA=${DA.toFixed(0)}px</div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Angles</div>
                ${['A', 'B', 'C', 'D'].map((l, i) => `<div class="data-row"><span>∠${l}</span><span>${angles[i].toFixed(0)}°</span></div>`).join('')}
            </div>
            <div class="btn-grid">
                <button class="action-btn" onclick="app.activeModule.setKitePreset('standard')">Standard</button>
                <button class="action-btn" onclick="app.activeModule.setKitePreset('wide')">Wide</button>
                <button class="action-btn" onclick="app.activeModule.setKitePreset('tall')">Tall</button>
            </div>
            <div class="proof-box">Diagonal BD is the kite's axis of symmetry: it's always the perpendicular bisector of AC, so it bisects AC at right angles, and bisects ∠B and ∠D. Set B and D equally far from the axis midpoint and the kite becomes a rhombus.</div>
        `;
    }
    trapSidebar() {
        const { P, Q, R, S } = this.trap;
        const angles = MathUtils.interiorAngles([P, Q, R, S]);
        return `
            <h2>Kite &amp; Trapezium Studio</h2>
            ${this.tabsHTML()}
            <p><b>§4.6</b> · Drag P, Q, R or S anywhere. Top two stay level and bottom two stay level, so PQ ∥ SR always — no matter how you move them.</p>
            <div class="badge info">∠S+∠P=180° · ∠R+∠Q=180°</div>
            <div class="data-panel" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="app.activeModule.toggleIsosceles()">
                <strong>Isosceles trapezium</strong>${toggleSwitch(this.isosceles)}
            </div>
            <div class="data-panel">
                <div style="font-weight:700;margin-bottom:6px;">Angles</div>
                ${['P', 'Q', 'R', 'S'].map((l, i) => `<div class="data-row"><span>∠${l}</span><span>${angles[i].toFixed(0)}°</span></div>`).join('')}
            </div>

        `;

    renderSVG() {
        let html = drawGrid();

                    { q: "A quadrilateral in which the opposite angles are equal must be a parallelogram.", a: true, why: "Equal opposite angles force adjacent angles to be supplementary, which makes both pairs of sides parallel." },
                    { q: "A quadrilateral in which all the angles are equal is a rectangle.", a: true, why: "Each angle must be 360° ÷ 4 = 90°, so it's a rectangle." },
                    { q: "Isosceles trapeziums are parallelograms.", a: false, why: "Only one pair of sides is guaranteed parallel — the legs are equal in length but not parallel." },
                ];
                this.regions = {
                    quad: { name: 'Quadrilateral', def: 'Any closed 4-sided figure. Angle sum is always 360°.' },
                    trapezium: { name: 'Trapezium', def: 'At least one pair of opposite sides is parallel.' },
                    kite: { name: 'Kite', def: 'Two distinct pairs of adjacent equal sides. Diagonals are perpendicular.' },
                    parallelogram: { name: 'Parallelogram', def: 'Both pairs of opposite sides parallel. Diagonals bisect each other.' },
                    rectangle: { name: 'Rectangle', def: 'A parallelogram with all angles 90°. Diagonals equal & bisect each other.' },
                    rhombus: { name: 'Rhombus', def: 'A parallelogram with all sides equal. Diagonals perpendicular & bisecting — it is also a kite.' },
                    square: { name: 'Square', def: 'A rectangle that is also a rhombus: all sides equal, all angles 90°.' },
                };
            }
            setView(v) { this.view = v; app.render(); }
            select(region) { this.selected = region; app.render(); }
            answer(bool) {
                if (this.answered) return;
                this.answered = true;
                const qi = this.order[this.quizIndex];
                this.lastCorrect = (bool === this.questions[qi].a);
                if (this.lastCorrect) this.score++;
                app.render();
            }
            next() { this.quizIndex++; this.answered = false; this.lastCorrect = null; app.render(); }
            restart() {
                this.order = [0,1,2,3,4,5,6].sort(() => Math.random() - 0.5);
                this.quizIndex = 0; this.score = 0; this.answered = false; this.lastCorrect = null;
                app.render();
            }
            updatePoint() {}
            getSidebarHTML() { return this.view === 'quiz' ? this.quizSidebar() : this.vennSidebar(); }
            tabsHTML() {
                return `<div class="pill-row">
                    <div class="pill-btn ${this.view === 'venn' ? 'active' : ''}" onclick="app.activeModule.setView('venn')">Venn Map</div>
                    <div class="pill-btn ${this.view === 'quiz' ? 'active' : ''}" onclick="app.activeModule.setView('quiz')">True/False Quiz</div>
                </div>`;
            }
            vennSidebar() {
                const r = this.selected ? this.regions[this.selected] : null;
                return `
                    <h2>Which Quad? Family Tree</h2>
                    ${this.tabsHTML()}
                    <p>Tap any region of the diagram to see how that family fits into the others.</p>
                    ${r ? `<div class="data-panel"><div style="font-weight:700; color:var(--blueprint-md); font-size:1.05rem; margin-bottom:6px;">${r.name}</div><p style="margin:0; font-size:0.86rem; color:#4a5a6a;">${r.def}</p></div>`
                        : `<div class="proof-box">Every square is a rhombus, a rectangle, a kite, a parallelogram, a trapezium — and a quadrilateral. But not every quadrilateral is a square. Tap a region to explore.</div>`}
                    <div class="data-panel">
                        <div style="font-weight:700;margin-bottom:6px;">Chain of inclusion</div>
                        <div style="font-family:'IBM Plex Mono',monospace; font-size:0.76rem; line-height:2;">
                        Square ⊂ Rectangle ⊂ Parallelogram ⊂ Trapezium ⊂ Quadrilateral<br>
                        Square ⊂ Rhombus ⊂ Kite<br>
                        Square ⊂ Rhombus ⊂ Parallelogram
                        </div>
                    </div>
                `;
            }
            quizSidebar() {
                if (this.quizIndex >= this.order.length) {
                    return `
                        <h2>Which Quad? Family Tree</h2>
                        ${this.tabsHTML()}
                        <div class="badge success">Score: ${this.score} / ${this.order.length}</div>
                        <p>Quiz complete — built from the chapter's own Figure-it-out true/false round.</p>
                        <button class="action-btn" style="width:100%;" onclick="app.activeModule.restart()">↻ Play again</button>
                    `;
                }
                const item = this.questions[this.order[this.quizIndex]];
                let bottom = `
                    <div class="btn-grid">
                        <button class="action-btn" style="background:var(--success); color:white;" onclick="app.activeModule.answer(true)">TRUE</button>
                        <button class="action-btn" style="background:var(--danger); color:white;" onclick="app.activeModule.answer(false)">FALSE</button>
                    </div>`;
                if (this.answered) {
                    bottom = `<div class="data-panel" style="border-left:4px solid ${this.lastCorrect ? 'var(--success)' : 'var(--danger)'};">
                        <div style="font-weight:700; color:${this.lastCorrect ? 'var(--success)' : 'var(--danger)'}; margin-bottom:4px;">${this.lastCorrect ? 'Correct!' : 'Not quite.'} — Statement is ${item.a ? 'TRUE' : 'FALSE'}</div>
                        <p style="margin:0; font-size:0.84rem;">${item.why}</p>
                    </div>
                    <button class="action-btn" style="width:100%;" onclick="app.activeModule.next()">Next question →</button>`;
                }
                return `
                    <h2>Which Quad? Family Tree</h2>
                    ${this.tabsHTML()}
                    <div class="badge info">Question ${this.quizIndex + 1} / ${this.order.length} · Score ${this.score}</div>
                    <div class="data-panel"><p style="margin:0; font-weight:600;">${item.q}</p></div>
                    ${bottom}
                `;
            }
            renderSVG() {
                let html = drawGrid();
                html += `
                    <ellipse cx="400" cy="300" rx="370" ry="270" class="venn-region" fill="rgba(47,117,172,0.10)" stroke="#8fb8dc" stroke-width="2" onclick="app.activeModule.select('quad')"/>
                    <text x="400" y="55" text-anchor="middle" class="svg-label" style="font-size:16px;">QUADRILATERAL</text>

                    <ellipse cx="330" cy="330" rx="290" ry="195" class="venn-region" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="2" onclick="app.activeModule.select('trapezium')"/>
                    <text x="145" y="165" text-anchor="middle" class="svg-label" style="font-size:14px;">TRAPEZIUM</text>

                    <ellipse cx="490" cy="330" rx="145" ry="155" class="venn-region" fill="rgba(191,77,46,0.14)" stroke="#e08a6a" stroke-width="2" onclick="app.activeModule.select('kite')"/>
                    <text x="600" y="215" text-anchor="middle" class="svg-label" style="font-size:14px;">KITE</text>

                    <ellipse cx="300" cy="350" rx="195" ry="135" class="venn-region" fill="rgba(47,138,91,0.16)" stroke="var(--success)" stroke-width="2" onclick="app.activeModule.select('parallelogram')"/>
                    <text x="195" y="255" text-anchor="middle" class="svg-label" style="font-size:13px;">PARALLELOGRAM</text>

                    <ellipse cx="250" cy="365" rx="102" ry="75" class="venn-region" fill="rgba(255,255,255,0.16)" stroke="#fff" stroke-width="2" onclick="app.activeModule.select('rectangle')"/>
                    <text x="200" y="410" text-anchor="middle" class="svg-label" style="font-size:12px;">RECTANGLE</text>

                    <ellipse cx="380" cy="355" rx="92" ry="88" class="venn-region" fill="rgba(201,138,62,0.22)" stroke="var(--brass)" stroke-width="2" onclick="app.activeModule.select('rhombus')"/>
                    <text x="435" y="300" text-anchor="middle" class="svg-label" style="font-size:12px;">RHOMBUS</text>

                    <ellipse cx="325" cy="362" rx="46" ry="43" class="venn-region" fill="rgba(255,255,255,0.4)" stroke="#fff" stroke-width="2.4" onclick="app.activeModule.select('square')"/>
                    <text x="325" y="367" text-anchor="middle" class="svg-label" style="font-size:11px;">SQ</text>
                `;
                return html;
            }
        }

        // =====================================================================
        // 9. MAIN APP CONTROLLER
        // =====================================================================
        const app = {
            modules: {
                'angle-sum': new AngleSumModule(),
                'rectangle-square': new RectangleSquareModule(),
                'parallelogram': new ParallelogramModule(),
                'rhombus': new RhombusModule(),
                'kite-trapezium': new KiteTrapeziumModule(),
                'family-tree': new FamilyTreeModule(),
            },
            tabDefs: [
                { id: 'angle-sum', name: '1 · Angle Sum' },
                { id: 'rectangle-square', name: '2 · Rectangle & Square' },
                { id: 'parallelogram', name: '3 · Parallelogram' },
                { id: 'rhombus', name: '4 · Rhombus' },
                { id: 'kite-trapezium', name: '5 · Kite & Trapezium' },
                { id: 'family-tree', name: '6 · Which Quad?' },
            ],
            activeTab: 'angle-sum',
            activeModule: null,
            dragId: -1,

            init() {
                this.activeModule = this.modules[this.activeTab];
                this.renderTabs();
                this.render();
                this.setupEvents();
            },
            renderTabs() {
                document.getElementById('tabsBar').innerHTML = this.tabDefs.map(t =>
                    `<button class="tab-btn ${t.id === this.activeTab ? 'active' : ''}" onclick="app.switchTab('${t.id}')">${t.name}</button>`
                ).join('');
            },
            switchTab(id) {
                if (!this.modules[id]) return;
                this.activeTab = id;
                this.activeModule = this.modules[id];
                this.renderTabs();
                this.render();
            },
            render() {
                document.getElementById('sidebarContent').innerHTML = this.activeModule.getSidebarHTML();
                document.getElementById('draftingBoard').innerHTML = this.activeModule.renderSVG();
            },
            setupEvents() {
                svg.addEventListener('pointerdown', e => {
                    if (e.target.classList.contains('vtx-handle')) {
                        this.dragId = parseInt(e.target.dataset.id);
                        svg.setPointerCapture(e.pointerId);
                        e.preventDefault();
                    }
                });
                svg.addEventListener('pointermove', e => {
                    if (this.dragId === -1) return;
                    let pt = getMousePos(e);
                    pt.x = Math.max(20, Math.min(VB.w - 20, pt.x));
                    pt.y = Math.max(20, Math.min(VB.h - 20, pt.y));
                    this.activeModule.updatePoint(this.dragId, pt);
                    this.render();
                });
                const endDrag = () => { this.dragId = -1; };
                svg.addEventListener('pointerup', endDrag);
                svg.addEventListener('pointercancel', endDrag);
            }
        };

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

        window.onload = () => app.init();
    </script>
</body>
</html>
