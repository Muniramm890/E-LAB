<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class 8: Quadrilaterals Drafting Lab | Digital E-Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           ENTERPRISE GRADE BLUEPRINT DESIGN SYSTEM
           ============================================================ */
        :root {
            --blueprint-dk: #061c30;
            --blueprint-md: #0c3559;
            --blueprint-lt: #2f75ac;
            --grid-line: rgba(210, 232, 255, 0.1);
            --grid-line-strong: rgba(210, 232, 255, 0.25);
            --brass: #c98a3e;
            --brass-lt: #e3ac6a;
            --brass-glow: rgba(201, 138, 62, 0.4);
            --paper-bg: #f5f0e1;
            --paper-text: #1a2a3a;
            --paper-line: #d1c7b1;
            --text-hi: #ffffff;
            --text-mid: #a8c4df;
            --success: #2f8a5b;
            --danger: #c1452f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: var(--blueprint-dk);
            color: var(--text-hi);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none; /* Prevent text selection while drafting */
        }

        /* HEADER & TABS */
        header {
            padding: 12px 20px;
            background: linear-gradient(180deg, #041220 0%, var(--blueprint-md) 100%);
            border-bottom: 1px solid var(--grid-line-strong);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand-area { display: flex; align-items: center; gap: 15px; }
        .back-btn {
            color: var(--brass-lt); text-decoration: none; font-family: 'IBM Plex Mono', monospace; 
            font-size: 0.8rem; border: 1px solid var(--brass); padding: 5px 12px; 
            border-radius: 20px; transition: 0.2s;
        }
        .back-btn:hover { background: var(--brass); color: var(--blueprint-dk); box-shadow: 0 0 10px var(--brass-glow); }
        .module-title h1 { font-family: 'Fraunces', serif; font-size: 1.2rem; margin-bottom: 2px; }
        .module-title p { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text-mid); letter-spacing: 1px; }

        .tabs-bar {
            display: flex; gap: 8px; padding: 10px 20px; background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--grid-line-strong); overflow-x: auto;
        }
        .tab-btn {
            background: transparent; border: 1px solid var(--blueprint-lt); color: var(--text-mid);
            padding: 8px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem;
            border-radius: 6px; cursor: pointer; transition: 0.3s; white-space: nowrap;
        }
        .tab-btn:hover { border-color: var(--brass-lt); color: var(--text-hi); }
        .tab-btn.active { background: var(--brass); color: var(--blueprint-dk); border-color: var(--brass); font-weight: 700; box-shadow: 0 0 15px rgba(201,138,62,0.3); }

        /* WORKSPACE: Sidebar + Canvas */
        .workspace {
            display: flex; flex: 1; position: relative; overflow: hidden;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 25px 25px;
        }

        /* DYNAMIC SIDEBAR */
        .sidebar {
            width: 350px; background: var(--paper-bg); color: var(--paper-text);
            border-right: 4px solid var(--brass); display: flex; flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative; z-index: 5; box-shadow: 5px 0 25px rgba(0,0,0,0.5);
        }
        .sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }
        
        .toggle-btn {
            position: absolute; top: 20px; right: -40px; width: 40px; height: 50px;
            background: var(--brass); border: none; border-radius: 0 8px 8px 0;
            color: var(--blueprint-dk); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 4px 0 10px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .toggle-btn:hover { background: var(--brass-lt); width: 45px; right: -45px;}

        .sidebar-content { padding: 20px; overflow-y: auto; flex: 1; }
        .sidebar-content h2 { font-family: 'Fraunces', serif; font-size: 1.4rem; color: var(--blueprint-dk); margin-bottom: 5px; }
        .sidebar-content p { font-size: 0.9rem; line-height: 1.5; color: #4a5a6a; margin-bottom: 15px; }
        
        .data-panel { background: #ffffff; border: 1px solid var(--paper-line); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .data-row { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; padding: 5px 0; border-bottom: 1px dashed #eee; }
        .data-row:last-child { border-bottom: none; }
        
        .badge { display: block; text-align: center; padding: 10px; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; }
        .badge.success { background: #e4f3ea; color: var(--success); border: 1px solid var(--success); }
        .badge.info { background: #e3f2fd; color: #0277bd; border: 1px solid #0277bd; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .action-btn { padding: 8px; border: 1px solid var(--blueprint-md); background: white; border-radius: 6px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; transition: 0.2s; }
        .action-btn:hover { background: var(--blueprint-md); color: white; }

        .proof-box { background: rgba(47, 117, 172, 0.1); border-left: 4px solid var(--blueprint-lt); padding: 12px; border-radius: 0 8px 8px 0; font-size: 0.85rem; }

        /* CANVAS AREA */
        .stage { flex: 1; position: relative; touch-action: none; display: flex; align-items: center; justify-content: center; padding: 20px;}
        .canvas-container {
            width: 100%; max-width: 900px; height: 100%; max-height: 600px;
            background: rgba(4, 18, 32, 0.6); border: 1px solid var(--grid-line-strong);
            border-radius: 12px; box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
        }

        /* SVG STYLING */
        svg { width: 100%; height: 100%; touch-action: none; }
        .axis { stroke: rgba(255,255,255,0.15); stroke-width: 1; }
        .shape-edge { stroke: #f3f7fc; stroke-width: 3; fill: rgba(47, 117, 172, 0.3); stroke-linejoin: round; }
        .diag-line { stroke: var(--brass); stroke-width: 2; stroke-dasharray: 6 6; }
        .ang-arc { fill: var(--brass-glow); stroke: var(--brass-lt); stroke-width: 1.5; }
        .vtx-handle { cursor: grab; fill: var(--brass); stroke: #fff; stroke-width: 2; transition: r 0.1s; }
        .vtx-handle:hover { r: 10; fill: var(--brass-lt); }
        .vtx-handle:active { cursor: grabbing; r: 12; }
        
        /* TEXT IN SVG */
        .svg-label { font-family: 'IBM Plex Mono', monospace; font-weight: bold; font-size: 14px; fill: white; pointer-events: none; }
        .svg-text-bg { paint-order: stroke; stroke: var(--blueprint-dk); stroke-width: 4; }

    </style>
</head>
<body>

    <header>
        <div class="brand-area">
            <a href="../index.html" class="back-btn">← E-Lab</a>
            <div class="module-title">
                <h1>Quadrilaterals Drafting Lab</h1>
                <p>CLASS 8 · CHAPTER 04 · INTERACTIVE ENGINE</p>
            </div>
        </div>
    </header>

    <div class="tabs-bar" id="tabsBar">
        <!-- Tabs generated dynamically via JS -->
    </div>

    <div class="workspace">
        <aside class="sidebar" id="sidebar">
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            <div class="sidebar-content" id="sidebarContent">
                <!-- HTML Injected by JavaScript Engine -->
            </div>
        </aside>

        <main class="stage">
            <div class="canvas-container">
                <svg id="draftingBoard" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
        </main>
    </div>

    <!-- ============================================================
         JAVASCRIPT GEOMETRY ENGINE (THE "HEAVY DEV" ARCHITECTURE)
         ============================================================ -->
    <script>
        // --- 1. CORE MATH & UTILITIES ---
        const MathUtils = {
            distance: (p1, p2) => Math.hypot(p2.x - p1.x, p2.y - p1.y),
            angleBetween: (p1, center, p2) => {
                const a = Math.atan2(p1.y - center.y, p1.x - center.x);
                const b = Math.atan2(p2.y - center.y, p2.x - center.x);
                let ang = b - a;
                if (ang < 0) ang += 2 * Math.PI;
                return ang;
            },
            interiorAngles: (pts) => {
                const angles = [];
                const n = pts.length;
                for(let i=0; i<n; i++) {
                    const prev = pts[(i-1+n)%n], curr = pts[i], next = pts[(i+1)%n];
                    const v1 = { x: prev.x - curr.x, y: prev.y - curr.y };
                    const v2 = { x: next.x - curr.x, y: next.y - curr.y };
                    const cross = v2.x * v1.y - v2.y * v1.x;
                    const dot = v1.x * v2.x + v1.y * v2.y;
                    let ang = Math.atan2(cross, dot);
                    if(ang < 0) ang += 2 * Math.PI;
                    angles.push(ang * (180 / Math.PI));
                }
                return angles;
            },
            // Generate SVG Arc path string
            describeArc: (x, y, radius, startAngle, endAngle) => {
                const start = { x: x + radius * Math.cos(endAngle), y: y + radius * Math.sin(endAngle) };
                const end = { x: x + radius * Math.cos(startAngle), y: y + radius * Math.sin(startAngle) };
                const largeArcFlag = endAngle - startAngle <= Math.PI ? "0" : "1";
                return `M ${x} ${y} L ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArcFlag} 0 ${end.x} ${end.y} Z`;
            }
        };

        // --- 2. THE SVG CANVAS CONTROLLER ---
        const svg = document.getElementById('draftingBoard');
        const NS = "http://www.w3.org/2000/svg";
        const VB = { w: 800, h: 600 };
        
        function getMousePos(evt) {
            const pt = svg.createSVGPoint();
            pt.x = evt.clientX || (evt.touches && evt.touches[0].clientX);
            pt.y = evt.clientY || (evt.touches && evt.touches[0].clientY);
            return pt.matrixTransform(svg.getScreenCTM().inverse());
        }

        function drawGrid() {
            let gridHTML = '';
            for(let i=0; i<VB.w; i+=50) gridHTML += `<line x1="${i}" y1="0" x2="${i}" y2="${VB.h}" class="axis" />`;
            for(let i=0; i<VB.h; i+=50) gridHTML += `<line x1="0" y1="${i}" x2="${VB.w}" y2="${i}" class="axis" />`;
            return gridHTML;
        }

        // --- 3. MODULE CLASSES (OOP Design) ---

        // MODULE 1: ANGLE SUM (Free dragging)
        class AngleSumModule {
            constructor() {
                this.pts = [{x:200, y:450}, {x:250, y:150}, {x:600, y:100}, {x:650, y:400}];
                this.labels = ['A', 'B', 'C', 'D'];
                this.showProof = false;
            }

            getSidebarHTML() {
                const angles = MathUtils.interiorAngles(this.pts);
                const sum = angles.reduce((a,b)=>a+b, 0);
                
                return `
                    <h2>Angle Sum Property</h2>
                    <p>Drag any vertex to dynamically reshape the quadrilateral. Notice how the total sum is fixed.</p>
                    <div class="badge success">SUM = ${Math.round(sum)}°</div>
                    
                    <div class="data-panel">
                        <div style="font-weight:bold; margin-bottom:8px;">Interior Angles:</div>
                        ${angles.map((a,i) => `<div class="data-row"><span>∠${this.labels[i]}</span> <span>${a.toFixed(1)}°</span></div>`).join('')}
                    </div>

                    <div class="btn-grid">
                        <button class="action-btn" onclick="app.activeModule.setPreset('square')">Square</button>
                        <button class="action-btn" onclick="app.activeModule.setPreset('kite')">Kite</button>
                        <button class="action-btn" onclick="app.activeModule.setPreset('trap')">Trapezium</button>
                        <button class="action-btn" onclick="app.activeModule.setPreset('random')">Random</button>
                    </div>

                    <div class="data-panel" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="app.activeModule.toggleProof()">
                        <strong>Show Diagonal Split</strong>
                        <div style="width:40px; height:20px; background:${this.showProof ? 'var(--brass)' : '#ccc'}; border-radius:10px; position:relative;">
                            <div style="width:16px; height:16px; background:white; border-radius:50%; position:absolute; top:2px; left:${this.showProof ? '22px' : '2px'}; transition:0.2s;"></div>
                        </div>
                    </div>

                    <div class="proof-box">
                        <strong>Theorem:</strong> The sum of angles of a quadrilateral is 360°. Split by a diagonal, it forms 2 triangles (180° + 180° = 360°).
                    </div>
                `;
            }

            setPreset(type) {
                if(type==='square') this.pts = [{x:250,y:450},{x:250,y:150},{x:550,y:150},{x:550,y:450}];
                if(type==='kite') this.pts = [{x:400,y:500},{x:200,y:250},{x:400,y:100},{x:600,y:250}];
                if(type==='trap') this.pts = [{x:150,y:450},{x:300,y:150},{x:500,y:150},{x:650,y:450}];
                if(type==='random') this.pts = this.pts.map(p => ({x: 100 + Math.random()*500, y: 100 + Math.random()*350}));
                app.render();
            }

            toggleProof() { this.showProof = !this.showProof; app.render(); }

            updatePoint(index, newPos) { this.pts[index] = newPos; }

            renderSVG() {
                let html = drawGrid();
                const angles = MathUtils.interiorAngles(this.pts);
                
                // Draw Polygon
                const ptsStr = this.pts.map(p => `${p.x},${p.y}`).join(' ');
                html += `<polygon points="${ptsStr}" class="shape-edge" />`;

                // Draw Proof Diagonal
                if(this.showProof) {
                    html += `<line x1="${this.pts[0].x}" y1="${this.pts[0].y}" x2="${this.pts[2].x}" y2="${this.pts[2].y}" class="diag-line" />`;
                }

                // Draw Angles & Vertices
                this.pts.forEach((p, i) => {
                    const prev = this.pts[(i-1+4)%4], next = this.pts[(i+1)%4];
                    const a1 = Math.atan2(prev.y - p.y, prev.x - p.x);
                    const a2 = Math.atan2(next.y - p.y, next.x - p.x);
                    let start = a1, end = a2;
                    // Ensure arc is inside
                    let cross = (prev.x-p.x)*(next.y-p.y) - (prev.y-p.y)*(next.x-p.x);
                    if(cross > 0) { start = a2; end = a1; }
                    if(end < start) end += 2*Math.PI;
                    
                    html += `<path d="${MathUtils.describeArc(p.x, p.y, 40, start, end)}" class="ang-arc" />`;
                    
                    // Angle Text
                    const midAng = start + (end - start)/2;
                    const tx = p.x + Math.cos(midAng)*65;
                    const ty = p.y + Math.sin(midAng)*65;
                    html += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" class="svg-label svg-text-bg">${angles[i].toFixed(0)}°</text>`;
                    
                    // Vertex Label
                    html += `<text x="${p.x - 20}" y="${p.y - 20}" class="svg-label">${this.labels[i]}</text>`;
                    
                    // Draggable Handle
                    html += `<circle cx="${p.x}" cy="${p.y}" r="8" class="vtx-handle" data-id="${i}" />`;
                });

                return html;
            }
        }

        // MODULE 2: PARALLELOGRAM (Constrained Logic)
        class ParallelogramModule {
            constructor() {
                // A, B, C are free. D is constrained: D = A + (C - B)
                this.pts = [{x:200, y:400}, {x:300, y:150}, {x:600, y:150}, {x:500, y:400}];
                this.labels = ['P', 'Q', 'R', 'S'];
            }

            enforceConstraint(movedIndex, newPos) {
                // Parallelogram logic: Opposite sides are equal vectors.
                // Vector PQ = Vector SR. Therefore R = S + (Q - P)
                if(movedIndex === 0) { // P moved
                    let dx = newPos.x - this.pts[0].x, dy = newPos.y - this.pts[0].y;
                    this.pts = this.pts.map(p => ({x: p.x+dx, y: p.y+dy})); // Translate whole shape
                } else if(movedIndex === 1) { // Q moved
                    this.pts[1] = newPos;
                    this.pts[2] = {x: this.pts[3].x + (this.pts[1].x - this.pts[0].x), y: this.pts[3].y + (this.pts[1].y - this.pts[0].y)};
                } else if(movedIndex === 2) { // R moved
                    this.pts[2] = newPos;
                    this.pts[1] = {x: this.pts[0].x + (this.pts[2].x - this.pts[3].x), y: this.pts[0].y + (this.pts[2].y - this.pts[3].y)};
                } else if(movedIndex === 3) { // S moved
                    this.pts[3] = newPos;
                    this.pts[2] = {x: this.pts[3].x + (this.pts[1].x - this.pts[0].x), y: this.pts[3].y + (this.pts[1].y - this.pts[0].y)};
                }
            }

            updatePoint(index, newPos) { this.enforceConstraint(index, newPos); }

            getSidebarHTML() {
                const len1 = MathUtils.distance(this.pts[0], this.pts[1]);
                const len2 = MathUtils.distance(this.pts[1], this.pts[2]);
                const angles = MathUtils.interiorAngles(this.pts);

                return `
                    <h2>Parallelogram</h2>
                    <p>Drag vertices Q, R, or S. The engine will constrain the shape to maintain parallel opposite sides.</p>
                    <div class="badge info">Adjacent Angles = 180°</div>
                    
                    <div class="data-panel">
                        <div style="font-weight:bold; margin-bottom:8px; color:var(--brass);">Side Lengths:</div>
                        <div class="data-row"><span>PQ (Left)</span> <span>${Math.round(len1)} px</span></div>
                        <div class="data-row"><span>SR (Right)</span> <span>${Math.round(len1)} px</span></div>
                        <div class="data-row"><span>QR (Top)</span> <span>${Math.round(len2)} px</span></div>
                        <div class="data-row"><span>PS (Bottom)</span> <span>${Math.round(len2)} px</span></div>
                    </div>
                    
                    <div class="proof-box">
                        <strong>Observation:</strong> Opposite sides are always equal (PQ = SR, QR = PS). Opposite angles are equal.
                    </div>
                `;
            }

            renderSVG() {
                let html = drawGrid();
                const ptsStr = this.pts.map(p => `${p.x},${p.y}`).join(' ');
                html += `<polygon points="${ptsStr}" class="shape-edge" style="fill:rgba(47, 138, 91, 0.2); stroke: var(--success);" />`;
                
                // Draw Markers/Arrows to denote parallel lines
                // (Omitted complex arrow math for brevity, adding labels instead)

                this.pts.forEach((p, i) => {
                    html += `<text x="${p.x - 20}" y="${p.y - 20}" class="svg-label">${this.labels[i]}</text>`;
                    html += `<circle cx="${p.x}" cy="${p.y}" r="8" class="vtx-handle" data-id="${i}" />`;
                });
                return html;
            }
        }

        // --- 4. MAIN APP CONTROLLER ---
        const app = {
            modules: {
                'angle-sum': new AngleSumModule(),
                'parallelogram': new ParallelogramModule(),
            },
            activeTab: 'angle-sum',
            activeModule: null,
            dragId: -1,

            init() {
                this.renderTabs();
                this.switchTab('angle-sum');
                this.setupEvents();
            },

            renderTabs() {
                const tabs = [
                    { id: 'angle-sum', name: '1. Angle Sum' },
                    { id: 'parallelogram', name: '2. Parallelogram' },
                    { id: 'rhombus', name: '3. Rhombus (Coming Soon)' }
                ];
                let html = '';
                tabs.forEach(t => {
                    html += `<button class="tab-btn ${t.id === this.activeTab ? 'active' : ''}" onclick="app.switchTab('${t.id}')">${t.name}</button>`;
                });
                document.getElementById('tabsBar').innerHTML = html;
            },

            switchTab(tabId) {
                if(!this.modules[tabId]) return; // For 'Coming Soon' tabs
                this.activeTab = tabId;
                this.activeModule = this.modules[tabId];
                this.renderTabs();
                this.render();
            },

            render() {
                document.getElementById('sidebarContent').innerHTML = this.activeModule.getSidebarHTML();
                document.getElementById('draftingBoard').innerHTML = this.activeModule.renderSVG();
            },

            setupEvents() {
                svg.addEventListener('pointerdown', e => {
                    if (e.target.classList.contains('vtx-handle')) {
                        this.dragId = parseInt(e.target.dataset.id);
                        svg.setPointerCapture(e.pointerId);
                        e.preventDefault();
                    }
                });

                svg.addEventListener('pointermove', e => {
                    if (this.dragId === -1) return;
                    let pt = getMousePos(e);
                    // Boundary Constraints
                    pt.x = Math.max(20, Math.min(VB.w - 20, pt.x));
                    pt.y = Math.max(20, Math.min(VB.h - 20, pt.y));
                    
                    this.activeModule.updatePoint(this.dragId, pt);
                    this.render();
                });

                const endDrag = () => { this.dragId = -1; };
                svg.addEventListener('pointerup', endDrag);
                svg.addEventListener('pointercancel', endDrag);
            }
        };

        // --- 5. UI UTILITIES ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        // Boot up the engine
        window.onload = () => app.init();

    </script>
</body>
</html>
